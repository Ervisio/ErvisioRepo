version: "2"
sql:
  - engine: postgresql
    schema: migrations
    queries: queries
    gen:
      go:
        package: dbgen
        out: dbgen
        sql_package: pgx/v5
        emit_interface: true
        emit_empty_slices: true
        rename:
          actions_cach: ActionsCache
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: uuid
            nullable: true
            go_type: github.com/google/uuid.NullUUID
