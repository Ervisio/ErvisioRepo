# Ervisio Repo production stack. Use ./setup.sh (or setup.bat) to generate .env
# and config/, then start it with: docker compose up -d --wait. The app image is
# pulled from GHCR; `docker compose up -d --build --wait` builds it from this
# checkout instead. ERVISIO_VERSION defaults to the release this file ships with.
name: ervisiorepo

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

x-app: &app
  build:
    context: ../..
    dockerfile: Dockerfile
    args:
      VERSION: ${ERVISIO_VERSION:-1.23.0}
      COMMIT: ${ERVISIO_COMMIT:-unknown}
    image: ghcr.io/ervisio/ervisio-repo:${ERVISIO_VERSION:-1.23.0}
  user: "${ERVISIO_UID:-1001}:${ERVISIO_GID:-1001}"
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  logging: *logging

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ervisio_repo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run setup.sh first}
      POSTGRES_DB: ervisio_repo
    volumes:
      - ${ERVISIO_DATA_DIR:-./data}/postgres:/var/lib/postgresql/data
    networks: [private]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ervisio_repo -d ervisio_repo"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *logging

  app:
    <<: *app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      EREPO_DATABASE_URL: postgres://ervisio_repo:${POSTGRES_PASSWORD:?run setup.sh first}@postgres:5432/ervisio_repo?sslmode=disable
      ERVISIO_UPSTREAM_HOST: ${BIND_ADDRESS:-127.0.0.1}
      ERVISIO_UPSTREAM_PORT: ${APP_PORT:-3400}
      ERVISIO_UPSTREAM_CONTAINER: ervisiorepo-app
      ERVISIO_UPSTREAM_NETWORK: ervisiorepo_edge
      # Admin > Updates: Docker installation, and its host folder for the
      # manual update command.
      ERVISIO_DEPLOY: docker
      ERVISIO_DEPLOY_DIR: ${ERVISIO_DEPLOY_DIR:-}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-3400}:3400"
      - "${BIND_ADDRESS:-127.0.0.1}:${SSH_PORT:-2222}:2222"
    volumes:
      - ./config:/etc/ervisio-repo
      - ${ERVISIO_DATA_DIR:-./data}/repo:/var/lib/ervisio-repo
      - ${ERVISIO_SOCKET_DIR:-./run}:/run/ervisio-repo
    networks:
      private:
      edge:
        aliases: [ervisiorepo-app]

  # Optional updater (--profile updater; setup.sh adds it to COMPOSE_PROFILES).
  # Admin > Updates hands it the version to install through
  # run/updater/request.json; it runs update.sh (backup, pull, up, rollback on
  # failure). It is the only service besides the runner with the Docker
  # socket, which is root on the host: it publishes no port and is not on the
  # database network. The deploy folder is mounted at its host path so the
  # relative paths of this file resolve to the same host folders.
  updater:
    image: docker:28-cli
    profiles: [updater]
    restart: unless-stopped
    working_dir: ${ERVISIO_DEPLOY_DIR:-/ervisio-deploy-dir-not-set}
    entrypoint: ["sh", "${ERVISIO_DEPLOY_DIR:-/ervisio-deploy-dir-not-set}/updater.sh"]
    environment:
      ERVISIO_DEPLOY_DIR: ${ERVISIO_DEPLOY_DIR:-}
      ERVISIO_UID: ${ERVISIO_UID:-1001}
      ERVISIO_GID: ${ERVISIO_GID:-1001}
    volumes:
      - ${ERVISIO_DEPLOY_DIR:-.}:${ERVISIO_DEPLOY_DIR:-/ervisio-deploy-dir-not-set}
      - ${ERVISIO_SOCKET_DIR:-./run}:/run/ervisio-repo
      - /var/run/docker.sock:/var/run/docker.sock
    # edge only: GitHub for the new compose files, the registry for images.
    networks: [edge]
    security_opt:
      - no-new-privileges:true
    logging: *logging

  # Optional continuous WAL archiving and daily base backups: --profile backup.
  walg:
    image: postgres:16-alpine
    profiles: [backup]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: ./config/walg.env
        required: false
    volumes:
      - ${ERVISIO_DATA_DIR:-./data}/postgres:/var/lib/postgresql/data:ro
    networks: [private]
    security_opt:
      - no-new-privileges:true
    entrypoint: ["sh", "-c", "echo 'configure config/walg.env and a wal-g image before enabling this profile'; sleep infinity"]
    logging: *logging

  # Built-in Actions runner, jobs run in containers on the host Docker
  # (--profile runner, or COMPOSE_PROFILES=runner written by setup.sh). On
  # first start it registers itself with the token setup.sh writes to
  # data/runner/registration-token (removed after use); the credential and
  # the generated config.toml stay in data/runner.
  runner:
    <<: *app
    profiles: [runner]
    user: "${ERVISIO_UID:-1001}:${DOCKER_GID:-0}"
    depends_on:
      app:
        condition: service_healthy
    entrypoint: ["ervisio-runner"]
    command: ["daemon", "--config", "/var/lib/ervisio-runner/config.toml"]
    healthcheck:
      disable: true
    environment:
      HOME: /var/lib/ervisio-runner
      ERVISIO_RUNNER_URL: http://app:3400
      ERVISIO_RUNNER_NAME: ${RUNNER_NAME:-builtin}
      ERVISIO_RUNNER_DATA_DIR: /var/lib/ervisio-runner
      ERVISIO_RUNNER_LABELS: ${RUNNER_LABELS:-}
      ERVISIO_RUNNER_CAPACITY: ${RUNNER_CAPACITY:-}
    volumes:
      - ${ERVISIO_DATA_DIR:-./data}/runner:/var/lib/ervisio-runner
      - /var/run/docker.sock:/var/run/docker.sock
    # edge gives the runner Internet access (actions are cloned from GitHub).
    networks: [private, edge]

networks:
  private:
    internal: true
  edge:
    name: ervisiorepo_edge
