# yaml-language-server: $schema=https://raw.githubusercontent.com/oapi-codegen/oapi-codegen/HEAD/configuration-schema.json
package: v1gen
output: internal/httpapi/v1gen/api.gen.go
generate:
  chi-server: true
  strict-server: true
  models: true
  embedded-spec: false
output-options:
  skip-prune: false
compatibility:
  # Puts the security scopes of each operation in the request context
  # (v1gen.SessionScopes), read by the authorization middleware.
  enable-auth-scopes-on-context: true
