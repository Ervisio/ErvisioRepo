      operationId: transferRepo
      tags: [repos]
      summary: Move a repository to another user or organization
      description: |
        Admins of the repository who can create repositories in the target.
        Team grants are dropped; the old path redirects.
      security:
        - session: []
        - token: [repo:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RepoTransfer"
      responses:
        "200":
          description: Transferred repository
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Repo"
        "307":
          $ref: "#/components/responses/Moved"
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /repos/{owner}/{name}/collaborators:
