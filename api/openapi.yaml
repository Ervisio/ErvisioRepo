  # --- end branch protection ---
  # --- github sync (tag: github) ---
  # GitHub connections, one-off imports, pull mirrors, backups and
  # bidirectional sync (PLAN §5.6). The webhook receiver
  # POST /api/v1/github/webhook/{connectionId} is mounted outside the
  # generated router: it needs the raw body to verify X-Hub-Signature-256.
  /github/connections:
    get:
      operationId: listGitHubConnections
      tags: [github]
      summary: GitHub connections of a user or organization
      description: |
        owner defaults to the caller. Connections of an organization are
        visible to its owners and admins.
      security:
        - session: []
        - token: [user:read]
      parameters:
        - name: owner
          in: query
          schema: {type: string, maxLength: 39}
      responses:
        "200":
          description: Connections
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/GitHubConnection"}
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createGitHubConnection
      tags: [github]
      summary: Connect a GitHub App installation or a fine-grained token
      description: |
        The credentials are encrypted with the instance master key (503
        without one) and never returned. The response carries the webhook
        secret once, to configure on GitHub with the webhookUrl. A baseUrl
        other than https://github.com (GitHub Enterprise Server) needs an
        instance admin.
      security:
        - session: []
        - token: [user:write]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/GitHubConnectionCreate"}
      responses:
        "201":
          description: Connection created
          content:
            application/json:
              schema: {$ref: "#/components/schemas/GitHubConnection"}
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /github/connections/{connectionId}:
    parameters:
      - name: connectionId
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      operationId: getGitHubConnection
      tags: [github]
      summary: A GitHub connection
      security:
        - session: []
        - token: [user:read]
      responses:
        "200":
          description: Connection
          content:
            application/json:
              schema: {$ref: "#/components/schemas/GitHubConnection"}
        "404":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateGitHubConnection
      tags: [github]
      summary: Rename a connection, replace its credentials or rotate the webhook secret
      security:
        - session: []
        - token: [user:write]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/GitHubConnectionUpdate"}
      responses:
        "200":
          description: Updated connection (with the new webhook secret when rotated)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/GitHubConnection"}
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteGitHubConnection
      tags: [github]
      summary: Delete a connection that no repository uses (409 otherwise)
      security:
        - session: []
        - token: [user:write]
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /github/connections/{connectionId}/check:
    parameters:
      - name: connectionId
        in: path
        required: true
        schema: {type: string, format: uuid}
    post:
      operationId: checkGitHubConnection
      tags: [github]
      summary: Verify the credentials of a connection against GitHub
      security:
        - session: []
        - token: [user:write]
      responses:
        "200":
          description: Result of the check
          content:
            application/json:
              schema: {$ref: "#/components/schemas/GitHubConnectionCheck"}
        "404":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /github/imports:
    post:
      operationId: importGitHubRepo
      tags: [github]
      summary: Import the git data of a GitHub repository into a new repository
      description: |
        Creates the repository (the same rules as POST /user/repos or
        /orgs/{org}/repos apply) and fetches every branch and tag in the
        background through the normal write path. Issues, pull requests,
        labels, milestones and releases are not imported yet.
      security:
        - session: []
        - token: [repo:write]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/GitHubImportCreate"}
      responses:
        "202":
          description: Import scheduled
          content:
            application/json:
              schema: {$ref: "#/components/schemas/GitHubImport"}
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /repos/{owner}/{name}/github/import:
    parameters:
      - $ref: "#/components/parameters/RepoOwner"
      - $ref: "#/components/parameters/RepoName"
    get:
      operationId: getGitHubImport
      tags: [github]
      summary: Status of the import that created the repository
      security:
        - session: []
        - token: [repo:read]
      responses:
        "200":
          description: Import
          content:
            application/json:
              schema: {$ref: "#/components/schemas/GitHubImport"}
        "404":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /repos/{owner}/{name}/github/sync:
    parameters:
      - $ref: "#/components/parameters/RepoOwner"
      - $ref: "#/components/parameters/RepoName"
    get:
      operationId: getGitHubSyncLink
      tags: [github]
      summary: The GitHub sync link of a repository (404 when none)
      security:
        - session: []
        - token: [repo:read]
      responses:
        "200":
          description: Link
          content:
            application/json:
              schema: {$ref: "#/components/schemas/GitHubSyncLink"}
        "404":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    put:
      operationId: putGitHubSyncLink
      tags: [github]
      summary: Create or replace the GitHub sync link of a repository
      description: |
        Needs admin on the repository and a connection of the repository
        owner or of the caller. mirror makes the repository read-only
        (pushes are refused); backup pushes branches and tags to GitHub
        after every push; sync does both, fast-forward only.
      security:
        - session: []
        - token: [repo:write]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/GitHubSyncLinkPut"}
      responses:
        "200":
          description: Link
          content:
            application/json:
              schema: {$ref: "#/components/schemas/GitHubSyncLink"}
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteGitHubSyncLink
      tags: [github]
      summary: Remove the GitHub sync link (the GitHub repository is untouched)
      security:
        - session: []
        - token: [repo:write]
      responses:
        "204":
          description: Removed
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /repos/{owner}/{name}/github/sync/refs:
    parameters:
      - $ref: "#/components/parameters/RepoOwner"
      - $ref: "#/components/parameters/RepoName"
    get:
      operationId: listGitHubSyncRefs
      tags: [github]
      summary: Per-ref state of the GitHub sync link
      security:
        - session: []
        - token: [repo:read]
      responses:
        "200":
          description: Refs
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/GitHubSyncRef"}
        "404":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /repos/{owner}/{name}/github/sync/run:
    parameters:
      - $ref: "#/components/parameters/RepoOwner"
      - $ref: "#/components/parameters/RepoName"
    post:
      operationId: runGitHubSync
      tags: [github]
      summary: Run the GitHub sync link now (clears the backoff)
      security:
        - session: []
        - token: [repo:write]
      responses:
        "202":
          description: Run scheduled
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /repos/{owner}/{name}/github/sync/resolve:
    parameters:
      - $ref: "#/components/parameters/RepoOwner"
      - $ref: "#/components/parameters/RepoName"
    post:
      operationId: resolveGitHubSyncConflict
      tags: [github]
      summary: Resolve a diverged branch of a sync link
      description: |
        keep_ervisio pushes the local branch to GitHub (force);
        keep_github moves the local branch to the GitHub commit (force,
        under the write lease, through the normal write path); the commit
        replaced on either side stays reachable from
        refs/heads/sync-conflict/<side>/<branch>. merge_request records
        that the branch is to be merged by hand from
        refs/heads/sync-conflict/github/<branch>.
      security:
        - session: []
        - token: [repo:write]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/GitHubSyncResolve"}
      responses:
        "200":
          description: Updated ref state
          content:
            application/json:
              schema: {$ref: "#/components/schemas/GitHubSyncRef"}
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  # --- end github sync ---
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: __Host-erepo_session
      description: |
        Opaque session cookie set by POST /auth/login. When the public URL is
        plain http on a non-loopback host the cookie is named erepo_session.
        Requests with an unsafe method must send the X-CSRF-Token header with
        the value of the erepo_csrf cookie (__Host-erepo_csrf on https).
    token:
      type: http
      scheme: bearer
      description: |
        Personal access token (erp_...) in "Authorization: Bearer". Only the
        operations that list the token scheme accept it, and the token must
        hold every scope listed there. Tokens skip the CSRF check.
  parameters:
    # --- branch protection parameters ---
    ProtectionRuleId:
      name: ruleId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    # --- end branch protection parameters ---
    RepoOwner:
      name: owner
      in: path
      required: true
      description: User or organization name
      schema:
        type: string
        maxLength: 39
    RepoName:
      name: name
      in: path
      required: true
      schema:
        type: string
        maxLength: 100
    PageOffset:
      name: offset
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
    PageLimit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 30
    CredentialID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OrgName:
      name: org
      in: path
      required: true
      schema:
        type: string
        maxLength: 39
    TeamName:
      name: team
      in: path
      required: true
      schema:
        type: string
        maxLength: 39
    Username:
      name: username
      in: path
      required: true
      schema:
        type: string
        maxLength: 39
    AuditBefore:
      name: before
      in: query
      description: Cursor; the next value of the previous page
      schema:
        type: string
        format: uuid
    AuditLimit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    AuditAction:
      name: action
      in: query
      description: Exact action, or a prefix ending with "." (e.g. org.)
      schema:
        type: string
        maxLength: 100
    CodeRef:
      name: ref
      in: query
      description: Branch, tag or commit id; empty means the default branch
      schema:
        type: string
        maxLength: 255
    CodePath:
      name: path
      in: query
      description: Directory path; empty means the root
      schema:
        type: string
        maxLength: 4096
    CodeFilePath:
      name: path
      in: query
      required: true
      description: File path
      schema:
        type: string
        minLength: 1
        maxLength: 4096
  responses:
    Moved:
      description: |
        The repository was renamed or transferred; Location is its new URL
        (301 for GET, 307 for the other methods, which must be repeated there).
      headers:
        Location:
          required: true
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Problem:
      description: Error in RFC 9457 format
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    TooManyRequests:
      description: Too many attempts; retry after the given number of seconds
      headers:
        Retry-After:
          required: true
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unavailable:
      description: |
        The repository is being restored from the remote store or is busy;
        retry after the given number of seconds (absent when degraded).
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    # --- github sync schemas ---
    GitHubConnection:
      type: object
      required: [id, owner, ownerKind, name, kind, baseUrl, webhookUrl, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        owner: {type: string}
        ownerKind: {type: string, enum: [user, org]}
        name: {type: string}
        kind: {type: string, enum: [app, token]}
        baseUrl: {type: string, description: Web URL of github.com or of a GitHub Enterprise Server}
        appId: {type: integer, format: int64}
        installationId: {type: integer, format: int64}
        webhookUrl: {type: string, description: Payload URL to configure on GitHub (content type application/json)}
        webhookSecret:
          type: string
          description: Only in the response that created or rotated it
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    GitHubConnectionCreate:
      type: object
      required: [name, kind]
      properties:
        owner: {type: string, maxLength: 39, description: User or organization; the caller when empty}
        name: {type: string, minLength: 1, maxLength: 100}
        kind: {type: string, enum: [app, token]}
        baseUrl: {type: string, maxLength: 255}
        appId: {type: integer, format: int64, minimum: 1}
        installationId: {type: integer, format: int64, minimum: 1}
        privateKey: {type: string, maxLength: 16384, description: PEM private key of the GitHub App (app)}
        token: {type: string, maxLength: 1024, description: Fine-grained personal access token (token)}
        webhookSecret: {type: string, minLength: 16, maxLength: 256, description: Generated when empty}
    GitHubConnectionUpdate:
      type: object
      properties:
        name: {type: string, minLength: 1, maxLength: 100}
        appId: {type: integer, format: int64, minimum: 1}
        installationId: {type: integer, format: int64, minimum: 1}
        privateKey: {type: string, maxLength: 16384}
        token: {type: string, maxLength: 1024}
        rotateWebhookSecret: {type: boolean}
    GitHubConnectionCheck:
      type: object
      required: [ok]
      properties:
        ok: {type: boolean}
        detail: {type: string, description: Why the check failed}
    GitHubImportCreate:
      type: object
      required: [connectionId, remoteOwner, remoteName]
      properties:
        connectionId: {type: string, format: uuid}
        remoteOwner: {type: string, maxLength: 39}
        remoteName: {type: string, maxLength: 100}
        owner: {type: string, maxLength: 39, description: Owner of the new repository; the caller when empty}
        name: {type: string, maxLength: 100, description: Name of the new repository; remoteName when empty}
        description: {type: string, maxLength: 1000}
        visibility: {$ref: "#/components/schemas/Visibility"}
    GitHubImport:
      type: object
      required: [id, repoId, repoFullName, remoteOwner, remoteName, status, lastError, createdAt]
      properties:
        id: {type: string, format: uuid}
        repoId: {type: string, format: uuid}
        repoFullName: {type: string}
        remoteOwner: {type: string}
        remoteName: {type: string}
        status: {type: string, enum: [pending, running, done, error]}
        lastError: {type: string}
        createdAt: {type: string, format: date-time}
        startedAt: {type: string, format: date-time}
        finishedAt: {type: string, format: date-time}
    GitHubSyncMode:
      type: string
      enum: [mirror, backup, sync]
    GitHubSyncLink:
      type: object
      required: [connectionId, mode, remoteOwner, remoteName, prune, trustGithub, createMissing, intervalMinutes,
        enabled, readOnly, status, lastError, failures, lfsSkipped, createdAt, updatedAt]
      properties:
        connectionId: {type: string, format: uuid}
        mode: {$ref: "#/components/schemas/GitHubSyncMode"}
        remoteOwner: {type: string}
        remoteName: {type: string}
        prune: {type: boolean}
        trustGithub:
          type: array
          items: {type: string}
        createMissing: {type: boolean}
        intervalMinutes: {type: integer}
        enabled: {type: boolean}
        readOnly: {type: boolean, description: Pushes are refused (mirror)}
        status: {type: string, enum: [pending, ok, diverged, error]}
        lastError: {type: string}
        failures: {type: integer}
        nextAttemptAt: {type: string, format: date-time}
        lastRunAt: {type: string, format: date-time}
        lastSuccessAt: {type: string, format: date-time}
        lfsSkipped:
          type: boolean
          description: The repository has Git LFS objects, which are not sent to GitHub
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    GitHubSyncLinkPut:
      type: object
      required: [connectionId, mode, remoteOwner, remoteName]
      properties:
        connectionId: {type: string, format: uuid}
        mode: {$ref: "#/components/schemas/GitHubSyncMode"}
        remoteOwner: {type: string, maxLength: 39}
        remoteName: {type: string, maxLength: 100}
        prune: {type: boolean, default: false, description: Propagate branch and tag deletions}
        trustGithub:
          type: array
          maxItems: 50
          description: Branch patterns (sync) on which GitHub wins a divergence
          items: {type: string, maxLength: 255}
        createMissing:
          type: boolean
          default: false
          description: Create the GitHub repository (private) when it does not exist (backup, sync)
        intervalMinutes: {type: integer, minimum: 10, maximum: 10080, default: 10}
        enabled: {type: boolean, default: true}
    GitHubSyncRef:
      type: object
      required: [ref, localSha, remoteSha, status, lastError, retries, resolution, updatedAt]
      properties:
        ref: {type: string}
        localSha: {type: string}
        remoteSha: {type: string}
        status: {type: string, enum: [ok, diverged, error]}
        lastError: {type: string}
        retries: {type: integer}
        conflictRef: {type: string, description: Branch holding the GitHub commit of a divergence}
        conflictSha: {type: string}
        resolution: {type: string, enum: ["", merge_request]}
        updatedAt: {type: string, format: date-time}
    GitHubSyncResolve:
      type: object
      required: [ref, resolution]
      properties:
        ref: {type: string, maxLength: 255, description: Full ref name (refs/heads/...)}
        resolution: {type: string, enum: [keep_ervisio, keep_github, merge_request]}
    # --- end github sync schemas ---
    OidcProvider:
      type: object
      required: [name, label]
      properties:
        name:
          type: string
        label:
          type: string
    OidcLink:
      type: object
      required: [id, provider, label, createdAt]
      properties:
        id:
          type: string
          format: uuid
        provider:
          type: string
        label:
          type: string
        email:
          type: string
          description: Email address reported by the provider, if any
        createdAt:
          type: string
          format: date-time
        lastLoginAt:
          type: string
          format: date-time
    OidcLinkRequest:
      type: object
      properties:
        returnTo:
          type: string
          maxLength: 2000
          description: Local path to return to after the provider (default /settings)
    OidcRedirect:
      type: object
      required: [url]
      properties:
        url:
          type: string
          format: uri
    AccessToken:
      type: object
      required: [id, name, hint, scopes, expiresAt, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        hint:
          type: string
          description: First characters of the token (erp_ and four more)
        scopes:
          type: array
          items:
            type: string
        expiresAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
    AccessTokenCreate:
      type: object
      required: [name, scopes, expiresAt]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        scopes:
          type: array
          minItems: 1
          maxItems: 8
          items:
            type: string
            enum: [user:read, user:write, repo:read, repo:write, packages:read, packages:write, actions:write, admin]
        expiresAt:
          type: string
          format: date-time
          description: Required; at most the configured maximum lifetime from now
    CreatedAccessToken:
      type: object
      required: [token, secret]
      properties:
        token:
          $ref: "#/components/schemas/AccessToken"
        secret:
          type: string
          description: The token (erp_...), shown only once; send it as "Authorization Bearer"
    SshKey:
      type: object
      required: [id, title, type, fingerprint, publicKey, createdAt]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        type:
          type: string
          example: ssh-ed25519
        fingerprint:
          type: string
          example: SHA256:nThbg6kXUpJWGl7E1IGOCspRomTxdCARLviKw6E5SY8
        publicKey:
          type: string
        bits:
          type: integer
        lastUsedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
    SshKeyCreate:
      type: object
      required: [title, key]
      properties:
        title:
          type: string
          maxLength: 100
          description: Empty uses the key comment, or the key type
        key:
          type: string
          maxLength: 16384
    GpgKey:
      type: object
      required: [id, keyId, fingerprint, subkeyIds, emails, verifiedEmails, createdAt]
      properties:
        id:
          type: string
          format: uuid
        keyId:
          type: string
          example: 3AA5C34371567BD2
        fingerprint:
          type: string
        subkeyIds:
          type: array
          items:
            type: string
        emails:
          type: array
          items:
            type: string
        verifiedEmails:
          type: array
          description: The emails that are verified addresses of the account
          items:
            type: string
        expiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
    GpgKeyCreate:
      type: object
      required: [armoredKey]
      properties:
        armoredKey:
          type: string
          maxLength: 65536
    RegisterRequest:
      type: object
      required: [username, email, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 39
          description: Letters, digits and single inner hyphens; shared namespace with organizations
        email:
          type: string
          minLength: 3
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 1024
        inviteToken:
          type: string
          maxLength: 128
          description: Required when registration is "invite"
        locale:
          type: string
          enum: [en, it]
    RegisterAccepted:
      type: object
      required: [verificationRequired]
      properties:
        verificationRequired:
          type: boolean
          description: True when the address must be confirmed by mail before signing in
    LoginRequest:
      type: object
      required: [login, password]
      properties:
        login:
          type: string
          minLength: 1
          maxLength: 254
          description: Username or email address
        password:
          type: string
          minLength: 1
          maxLength: 1024
    TokenRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 128
    EmailRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          minLength: 3
          maxLength: 254
    ResetPasswordRequest:
      type: object
      required: [token, password]
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 128
        password:
          type: string
          minLength: 1
          maxLength: 1024
    InviteRequest:
      type: object
      properties:
        email:
          type: string
          maxLength: 254
          description: When set, only this address can use the invitation
    Invite:
      type: object
      required: [id, token, expiresAt]
      properties:
        id:
          type: string
          format: uuid
        token:
          type: string
          description: Shown only once
        email:
          type: string
        expiresAt:
          type: string
          format: date-time
    User:
      type: object
      required: [id, username, displayName, role, locale, emailVerified, createdAt]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        displayName:
          type: string
        role:
          type: string
          enum: [admin, user, restricted]
        locale:
          type: string
          enum: [en, it]
        avatarUrl:
          type: string
          description: Absolute https URL of the avatar; empty when unset
        email:
          type: string
          description: Primary email address
        emailVerified:
          type: boolean
        createdAt:
          type: string
          format: date-time
    ProfileUpdate:
      type: object
      required: [displayName, locale]
      properties:
        displayName:
          type: string
          maxLength: 100
        avatarUrl:
          type: string
          maxLength: 2048
          description: Absolute https URL, or empty to clear
        locale:
          type: string
          enum: [en, it]
    PasswordChange:
      type: object
      required: [newPassword]
      properties:
        currentPassword:
          type: string
          maxLength: 1024
        newPassword:
          type: string
          minLength: 1
          maxLength: 1024
    SessionInfo:
      type: object
      required: [id, current, ip, userAgent, createdAt, lastSeenAt, expiresAt]
      properties:
        id:
          type: string
          format: uuid
        current:
          type: boolean
        ip:
          type: string
        userAgent:
          type: string
        createdAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
    EmailAddress:
      type: object
      required: [id, address, primary, verified, createdAt]
      properties:
        id:
          type: string
          format: uuid
        address:
          type: string
        primary:
          type: boolean
        verified:
          type: boolean
        createdAt:
          type: string
          format: date-time
    StorageStatus:
      type: object
      required: [targets, policies, caches, warnings]
      properties:
        targets:
          type: array
          items:
            $ref: "#/components/schemas/StorageTarget"
        policies:
          type: array
          items:
            $ref: "#/components/schemas/StoragePolicy"
        caches:
          type: array
          items:
            $ref: "#/components/schemas/StorageCache"
        warnings:
          type: array
          description: Permanent configuration warnings, such as storage_local_only
          items:
            $ref: "#/components/schemas/StorageWarning"
    StorageTarget:
      type: object
      required: [name, kind, encrypted, roles, caps]
      properties:
        name:
          type: string
        kind:
          type: string
          enum: [local, s3, sftp, webdav]
        encrypted:
          type: boolean
        roles:
          type: array
          description: Uses of this target, as primary:<policy>, replica:<policy> or cache:<policy>
          items:
            type: string
        caps:
          $ref: "#/components/schemas/StorageCaps"
    StorageCaps:
      type: object
      required: [range, presign, multipart, atomicRename, conditionalPut, maxConns]
      properties:
        range:
          type: boolean
        presign:
          type: boolean
        multipart:
          type: boolean
        atomicRename:
          type: boolean
        conditionalPut:
          type: boolean
        maxConns:
          type: integer
          description: Connection limit, 0 means unlimited
    StoragePolicy:
      type: object
      required: [name, primary, replicas, cacheTtlSeconds, cacheShare, durability, objects, bytes, pendingReplicas, errors]
      properties:
        name:
          type: string
          description: Data type, such as git, lfs or registry
        primary:
          type: string
        replicas:
          type: array
          items:
            type: string
        cache:
          type: string
        cacheTtlSeconds:
          type: integer
          format: int64
        cacheShare:
          type: number
          format: double
        durability:
          type: string
        objects:
          type: integer
          format: int64
        bytes:
          type: integer
          format: int64
        pendingReplicas:
          type: integer
          format: int64
        errors:
          type: integer
          format: int64
          description: Objects whose last replication or verification failed
    StorageCache:
      type: object
      required: [target, budget, used, entries, highWatermark, lowWatermark, usedBy]
      properties:
        target:
          type: string
        budget:
          type: integer
          format: int64
          description: Budget in bytes, 0 means unlimited
        used:
          type: integer
          format: int64
        entries:
          type: integer
        highWatermark:
          type: number
          format: double
        lowWatermark:
          type: number
          format: double
        usedBy:
          type: object
          description: Bytes used per data type
          additionalProperties:
            type: integer
            format: int64
    StorageWarning:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum: [storage_not_configured, storage_local_only, storage_policy_local]
        policy:
          type: string
        message:
          type: string
    RepoTiering:
      type: object
      required: [state, pinned, sizeBytes, manifestSeq]
      properties:
        state:
          type: string
          enum: [hot, cold, hydrating, evicting, degraded]
        pinned:
          type: boolean
        sizeBytes:
          type: integer
          format: int64
        manifestSeq:
          type: integer
          format: int64
          description: Last pack journal sequence recorded for the repository.
    StorageCheckResult:
      type: object
      required: [target, ok, durationMs, steps]
      properties:
        target:
          type: string
        ok:
          type: boolean
        durationMs:
          type: integer
          format: int64
        steps:
          type: array
          items:
            $ref: "#/components/schemas/StorageCheckStep"
    StorageCheckStep:
      type: object
      required: [name, ok, durationMs]
      properties:
        name:
          type: string
          enum: [put, stat, get, range, list, delete]
        ok:
          type: boolean
        durationMs:
          type: integer
          format: int64
        error:
          type: string
    Meta:
      type: object
      required: [name, version, instanceId, publicUrl, registration]
      properties:
        name:
          type: string
          example: ErvisioRepo
        version:
          type: string
          example: 0.1.0
        commit:
          type: string
          description: VCS revision the binary was built from, if known
        instanceId:
          type: string
          format: uuid
          description: Stable UUID v7 generated on first start and stored in the settings table
        publicUrl:
          type: string
          format: uri
        registration:
          type: string
          enum: [open, invite, closed]
    MfaChallenge:
      type: object
      required: [methods, enrollmentRequired, expiresAt]
      description: |
        A login waiting for its second factor. The pending state lives in
        the HttpOnly erepo_mfa cookie (__Host-erepo_mfa on https), never in
        a session cookie.
      properties:
        methods:
          type: array
          items:
            type: string
            enum: [totp, webauthn, recovery]
        enrollmentRequired:
          type: boolean
          description: Policy requires a second factor and the account has none; set up an authenticator app to continue
        expiresAt:
          type: string
          format: date-time
    CodeRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 64
    ReauthRequest:
      type: object
      description: Either the password or a current authenticator app or recovery code
      properties:
        password:
          type: string
          maxLength: 1024
        code:
          type: string
          maxLength: 64
    TotpSetup:
      type: object
      required: [secret, uri]
      properties:
        secret:
          type: string
          description: Base32 secret for manual entry
        uri:
          type: string
          description: otpauth:// URI for a QR code
    RecoveryCodes:
      type: object
      required: [codes]
      properties:
        codes:
          type: array
          description: Shown only once; empty when existing codes were kept
          items:
            type: string
    MfaEnrollResult:
      type: object
      required: [user, recoveryCodes]
      properties:
        user:
          $ref: "#/components/schemas/User"
        recoveryCodes:
          type: array
          items:
            type: string
    WebAuthnOptions:
      type: object
      required: [options]
      properties:
        options:
          type: object
          additionalProperties: true
          description: PublicKeyCredentialRequestOptions wrapper ({publicKey}), binary fields in base64url
    WebAuthnCredentialRequest:
      type: object
      required: [credential]
      properties:
        credential:
          type: object
          additionalProperties: true
          description: PublicKeyCredential JSON (toJSON), binary fields in base64url
    PasskeyChallenge:
      type: object
      required: [challenge, options]
      properties:
        challenge:
          type: string
          description: Ceremony token to send back with the response
        options:
          type: object
          additionalProperties: true
    PasskeyLoginRequest:
      type: object
      required: [challenge, credential]
      properties:
        challenge:
          type: string
          minLength: 1
          maxLength: 128
        credential:
          type: object
          additionalProperties: true
    PasskeyRegisterRequest:
      type: object
      required: [challenge, name, credential]
      properties:
        challenge:
          type: string
          minLength: 1
          maxLength: 128
        name:
          type: string
          minLength: 1
          maxLength: 64
        credential:
          type: object
          additionalProperties: true
    Passkey:
      type: object
      required: [id, name, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
    SecurityStatus:
      type: object
      required: [totp, totpPending, passkeys, recoveryCodesLeft, recoveryCodesTotal, required, webauthnAvailable]
      properties:
        totp:
          type: boolean
          description: An authenticator app is enabled
        totpPending:
          type: boolean
          description: An authenticator app setup waits for its first code
        passkeys:
          type: array
          items:
            $ref: "#/components/schemas/Passkey"
        recoveryCodesLeft:
          type: integer
        recoveryCodesTotal:
          type: integer
        required:
          type: boolean
          description: Policy (instance or organization) requires a second factor
        webauthnAvailable:
          type: boolean
    Visibility:
      type: string
      enum: [public, internal, private]
    Repo:
      type: object
      required: [id, owner, ownerKind, name, fullName, description, visibility, defaultBranch, storageState,
        sizeBytes, permission, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        owner:
          type: string
        ownerKind:
          type: string
          enum: [user, org]
        name:
          type: string
        fullName:
          type: string
          description: owner/name
        description:
          type: string
        visibility:
          $ref: "#/components/schemas/Visibility"
        defaultBranch:
          type: string
        storageState:
          type: string
          enum: [hot, cold, hydrating, evicting, degraded]
          description: Where the git data is; cold repositories are restored on first access.
        sizeBytes:
          type: integer
          format: int64
        permission:
          $ref: "#/components/schemas/Permission"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    RepoCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 100
        description:
          type: string
          maxLength: 1000
        visibility:
          $ref: "#/components/schemas/Visibility"
        defaultBranch:
          type: string
          maxLength: 255
    RepoUpdate:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
        description:
          type: string
          maxLength: 1000
        visibility:
          $ref: "#/components/schemas/Visibility"
        defaultBranch:
          type: string
          maxLength: 255
    RepoTransfer:
      type: object
      required: [newOwner]
      properties:
        newOwner:
          type: string
          maxLength: 39
        newName:
          type: string
          maxLength: 100
          description: Defaults to the current name
    RepoCollaborator:
      type: object
      required: [username, displayName, permission, since]
      properties:
        username:
          type: string
        displayName:
          type: string
        permission:
          $ref: "#/components/schemas/Permission"
        since:
          type: string
          format: date-time
    RepoPermissionRequest:
      type: object
      required: [permission]
      properties:
        permission:
          type: string
          enum: [read, triage, write, maintain, admin]
    OrgRole:
      type: string
      enum: [owner, admin, member]
    Permission:
      type: string
      enum: [none, read, triage, write, maintain, admin]
    Org:
      type: object
      required: [id, name, displayName, description, basePermission, require2fa, verified, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        displayName:
          type: string
        description:
          type: string
        basePermission:
          $ref: "#/components/schemas/Permission"
        require2fa:
          type: boolean
          description: Members must have a second factor; enforced from their next sign-in.
        verified:
          type: boolean
        role:
          $ref: "#/components/schemas/OrgRole"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    OrgCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 39
        displayName:
          type: string
          maxLength: 100
        description:
          type: string
          maxLength: 1000
    OrgUpdate:
      type: object
      properties:
        displayName:
          type: string
          maxLength: 100
        description:
          type: string
          maxLength: 1000
        basePermission:
          $ref: "#/components/schemas/Permission"
        require2fa:
          type: boolean
          description: Owners only. Requires a second factor from every member.
    OrgMember:
      type: object
      required: [username, displayName, role, since]
      properties:
        username:
          type: string
        displayName:
          type: string
        role:
          $ref: "#/components/schemas/OrgRole"
        since:
          type: string
          format: date-time
    OrgRoleRequest:
      type: object
      required: [role]
      properties:
        role:
          $ref: "#/components/schemas/OrgRole"
    Team:
      type: object
      required: [id, name, description, members, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        members:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    TeamCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 39
        description:
          type: string
          maxLength: 1000
    TeamUpdate:
      type: object
      properties:
        name:
          type: string
          maxLength: 39
        description:
          type: string
          maxLength: 1000
    TeamMember:
      type: object
      required: [username, displayName, role, since]
      properties:
        username:
          type: string
        displayName:
          type: string
        role:
          type: string
          enum: [maintainer, member]
        since:
          type: string
          format: date-time
    TeamRoleRequest:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [maintainer, member]
    OrgInviteRequest:
      type: object
      required: [email, role]
      properties:
        email:
          type: string
          maxLength: 254
        role:
          $ref: "#/components/schemas/OrgRole"
        teams:
          type: array
          maxItems: 20
          items:
            type: string
            maxLength: 39
    OrgInvite:
      type: object
      required: [id, email, role, teams, expiresAt, createdAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        role:
          $ref: "#/components/schemas/OrgRole"
        teams:
          type: array
          items:
            type: string
        invitedBy:
          type: string
        expiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        token:
          type: string
          description: Only at creation and only when mail is disabled; shown once
    OrgInviteAccepted:
      type: object
      required: [org, role]
      properties:
        org:
          type: string
        role:
          $ref: "#/components/schemas/OrgRole"
    Quota:
      type: object
      required: [maxRepos, maxStorageBytes, repos, storageBytes]
      properties:
        maxRepos:
          type: integer
          format: int32
          description: -1 means unlimited
        maxStorageBytes:
          type: integer
          format: int64
          description: -1 means unlimited
        repos:
          type: integer
          format: int32
        storageBytes:
          type: integer
          format: int64
    AuditEntry:
      type: object
      required: [id, at, action, targetType, targetId, ip, data]
      properties:
        id:
          type: string
          format: uuid
        at:
          type: string
          format: date-time
        actorId:
          type: string
          format: uuid
        actor:
          type: string
          description: Username of the actor; absent when anonymous or deleted
        action:
          type: string
        targetType:
          type: string
        targetId:
          type: string
        ip:
          type: string
        orgId:
          type: string
          format: uuid
        data:
          type: object
          additionalProperties: true
    AuditPage:
      type: object
      required: [entries]
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/AuditEntry"
        next:
          type: string
          format: uuid
          description: Cursor of the next page (pass as before); absent on the last page
    ReleaseAsset:
      type: object
      required: [id, name, label, contentType, size, sha256, downloadCount, createdAt]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        label: {type: string}
        contentType: {type: string}
        size: {type: integer, format: int64}
        sha256: {type: string, description: Hex digest}
        downloadCount: {type: integer, format: int64}
        createdAt: {type: string, format: date-time}
    ReleaseAssetUpdate:
      type: object
      properties:
        name: {type: string, maxLength: 255}
        label: {type: string, maxLength: 255}
    Release:
      type: object
      required: [id, tag, name, body, draft, prerelease, latest, target, commit, author, createdAt, assets]
      properties:
        id: {type: string, format: uuid}
        tag: {type: string}
        name: {type: string}
        body: {type: string, description: Markdown release notes}
        draft: {type: boolean}
        prerelease: {type: boolean}
        latest: {type: boolean, description: True for the release returned by getLatestRelease}
        target: {type: string, description: Branch or commit the tag was or will be created from; empty means the default branch}
        commit: {type: string, description: Commit of the tag once published; empty for drafts}
        author: {type: string, description: Username of the author; empty when unknown}
        createdAt: {type: string, format: date-time}
        publishedAt: {type: string, format: date-time, nullable: true}
        assets:
          type: array
          items:
            $ref: "#/components/schemas/ReleaseAsset"
    ReleaseCreate:
      type: object
      required: [tag]
      properties:
        tag: {type: string}
        name: {type: string, maxLength: 255}
        body: {type: string, maxLength: 125000}
        draft: {type: boolean}
        prerelease: {type: boolean}
        target: {type: string}
    ReleaseUpdate:
      type: object
      properties:
        tag: {type: string}
        name: {type: string, maxLength: 255}
        body: {type: string, maxLength: 125000}
        draft: {type: boolean}
        prerelease: {type: boolean}
        target: {type: string}
    # --- code browsing schemas ---
    ResolvedRef:
      type: object
      required: [ref, kind, name, commit]
      properties:
        ref: {type: string, description: The ref as requested (the default branch when empty)}
        kind: {type: string, enum: [branch, tag, commit]}
        name: {type: string, description: Full ref name; empty for a commit id}
        commit: {type: string, description: Full commit id}
    GitPerson:
      type: object
      required: [name, email, date]
      properties:
        name: {type: string}
        email: {type: string}
        date: {type: string, format: date-time}
    GitCommit:
      type: object
      required: [sha, parents, author, committer, summary, message]
      properties:
        sha: {type: string}
        parents:
          type: array
          items: {type: string}
        author: {$ref: "#/components/schemas/GitPerson"}
        committer: {$ref: "#/components/schemas/GitPerson"}
        summary: {type: string}
        message: {type: string}
    GitCommitSummary:
      type: object
      required: [sha, summary, author, date]
      properties:
        sha: {type: string}
        summary: {type: string}
        author: {type: string, description: Author name}
        date: {type: string, format: date-time}
    TreeEntry:
      type: object
      required: [name, path, type, mode, oid, size]
      properties:
        name: {type: string}
        path: {type: string}
        type: {type: string, enum: [blob, tree, symlink, submodule]}
        mode: {type: string}
        oid: {type: string}
        size: {type: integer, format: int64, description: Bytes; -1 for trees and submodules}
        lastCommit: {$ref: "#/components/schemas/GitCommitSummary"}
    Tree:
      type: object
      required: [ref, path, entries, truncated]
      properties:
        ref: {$ref: "#/components/schemas/ResolvedRef"}
        path: {type: string}
        entries:
          type: array
          items: {$ref: "#/components/schemas/TreeEntry"}
        truncated: {type: boolean, description: The directory has more entries than listed}
        readme: {type: string, description: Path of the README of the directory}
    LfsPointer:
      type: object
      required: [oid, size]
      properties:
        oid: {type: string, description: SHA-256 of the content}
        size: {type: integer, format: int64}
    BlobFile:
      type: object
      required: [ref, path, oid, mode, size, binary, truncated, contentType]
      properties:
        ref: {$ref: "#/components/schemas/ResolvedRef"}
        path: {type: string}
        oid: {type: string}
        mode: {type: string}
        size: {type: integer, format: int64}
        binary: {type: boolean}
        lfs: {$ref: "#/components/schemas/LfsPointer"}
        content: {type: string, description: UTF-8 text; absent for binary or too large files}
        truncated: {type: boolean, description: The file is too large to be shown inline}
        contentType: {type: string, description: Type served by the raw endpoint}
    BlameRange:
      type: object
      required: [commit, startLine, lines]
      properties:
        commit: {$ref: "#/components/schemas/GitCommitSummary"}
        startLine: {type: integer, description: 1-based}
        lines: {type: integer}
    Blame:
      type: object
      required: [ref, path, lines, ranges]
      properties:
        ref: {$ref: "#/components/schemas/ResolvedRef"}
        path: {type: string}
        lines:
          type: array
          items: {type: string}
        ranges:
          type: array
          items: {$ref: "#/components/schemas/BlameRange"}
    CommitPage:
      type: object
      required: [ref, commits, hasMore]
      properties:
        ref: {$ref: "#/components/schemas/ResolvedRef"}
        commits:
          type: array
          items: {$ref: "#/components/schemas/GitCommit"}
        hasMore: {type: boolean}
    DiffLine:
      type: object
      required: [type, oldLine, newLine, text]
      properties:
        type: {type: string, enum: [context, add, delete, no-newline]}
        oldLine: {type: integer, description: 0 when the line is not on the old side}
        newLine: {type: integer, description: 0 when the line is not on the new side}
        text: {type: string}
    DiffHunk:
      type: object
      required: [header, oldStart, oldLines, newStart, newLines, lines]
      properties:
        header: {type: string}
        oldStart: {type: integer}
        oldLines: {type: integer}
        newStart: {type: integer}
        newLines: {type: integer}
        lines:
          type: array
          items: {$ref: "#/components/schemas/DiffLine"}
    FileDiff:
      type: object
      required: [status, oldPath, newPath, oldMode, newMode, oldOid, newOid, similarity, binary, additions, deletions, hunks, truncated]
      properties:
        status: {type: string, enum: [added, modified, deleted, renamed, copied]}
        oldPath: {type: string}
        newPath: {type: string}
        oldMode: {type: string}
        newMode: {type: string}
        oldOid: {type: string}
        newOid: {type: string}
        similarity: {type: integer}
        binary: {type: boolean}
        additions: {type: integer}
        deletions: {type: integer}
        hunks:
          type: array
          items: {$ref: "#/components/schemas/DiffHunk"}
        truncated: {type: boolean}
    Diff:
      type: object
      required: [files, additions, deletions, truncated]
      properties:
        files:
          type: array
          items: {$ref: "#/components/schemas/FileDiff"}
        additions: {type: integer}
        deletions: {type: integer}
        truncated: {type: boolean, description: Lines or files were dropped}
    CommitDetail:
      type: object
      required: [commit, diff]
      properties:
        commit: {$ref: "#/components/schemas/GitCommit"}
        diff: {$ref: "#/components/schemas/Diff"}
    Branch:
      type: object
      required: [name, commit, default]
      properties:
        name: {type: string}
        commit: {$ref: "#/components/schemas/GitCommitSummary"}
        default: {type: boolean}
        ahead: {type: integer, description: Commits not in the default branch}
        behind: {type: integer, description: Commits of the default branch missing here}
    BranchPage:
      type: object
      required: [items, hasMore]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/Branch"}
        hasMore: {type: boolean}
    GitTag:
      type: object
      required: [name, commit, annotated, message]
      properties:
        name: {type: string}
        commit: {$ref: "#/components/schemas/GitCommitSummary"}
        annotated: {type: boolean}
        message: {type: string, description: Subject of an annotated tag}
        tagger: {$ref: "#/components/schemas/GitPerson"}
    TagPage:
      type: object
      required: [items, hasMore]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/GitTag"}
        hasMore: {type: boolean}
    Comparison:
      type: object
      required: [base, head, mergeBase, ahead, behind, commits, commitsTruncated, diff]
      properties:
        base: {$ref: "#/components/schemas/ResolvedRef"}
        head: {$ref: "#/components/schemas/ResolvedRef"}
        mergeBase: {type: string}
        ahead: {type: integer}
        behind: {type: integer}
        commits:
          type: array
          items: {$ref: "#/components/schemas/GitCommit"}
        commitsTruncated: {type: boolean}
        diff: {$ref: "#/components/schemas/Diff"}
    CodeMatch:
      type: object
      required: [path, line, text]
      properties:
        path: {type: string}
        line: {type: integer}
        text: {type: string}
    CodeSearchResult:
      type: object
      required: [ref, matches, truncated]
      properties:
        ref: {$ref: "#/components/schemas/ResolvedRef"}
        matches:
          type: array
          items: {$ref: "#/components/schemas/CodeMatch"}
        truncated: {type: boolean}
    FileEdit:
      type: object
      required: [op, path]
      properties:
        op: {type: string, enum: [create, update, delete]}
        path: {type: string, minLength: 1, maxLength: 4096}
        content: {type: string, description: New content (create, update)}
        encoding: {type: string, enum: [utf-8, base64], default: utf-8}
        branch: {type: string, maxLength: 255, description: Branch to start from; default branch when empty}
        newBranch: {type: string, maxLength: 255, description: Commit on this new branch instead}
        sha: {type: string, description: Blob id the edit started from (update, delete)}
        message: {type: string, maxLength: 65536}
    FileEditResult:
      type: object
      required: [branch, commit]
      properties:
        branch: {type: string}
        commit: {$ref: "#/components/schemas/GitCommit"}
    # --- end code browsing schemas ---
    # --- issues schemas ---
    Issue:
      type: object
      required: [id, number, title, body, state, stateReason, locked, lockReason, author, labels, assignees, commentCount, reactions, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        number: {type: integer, format: int64, description: Shared with the pull requests of the repository}
        title: {type: string}
        body: {type: string, description: Markdown}
        state: {type: string, enum: [open, closed]}
        stateReason: {type: string, description: "completed, not_planned or duplicate when closed; reopened after a reopen; empty otherwise"}
        locked: {type: boolean}
        lockReason: {type: string, description: "off-topic, too heated, resolved, spam or empty"}
        author: {type: string, description: Username; empty when the account is gone}
        labels:
          type: array
          items:
            $ref: "#/components/schemas/Label"
        assignees:
          type: array
          items: {type: string}
        milestone:
          $ref: "#/components/schemas/Milestone"
        commentCount: {type: integer}
        reactions:
          type: array
          items:
            $ref: "#/components/schemas/ReactionGroup"
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        closedAt: {type: string, format: date-time, nullable: true}
        closedBy: {type: string, description: Username of who closed it}
        editedAt: {type: string, format: date-time, nullable: true}
    IssueCreate:
      type: object
      required: [title]
      properties:
        title: {type: string, maxLength: 255}
        body: {type: string, maxLength: 65536}
        labels:
          type: array
          items: {type: string}
        assignees:
          type: array
          items: {type: string}
        milestoneId: {type: string, format: uuid}
    IssueUpdate:
      type: object
      properties:
        title: {type: string, maxLength: 255}
        body: {type: string, maxLength: 65536}
        state: {type: string, enum: [open, closed]}
        stateReason: {type: string, description: "On close: completed (default), not_planned or duplicate"}
        labels:
          type: array
          items: {type: string}
        assignees:
          type: array
          items: {type: string}
        milestoneId: {type: string, description: Milestone id; empty clears it}
    IssueLock:
      type: object
      properties:
        lockReason: {type: string, description: "off-topic, too heated, resolved, spam or empty"}
    Label:
      type: object
      required: [id, name, color, description]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        color: {type: string, description: Six lowercase hex digits, without "#"}
        description: {type: string}
    LabelCreate:
      type: object
      required: [name, color]
      properties:
        name: {type: string, maxLength: 50}
        color: {type: string, pattern: "^#?[0-9a-fA-F]{6}$"}
        description: {type: string, maxLength: 100}
    LabelUpdate:
      type: object
      properties:
        name: {type: string, maxLength: 50}
        color: {type: string, pattern: "^#?[0-9a-fA-F]{6}$"}
        description: {type: string, maxLength: 100}
    Milestone:
      type: object
      required: [id, title, description, state, openIssues, closedIssues, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        title: {type: string}
        description: {type: string}
        state: {type: string, enum: [open, closed]}
        dueOn: {type: string, format: date-time, nullable: true}
        openIssues: {type: integer, format: int64}
        closedIssues: {type: integer, format: int64}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        closedAt: {type: string, format: date-time, nullable: true}
    MilestoneCreate:
      type: object
      required: [title]
      properties:
        title: {type: string, maxLength: 255}
        description: {type: string, maxLength: 65536}
        dueOn: {type: string, format: date-time}
    MilestoneUpdate:
      type: object
      properties:
        title: {type: string, maxLength: 255}
        description: {type: string, maxLength: 65536}
        dueOn: {type: string, description: RFC 3339 date-time; empty clears it}
        state: {type: string, enum: [open, closed]}
    IssueComment:
      type: object
      required: [id, issueNumber, author, body, createdAt, updatedAt, reactions]
      properties:
        id: {type: string, format: uuid}
        issueNumber: {type: integer, format: int64}
        author: {type: string}
        body: {type: string, description: Markdown}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        editedAt: {type: string, format: date-time, nullable: true}
        editedBy: {type: string}
        reactions:
          type: array
          items:
            $ref: "#/components/schemas/ReactionGroup"
    CommentBody:
      type: object
      required: [body]
      properties:
        body: {type: string, minLength: 1, maxLength: 65536}
    BodyEdit:
      type: object
      required: [id, editor, body, createdAt]
      properties:
        id: {type: string, format: uuid}
        editor: {type: string, description: Username of who made the edit}
        body: {type: string, description: The body before the edit}
        createdAt: {type: string, format: date-time}
    Reaction:
      type: object
      required: [id, content, user, createdAt]
      properties:
        id: {type: string, format: uuid}
        content: {type: string}
        user: {type: string}
        createdAt: {type: string, format: date-time}
    ReactionRequest:
      type: object
      required: [content]
      properties:
        content: {type: string, description: "+1, -1, laugh, hooray, confused, heart, rocket or eyes"}
    ReactionGroup:
      type: object
      required: [content, count, viewerReacted]
      properties:
        content: {type: string}
        count: {type: integer, format: int64}
        viewerReacted: {type: boolean}
    TimelineSource:
      type: object
      required: [kind, redacted]
      description: Where an issue was referenced from
      properties:
        kind: {type: string, enum: [issue, pull, commit]}
        redacted: {type: boolean, description: The source is in a repository the caller cannot read; nothing else is set}
        repo: {type: string, description: owner/name}
        number: {type: integer, format: int64}
        title: {type: string}
        commit: {type: string}
    TimelineEvent:
      type: object
      required: [id, event, actor, createdAt]
      properties:
        id: {type: string, format: uuid}
        event:
          type: string
          description: |
            commented, closed, reopened, renamed, labeled, unlabeled, assigned,
            unassigned, milestoned, demilestoned, locked, unlocked, referenced
            or cross-referenced
        actor: {type: string}
        createdAt: {type: string, format: date-time}
        label:
          $ref: "#/components/schemas/Label"
        assignee: {type: string}
        milestone: {type: string, description: Milestone title at the time of the event}
        renameFrom: {type: string}
        renameTo: {type: string}
        stateReason: {type: string}
        lockReason: {type: string}
        comment:
          $ref: "#/components/schemas/IssueComment"
        source:
          $ref: "#/components/schemas/TimelineSource"
    IssueTemplate:
      type: object
      required: [kind, fileName, name, about, title, labels, assignees, body]
      properties:
        kind: {type: string, enum: [markdown, form]}
        fileName: {type: string}
        name: {type: string}
        about: {type: string, description: The about of a markdown template or the description of a form}
        title: {type: string, description: Default issue title}
        labels:
          type: array
          items: {type: string}
        assignees:
          type: array
          items: {type: string}
        body: {type: string, description: Body of a markdown template; empty for forms}
        form:
          type: array
          description: The body elements of an issue form, as written in the YAML file
          items:
            type: object
            additionalProperties: true
    IssueContactLink:
      type: object
      required: [name, url, about]
      properties:
        name: {type: string}
        url: {type: string}
        about: {type: string}
    IssueTemplateConfig:
      type: object
      required: [blankIssuesEnabled, contactLinks]
      properties:
        blankIssuesEnabled: {type: boolean}
        contactLinks:
          type: array
          items:
            $ref: "#/components/schemas/IssueContactLink"
    IssueTemplates:
      type: object
      required: [templates, config]
      properties:
        templates:
          type: array
          items:
            $ref: "#/components/schemas/IssueTemplate"
        config:
          $ref: "#/components/schemas/IssueTemplateConfig"
    IssueAttachment:
      type: object
      required: [id, name, size, contentType, url, createdAt]
      description: Returned by the attachment upload (outside this document)
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        size: {type: integer, format: int64}
        contentType: {type: string}
        url: {type: string, description: Download path, to use in Markdown}
        createdAt: {type: string, format: date-time}
    # --- end issues schemas ---
    # --- branch protection schemas ---
    BranchProtectionInput:
      type: object
      required: [pattern]
      properties:
        pattern: {type: string, minLength: 1, maxLength: 255, description: Glob on the branch name}
        requiredApprovals: {type: integer, minimum: 0, maximum: 10, description: Approving reviews a pull request needs before merging}
        requireCodeOwnerReviews: {type: boolean, description: A code owner of every changed path must approve}
        dismissStaleReviews: {type: boolean, description: A new push dismisses the approvals given before it}
        requiredStatusChecks:
          type: array
          maxItems: 50
          items: {type: string, minLength: 1, maxLength: 255}
          description: Status check contexts that must succeed on the head commit
        strictStatusChecks: {type: boolean, description: The branch must be up to date with the base before merging}
        requireLinearHistory: {type: boolean, description: Reject merge commits}
        allowForcePushes: {type: boolean, description: Allow non fast-forward updates (default false)}
        allowDeletions: {type: boolean, description: Allow deleting the branch (default false)}
        requireSignedCommits: {type: boolean, description: Every new commit needs a verified GPG or SSH signature}
        restrictPushes: {type: boolean, description: Only pushUsers and pushTeams may push}
        pushUsers:
          type: array
          maxItems: 100
          items: {type: string}
          description: Usernames allowed to push when restrictPushes is set
        pushTeams:
          type: array
          maxItems: 100
          items: {type: string}
          description: Teams of the owning organization allowed to push when restrictPushes is set
        adminsBypass: {type: boolean, description: Repository admins are exempt from the rule (default false)}
    BranchProtection:
      type: object
      required: [id, pattern, requiredApprovals, requireCodeOwnerReviews, dismissStaleReviews, requiredStatusChecks,
        strictStatusChecks, requireLinearHistory, allowForcePushes, allowDeletions, requireSignedCommits,
        restrictPushes, pushUsers, pushTeams, adminsBypass, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        pattern: {type: string}
        requiredApprovals: {type: integer}
        requireCodeOwnerReviews: {type: boolean}
        dismissStaleReviews: {type: boolean}
        requiredStatusChecks:
          type: array
          items: {type: string}
        strictStatusChecks: {type: boolean}
        requireLinearHistory: {type: boolean}
        allowForcePushes: {type: boolean}
        allowDeletions: {type: boolean}
        requireSignedCommits: {type: boolean}
        restrictPushes: {type: boolean}
        pushUsers:
          type: array
          items: {type: string}
        pushTeams:
          type: array
          items: {type: string}
        adminsBypass: {type: boolean}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    TagRuleLevel:
      type: string
      enum: [write, maintain, admin, none]
      description: Minimum repository permission for an action; none allows only the listed users and teams
    TagRuleInput:
      type: object
      required: [pattern]
      properties:
        pattern: {type: string, minLength: 1, maxLength: 255, description: Glob on the tag name}
        create: {$ref: "#/components/schemas/TagRuleLevel"}
        update: {$ref: "#/components/schemas/TagRuleLevel"}
        delete: {$ref: "#/components/schemas/TagRuleLevel"}
        allowedUsers:
          type: array
          maxItems: 100
          items: {type: string}
          description: Usernames allowed every action regardless of the levels
        allowedTeams:
          type: array
          maxItems: 100
          items: {type: string}
          description: Teams of the owning organization allowed every action
        adminsBypass: {type: boolean, description: Repository admins are exempt from the rule (default false)}
    TagRule:
      type: object
      required: [id, pattern, create, update, delete, allowedUsers, allowedTeams, adminsBypass, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        pattern: {type: string}
        create: {$ref: "#/components/schemas/TagRuleLevel"}
        update: {$ref: "#/components/schemas/TagRuleLevel"}
        delete: {$ref: "#/components/schemas/TagRuleLevel"}
        allowedUsers:
          type: array
          items: {type: string}
        allowedTeams:
          type: array
          items: {type: string}
        adminsBypass: {type: boolean}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    RefUpdateCheck:
      type: object
      required: [ref]
      properties:
        ref: {type: string, maxLength: 255, description: "Full ref name (refs/heads/main, refs/tags/v1) or a branch name"}
        old: {type: string, description: Current object id; empty reads it from the repository}
        new: {type: string, description: New object id; empty or all zeros means deletion}
        user: {type: string, description: Username to evaluate as; defaults to the caller}
    RefUpdateEvaluation:
      type: object
      required: [ref, kind, allowed, rule, violations]
      properties:
        ref: {type: string}
        kind: {type: string, enum: [branch, tag, other]}
        allowed: {type: boolean}
        rule: {type: string, description: Pattern of the rule that applies; empty when none}
        violations:
          type: array
          items:
            $ref: "#/components/schemas/ProtectionViolation"
    ProtectionViolation:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: "Machine-readable reason: push_restricted, force_push, deletion, linear_history, unsigned_commit, too_many_commits, pull_request_required, status_checks, tag_create, tag_update, tag_delete"
        message: {type: string}
        commit: {type: string, description: Offending commit, when the violation concerns one}
    # --- end branch protection schemas ---
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          example: about:blank
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
