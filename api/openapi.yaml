  /repos/{owner}/{name}/releases:
    parameters:
      - $ref: "#/components/parameters/RepoOwner"
      - $ref: "#/components/parameters/RepoName"
    get:
      operationId: listReleases
      tags: [releases]
      summary: Releases of the repository, newest first
      description: Drafts are only listed for callers who can manage releases.
      security:
        - session: [anonymous]
        - token: [repo:read]
      parameters:
        - name: tag
          in: query
          schema:
            type: string
          description: Only the release of this exact tag
        - $ref: "#/components/parameters/PageOffset"
        - $ref: "#/components/parameters/PageLimit"
      responses:
        "200":
          description: Releases
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Release"
        "307":
          $ref: "#/components/responses/Moved"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createRelease
      tags: [releases]
      summary: Create a release
      description: |
        Unless the release is a draft, a missing tag is created at the target
        (default branch by default). Assets are uploaded with
        `POST /api/v1/repos/{owner}/{name}/releases/{releaseId}/assets?name=`
        (raw body, `Content-Length` required) and downloaded from
        `GET /api/v1/repos/{owner}/{name}/releases/{releaseId}/assets/{assetId}/download`.
      security:
        - session: []
        - token: [repo:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReleaseCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Release"
        "307":
          $ref: "#/components/responses/Moved"
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /repos/{owner}/{name}/releases/latest:
    parameters:
      - $ref: "#/components/parameters/RepoOwner"
      - $ref: "#/components/parameters/RepoName"
    get:
      operationId: getLatestRelease
      tags: [releases]
      summary: The newest published release that is not a prerelease
      security:
        - session: [anonymous]
        - token: [repo:read]
      responses:
        "200":
          description: The release
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Release"
        "307":
          $ref: "#/components/responses/Moved"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /repos/{owner}/{name}/releases/{releaseId}:
    parameters:
      - $ref: "#/components/parameters/RepoOwner"
      - $ref: "#/components/parameters/RepoName"
      - name: releaseId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getRelease
      tags: [releases]
      summary: A release
      security:
        - session: [anonymous]
        - token: [repo:read]
      responses:
        "200":
          description: The release
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Release"
        "307":
          $ref: "#/components/responses/Moved"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateRelease
      tags: [releases]
      summary: Change a release
      description: |
        Publishing a draft (draft false) creates the tag when missing. The tag
        can only be changed while the release is a draft.
      security:
        - session: []
        - token: [repo:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReleaseUpdate"
      responses:
        "200":
          description: The updated release
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Release"
        "307":
          $ref: "#/components/responses/Moved"
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteRelease
      tags: [releases]
      summary: Delete a release and its assets
      description: The git tag is kept.
      security:
        - session: []
        - token: [repo:write]
      responses:
        "204":
          description: Deleted
        "307":
          $ref: "#/components/responses/Moved"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /repos/{owner}/{name}/releases/{releaseId}/assets/{assetId}:
    parameters:
      - $ref: "#/components/parameters/RepoOwner"
      - $ref: "#/components/parameters/RepoName"
      - name: releaseId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: assetId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      operationId: updateReleaseAsset
      tags: [releases]
      summary: Rename an asset or change its label
      security:
        - session: []
        - token: [repo:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReleaseAssetUpdate"
      responses:
        "200":
          description: The updated asset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReleaseAsset"
        "307":
          $ref: "#/components/responses/Moved"
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteReleaseAsset
      tags: [releases]
      summary: Delete an asset and its stored bytes
      security:
        - session: []
        - token: [repo:write]
      responses:
        "204":
          description: Deleted
        "307":
          $ref: "#/components/responses/Moved"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  # --- code browsing (tag: code) ---
  /repos/{owner}/{name}/refs/resolve:
    parameters:
      - $ref: "#/components/parameters/RepoOwner"
      - $ref: "#/components/parameters/RepoName"
    get:
      operationId: resolveRef
      tags: [code]
      summary: Resolve a branch, tag or commit id to a commit
      security:
        - session: [anonymous]
        - token: [repo:read]
      parameters:
        - $ref: "#/components/parameters/CodeRef"
      responses:
        "200":
          description: Resolved ref
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResolvedRef"
        "301":
          $ref: "#/components/responses/Moved"
        "404":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Unavailable"
        default:
          $ref: "#/components/responses/Problem"
  /repos/{owner}/{name}/tree:
    parameters:
      - $ref: "#/components/parameters/RepoOwner"
      - $ref: "#/components/parameters/RepoName"
    get:
      operationId: getTree
      tags: [code]
      summary: A directory of a ref
      description: |
        Directories first. With lastCommits the newest commit of each entry
        is filled within a time budget; entries left without lastCommit ran
        out of it. The raw content of a file is served by
        `GET /api/v1/repos/{owner}/{name}/raw?ref=&path=` and an archive by
        `GET /api/v1/repos/{owner}/{name}/archive?ref=&format=zip|tar.gz`.
      security:
        - session: [anonymous]
        - token: [repo:read]
      parameters:
        - $ref: "#/components/parameters/CodeRef"
        - $ref: "#/components/parameters/CodePath"
        - name: lastCommits
          in: query
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Directory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tree"
        "301":
          $ref: "#/components/responses/Moved"
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Unavailable"
        default:
          $ref: "#/components/responses/Problem"
  /repos/{owner}/{name}/blob:
    parameters:
      - $ref: "#/components/parameters/RepoOwner"
      - $ref: "#/components/parameters/RepoName"
    get:
      operationId: getBlob
      tags: [code]
      summary: A file of a ref
      description: Text files within the size limit carry their content; others only the metadata.
      security:
        - session: [anonymous]
        - token: [repo:read]
      parameters:
        - $ref: "#/components/parameters/CodeRef"
        - $ref: "#/components/parameters/CodeFilePath"
      responses:
        "200":
          description: File
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlobFile"
        "301":
          $ref: "#/components/responses/Moved"
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Unavailable"
        default:
          $ref: "#/components/responses/Problem"
  /repos/{owner}/{name}/readme:
    parameters:
      - $ref: "#/components/parameters/RepoOwner"
      - $ref: "#/components/parameters/RepoName"
    get:
      operationId: getReadme
      tags: [code]
      summary: The README of a directory
      security:
        - session: [anonymous]
        - token: [repo:read]
      parameters:
        - $ref: "#/components/parameters/CodeRef"
        - $ref: "#/components/parameters/CodePath"
      responses:
        "200":
          description: README file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlobFile"
        "301":
          $ref: "#/components/responses/Moved"
        "404":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Unavailable"
        default:
          $ref: "#/components/responses/Problem"
  /repos/{owner}/{name}/blame:
    parameters:
      - $ref: "#/components/parameters/RepoOwner"
      - $ref: "#/components/parameters/RepoName"
    get:
      operationId: getBlame
      tags: [code]
      summary: Line authorship of a text file
      security:
        - session: [anonymous]
        - token: [repo:read]
      parameters:
        - $ref: "#/components/parameters/CodeRef"
        - $ref: "#/components/parameters/CodeFilePath"
      responses:
        "200":
          description: Blame
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Blame"
        "301":
          $ref: "#/components/responses/Moved"
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Unavailable"
        default:
          $ref: "#/components/responses/Problem"
  /repos/{owner}/{name}/commits:
    parameters:
      - $ref: "#/components/parameters/RepoOwner"
      - $ref: "#/components/parameters/RepoName"
    get:
      operationId: listCommits
      tags: [code]
      summary: History of a ref, newest first
      security:
        - session: [anonymous]
        - token: [repo:read]
      parameters:
        - $ref: "#/components/parameters/CodeRef"
        - name: path
          in: query
          description: Only the commits that touch this path
          schema:
            type: string
            maxLength: 4096
        - $ref: "#/components/parameters/PageOffset"
        - $ref: "#/components/parameters/PageLimit"
      responses:
        "200":
          description: Commits
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommitPage"
        "301":
          $ref: "#/components/responses/Moved"
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Unavailable"
        default:
          $ref: "#/components/responses/Problem"
  /repos/{owner}/{name}/contributors:
    parameters:
      - $ref: "#/components/parameters/RepoOwner"
      - $ref: "#/components/parameters/RepoName"
    get:
      operationId: listContributors
      tags: [code]
      summary: Authors of a ref, most commits first
      description: |
        Authors are grouped by e-mail address (case-insensitive) over a bounded
        number of the newest commits. E-mail addresses are never returned;
        username and avatarUrl are set when a verified address of a user
        matches.
      security:
        - session: [anonymous]
        - token: [repo:read]
      parameters:
        - $ref: "#/components/parameters/CodeRef"
        - $ref: "#/components/parameters/PageLimit"
      responses:
        "200":
          description: Contributors
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContributorList"
        "301":
          $ref: "#/components/responses/Moved"
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Unavailable"
        default:
          $ref: "#/components/responses/Problem"
  /repos/{owner}/{name}/languages:
    parameters:
      - $ref: "#/components/parameters/RepoOwner"
      - $ref: "#/components/parameters/RepoName"
    get:
      operationId: listLanguages
      tags: [code]
      summary: Languages of a ref by bytes of source
      description: |
        Sizes the files of the tree of a ref by language, from the file name
        only. Programming and markup languages are counted; prose, data,
        images, vendored and generated files are not. Languages below 0.1% are
        folded into one trailing "Other" item. An empty repository, or a tree
        without recognised source files, returns no items.
      security:
        - session: [anonymous]
        - token: [repo:read]
      parameters:
        - $ref: "#/components/parameters/CodeRef"
      responses:
        "200":
          description: Languages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LanguageList"
        "301":
          $ref: "#/components/responses/Moved"
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Unavailable"
        default:
          $ref: "#/components/responses/Problem"
