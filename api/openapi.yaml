          $ref: "#/components/responses/Problem"
  /users/{username}/cards/{card}.svg:
    parameters:
      - $ref: "#/components/parameters/Username"
      - name: card
        in: path
        required: true
        description: |
          stats (repositories, stars, contributions, pushes, pull requests,
          issues), languages (top languages by bytes of the public
          repositories), streak (current and longest contribution streak),
          activity (contribution calendar of the last 53 weeks) or hours
          (contributions per hour of the day, in the profile time zone).
        schema:
          type: string
          enum: [stats, languages, streak, activity, hours]
    get:
      operationId: getUserCard
      tags: [repos]
      summary: SVG profile card of a user, to embed in a README
      description: |
        Always computed as a signed-out visitor sees the user (public
        repositories only), so the image is the same for everyone and can be
        cached by shared caches for 30 minutes.
      security:
        - session: [anonymous]
        - token: [repo:read]
      parameters:
        - name: theme
          in: query
          schema:
            type: string
            enum: [dark, light, neon]
            default: dark
        - name: hideBorder
          in: query
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Card
          content:
            image/svg+xml:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /explore/activity:
    get:
      operationId: listReposWeeklyActivity
      tags: [repos]
      summary: Weekly activity of repositories, for the sparklines of repository lists
      description: Events per week over the last 16 weeks, oldest first. Repositories the caller cannot read are left out.
      security:
        - session: [anonymous]
        - token: [repo:read]
      parameters:
        - name: repo
          in: query
          required: true
          description: Repository IDs (repeatable, at most 100)
          schema:
            type: array
            maxItems: 100
            items: {type: string, format: uuid}
          explode: true
      responses:
        "200":
          description: Weekly counts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RepoWeeklyActivity"
        "400":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /orgs/{org}/repos:
    parameters:
      - $ref: "#/components/parameters/OrgName"
    get:
      operationId: listOrgRepos
      tags: [repos]
      summary: Repositories of an organization the caller can see
      security:
        - session: [anonymous]
        - token: [repo:read]
      parameters:
        - $ref: "#/components/parameters/PageOffset"
        - $ref: "#/components/parameters/PageLimit"
      responses:
        "200":
          description: Repositories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Repo"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createOrgRepo
      tags: [repos]
      summary: Create an empty repository in an organization
      description: |
        Members of the organization. A plain member becomes the admin
        collaborator of the new repository.
      security:
        - session: []
        - token: [repo:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RepoCreate"
      responses:
        "201":
          description: Repository created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Repo"
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /repos/{owner}/{name}/todo:
    parameters:
      - $ref: "#/components/parameters/RepoOwner"
      - $ref: "#/components/parameters/RepoName"
    get:
      operationId: getRepoTodo
      tags: [todo]
      summary: Get the repository Todo list and the viewer's display preference
      description: Requires repository access through ownership, collaboration, a team or organization membership, regardless of visibility. Everyone else gets 404.
      security:
        - session: []
        - token: [repo:read]
      responses:
        "200":
          $ref: "#/components/responses/TodoView"
        default:
          $ref: "#/components/responses/Problem"
    put:
      operationId: putRepoTodo
      tags: [todo]
      summary: Replace the shared Todo contents at the specified revision
      security:
        - session: []
        - token: [repo:write]
      requestBody:
        $ref: "#/components/requestBodies/TodoBoardWrite"
      responses:
        "200":
          $ref: "#/components/responses/TodoBoard"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: patchRepoTodo
      tags: [todo]
      summary: Change only this viewer's Todo display preference
      security:
        - session: []
        - token: [repo:read]
      requestBody:
        $ref: "#/components/requestBodies/TodoPreference"
      responses:
        "204":
          description: Preference saved
        default:
          $ref: "#/components/responses/Problem"
  /repos/{owner}/{name}:
    parameters:
      - $ref: "#/components/parameters/RepoOwner"
      - $ref: "#/components/parameters/RepoName"
    get:
      operationId: getRepo
      tags: [repos]
      summary: A repository
      description: |
        Repositories the caller cannot read answer 404. The old path of a
        renamed or transferred repository answers 301 with the new location.
        Only this operation fills openIssuesCount and openPullsCount.
      security:
        - session: [anonymous]
        - token: [repo:read]
      responses:
        "200":
          description: Repository
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Repo"
        "301":
          $ref: "#/components/responses/Moved"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateRepo
      tags: [repos]
      summary: Change the settings of a repository
      description: |
        Description and default branch need maintain; name and visibility
        need admin. A rename keeps the old path as a redirect.
      security:
        - session: []
        - token: [repo:write]
      requestBody:
        required: true
        content:
          application/json:
