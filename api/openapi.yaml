        - session: []
        - token: [repo:write]
      responses:
        "204":
          description: Revoked
        "307":
          $ref: "#/components/responses/Moved"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
