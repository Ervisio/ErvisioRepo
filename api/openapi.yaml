      description: The pattern is a glob on the tag name, matched like branch protection patterns.
      security:
        - session: []
        - token: [repo:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TagRuleInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagRule"
        "307":
          $ref: "#/components/responses/Moved"
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /repos/{owner}/{name}/tag-rules/{ruleId}:
    parameters:
      - $ref: "#/components/parameters/RepoOwner"
      - $ref: "#/components/parameters/RepoName"
      - $ref: "#/components/parameters/ProtectionRuleId"
    get:
      operationId: getTagRule
      tags: [protection]
      summary: A tag rule
      security:
        - session: []
        - token: [repo:write]
      responses:
        "200":
          description: Rule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagRule"
        "307":
          $ref: "#/components/responses/Moved"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    put:
      operationId: updateTagRule
      tags: [protection]
      summary: Replace a tag rule
      security:
        - session: []
        - token: [repo:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TagRuleInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagRule"
        "307":
          $ref: "#/components/responses/Moved"
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteTagRule
      tags: [protection]
      summary: Delete a tag rule
      security:
        - session: []
        - token: [repo:write]
      responses:
        "204":
          description: Deleted
        "307":
          $ref: "#/components/responses/Moved"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  # --- end branch protection ---
  # --- github sync (tag: github) ---
  # GitHub connections, one-off imports, pull mirrors, backups and
  # bidirectional sync (PLAN §5.6). The webhook receiver
  # POST /api/v1/github/webhook/{connectionId} is mounted outside the
  # generated router: it needs the raw body to verify X-Hub-Signature-256.
  /github/connections:
    get:
      operationId: listGitHubConnections
      tags: [github]
      summary: GitHub connections of a user or organization
      description: |
        owner defaults to the caller. Connections of an organization are
        visible to its owners and admins.
      security:
        - session: []
        - token: [user:read]
      parameters:
        - name: owner
          in: query
          schema: {type: string, maxLength: 39}
      responses:
        "200":
          description: Connections
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/GitHubConnection"}
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createGitHubConnection
      tags: [github]
      summary: Connect a GitHub App installation or a fine-grained token
      description: |
        The credentials are encrypted with the instance master key (503
        without one) and never returned. The response carries the webhook
        secret once, to configure on GitHub with the webhookUrl. A baseUrl
        other than https://github.com (GitHub Enterprise Server) needs an
        instance admin.
      security:
        - session: []
        - token: [user:write]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/GitHubConnectionCreate"}
      responses:
        "201":
          description: Connection created
          content:
            application/json:
              schema: {$ref: "#/components/schemas/GitHubConnection"}
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /github/connections/{connectionId}:
    parameters:
      - name: connectionId
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      operationId: getGitHubConnection
      tags: [github]
      summary: A GitHub connection
      security:
        - session: []
        - token: [user:read]
      responses:
        "200":
          description: Connection
          content:
            application/json:
              schema: {$ref: "#/components/schemas/GitHubConnection"}
        "404":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateGitHubConnection
      tags: [github]
      summary: Rename a connection, replace its credentials or rotate the webhook secret
      security:
        - session: []
        - token: [user:write]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/GitHubConnectionUpdate"}
      responses:
        "200":
          description: Updated connection (with the new webhook secret when rotated)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/GitHubConnection"}
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteGitHubConnection
      tags: [github]
      summary: Delete a connection that no repository uses (409 otherwise)
      security:
        - session: []
        - token: [user:write]
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /github/connections/{connectionId}/check:
    parameters:
      - name: connectionId
        in: path
        required: true
        schema: {type: string, format: uuid}
    post:
      operationId: checkGitHubConnection
      tags: [github]
      summary: Verify the credentials of a connection against GitHub
      security:
        - session: []
        - token: [user:write]
      responses:
        "200":
          description: Result of the check
          content:
            application/json:
              schema: {$ref: "#/components/schemas/GitHubConnectionCheck"}
        "404":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /github/imports:
    get:
      operationId: listGitHubImports
      tags: [github]
      summary: Imports started by the caller, newest first
      description: Repositories the caller can no longer read are left out.
      security:
        - session: []
        - token: [repo:read]
      parameters:
        - $ref: "#/components/parameters/PageOffset"
        - $ref: "#/components/parameters/PageLimit"
      responses:
        "200":
          description: Imports
          headers:
            X-Has-More:
              $ref: "#/components/headers/HasMore"
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/GitHubImport"}
        "401":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: importGitHubRepo
      tags: [github]
      summary: Import a GitHub repository into a new repository
      description: |
        Creates the repository (the same rules as POST /user/repos or
        /orgs/{org}/repos apply) and, in the background, fetches every
        branch and tag through the normal write path, then imports the
        kinds of data listed in include (all when empty): labels,
        milestones, pull requests (with refs/pull/N/head, reviews and
        review comments), issues (with comments and reactions) and
        releases (with their assets). Numbers and timestamps are kept;
        content by GitHub users without a linked local account is
        attributed to the caller with an "originally by" line. The import
        sends no webhooks or notifications, and a retry skips what was
        imported already.
      security:
        - session: []
        - token: [repo:write]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/GitHubImportCreate"}
      responses:
        "202":
          description: Import scheduled
          content:
            application/json:
              schema: {$ref: "#/components/schemas/GitHubImport"}
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /repos/{owner}/{name}/presence:
    parameters:
      - $ref: "#/components/parameters/RepoOwner"
      - $ref: "#/components/parameters/RepoName"
    get:
      operationId: getPresence
      tags: [presence]
      summary: Presence and file locks of a repository
      description: |
        Anyone who can read the repository. `others` (the live presences of
        the other users) is only filled for callers that can use the
        feature (canUse); `locks` lists every lock of the repository on
        every branch. With the feature off, enabled is false and both lists
        are empty.
      security:
        - session: [anonymous]
        - token: [repo:read]
      responses:
        "200":
          description: Current state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PresenceState"
        "301":
          $ref: "#/components/responses/Moved"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /repos/{owner}/{name}/presence/enabled:
    parameters:
      - $ref: "#/components/parameters/RepoOwner"
      - $ref: "#/components/parameters/RepoName"
    put:
      operationId: setPresenceEnabled
      tags: [presence]
      summary: Turn presence and file locks on or off
      description: |
        Repository admins. Turning the feature off deletes the stored
        presences, sends `disabled` to the open streams and closes them;
        locks are kept.
      security:
        - session: []
        - token: [repo:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PresenceEnabled"
      responses:
        "200":
          description: New state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PresenceState"
        "307":
          $ref: "#/components/responses/Moved"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /repos/{owner}/{name}/presence/heartbeat:
    parameters:
      - $ref: "#/components/parameters/RepoOwner"
      - $ref: "#/components/parameters/RepoName"
    put:
      operationId: putPresenceHeartbeat
      tags: [presence]
      summary: Report the state of a client
      description: |
        Callers that can use the feature (write permission, or membership
        of the owning organization for its public repositories). The
        presence stays live for `ttl` seconds; send a heartbeat every
        `interval` seconds. Only tracked changes are reported, never
        untracked or ignored files.
      security:
        - session: []
        - token: [repo:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PresenceHeartbeat"
      responses:
        "200":
          description: Current state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PresenceState"
        "307":
          $ref: "#/components/responses/Moved"
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          description: The feature is off for this repository
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deletePresenceHeartbeat
      tags: [presence]
      summary: Remove the presence of a client
      security:
        - session: []
        - token: [repo:write]
      parameters:
        - name: clientId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Removed (also when there was none)
        "307":
          $ref: "#/components/responses/Moved"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          description: The feature is off for this repository
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /repos/{owner}/{name}/presence/stream:
    parameters:
      - $ref: "#/components/parameters/RepoOwner"
      - $ref: "#/components/parameters/RepoName"
    get:
      operationId: streamPresence
      tags: [presence]
      summary: Live presence and lock events (server-sent events)
      description: |
        Callers that can use the feature. Events (`event:` name, `data:`
        JSON): `snapshot` (PresenceState) on connection, `presence`
        (Presence, never one of the caller), `gone` (PresenceGone), `lock`
        (PresenceLock), `unlock` (PresenceUnlock), `disabled` (`{}`, then
        the stream ends). A `: ping` comment every 25 s. The stream also
        ends when the caller loses access. Served outside the request
        timeout (not part of the generated Go server).
      security:
        - session: []
        - token: [repo:read]
      responses:
        "200":
          description: Event stream
          content:
            text/event-stream:
              schema:
                type: string
        "307":
          $ref: "#/components/responses/Moved"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          description: The feature is off for this repository
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /repos/{owner}/{name}/presence/locks:
    parameters:
      - $ref: "#/components/parameters/RepoOwner"
      - $ref: "#/components/parameters/RepoName"
    post:
      operationId: createPresenceLock
      tags: [presence]
      summary: Lock a file on a branch
      description: |
        Callers that can use the feature. While the lock exists, pushes by
        other users that change the file on that branch are refused. The
        same locks are served by the Git LFS Locks API.
      security:
        - session: []
        - token: [repo:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PresenceLockCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PresenceLock"
        "307":
          $ref: "#/components/responses/Moved"
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          description: |
            The path is already locked on that branch (by anyone, the caller
            included): the body carries the existing lock. A problem
            document instead when the feature is off.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PresenceLockConflict"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /repos/{owner}/{name}/presence/locks/{lockId}:
    parameters:
      - $ref: "#/components/parameters/RepoOwner"
      - $ref: "#/components/parameters/RepoName"
      - name: lockId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      operationId: deletePresenceLock
      tags: [presence]
      summary: Release a lock
      description: |
        The owner of the lock, or with force=true a caller that can force
        unlocks (maintain or admin on the repository, owner of the owning
        organization, instance admin).
      security:
        - session: []
        - token: [repo:write]
      parameters:
        - name: force
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: The released lock
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PresenceLock"
        "307":
          $ref: "#/components/responses/Moved"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          description: The feature is off for this repository
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /repos/{owner}/{name}/github/import:
    parameters:
      - $ref: "#/components/parameters/RepoOwner"
      - $ref: "#/components/parameters/RepoName"
    get:
      operationId: getGitHubImport
      tags: [github]
      summary: Status of the import that created the repository
      security:
        - session: []
        - token: [repo:read]
      responses:
        "200":
          description: Import
          content:
            application/json:
              schema: {$ref: "#/components/schemas/GitHubImport"}
        "404":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /repos/{owner}/{name}/github/sync:
    parameters:
      - $ref: "#/components/parameters/RepoOwner"
      - $ref: "#/components/parameters/RepoName"
    get:
      operationId: getGitHubSyncLink
      tags: [github]
      summary: The GitHub sync link of a repository (404 when none)
      security:
        - session: []
        - token: [repo:read]
      responses:
        "200":
          description: Link
          content:
            application/json:
              schema: {$ref: "#/components/schemas/GitHubSyncLink"}
        "404":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    put:
      operationId: putGitHubSyncLink
      tags: [github]
      summary: Create or replace the GitHub sync link of a repository
      description: |
        Needs admin on the repository and a connection of the repository
        owner or of the caller. mirror makes the repository read-only
        (pushes are refused); backup pushes branches and tags to GitHub
        after every push; sync does both, fast-forward only.
      security:
        - session: []
        - token: [repo:write]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/GitHubSyncLinkPut"}
      responses:
        "200":
          description: Link
          content:
            application/json:
              schema: {$ref: "#/components/schemas/GitHubSyncLink"}
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteGitHubSyncLink
      tags: [github]
      summary: Remove the GitHub sync link (the GitHub repository is untouched)
      security:
        - session: []
        - token: [repo:write]
      responses:
        "204":
          description: Removed
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /repos/{owner}/{name}/github/sync/refs:
    parameters:
      - $ref: "#/components/parameters/RepoOwner"
      - $ref: "#/components/parameters/RepoName"
    get:
      operationId: listGitHubSyncRefs
      tags: [github]
      summary: Per-ref state of the GitHub sync link
      security:
        - session: []
        - token: [repo:read]
      responses:
        "200":
          description: Refs
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/GitHubSyncRef"}
        "404":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /repos/{owner}/{name}/github/sync/run:
    parameters:
      - $ref: "#/components/parameters/RepoOwner"
      - $ref: "#/components/parameters/RepoName"
    post:
      operationId: runGitHubSync
      tags: [github]
      summary: Run the GitHub sync link now (clears the backoff)
      security:
        - session: []
        - token: [repo:write]
      responses:
        "202":
          description: Run scheduled
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /repos/{owner}/{name}/github/sync/resolve:
    parameters:
      - $ref: "#/components/parameters/RepoOwner"
      - $ref: "#/components/parameters/RepoName"
    post:
      operationId: resolveGitHubSyncConflict
      tags: [github]
      summary: Resolve a diverged branch of a sync link
      description: |
        keep_ervisio pushes the local branch to GitHub (force);
        keep_github moves the local branch to the GitHub commit (force,
        under the write lease, through the normal write path); the commit
        replaced on either side stays reachable from
        refs/heads/sync-conflict/<side>/<branch>. merge_request records
        that the branch is to be merged by hand from
        refs/heads/sync-conflict/github/<branch>.
      security:
        - session: []
        - token: [repo:write]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/GitHubSyncResolve"}
      responses:
        "200":
          description: Updated ref state
          content:
            application/json:
              schema: {$ref: "#/components/schemas/GitHubSyncRef"}
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  # --- end github sync ---
  # --- webhooks (tag: webhooks) ---
  # Outgoing webhooks (PLAN §5.7) of repositories (admins) and of
  # organizations (owners; fired for every repository they own).
  /webhooks/events:
    get:
      operationId: listWebhookEvents
      tags: [webhooks]
      summary: Events a webhook can subscribe to
      description: GitHub event names accepted in events, "*" (every event) first.
      security:
        - session: []
        - token: [repo:read]
      responses:
        "200":
          description: Event catalogue
          content:
            application/json:
              schema: {$ref: "#/components/schemas/WebhookEventCatalog"}
        default:
          $ref: "#/components/responses/Problem"
  /repos/{owner}/{name}/hooks:
    parameters:
