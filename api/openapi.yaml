      security:
        - session: [anonymous]
        - token: [repo:read]
      parameters:
        - $ref: "#/components/parameters/PageOffset"
        - $ref: "#/components/parameters/PageLimit"
      responses:
        "200":
          description: Events
          content:
            application/json:
              schema:
                type: array
