          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /users/{username}/contributions:
    parameters:
      - $ref: "#/components/parameters/Username"
    get:
      operationId: getUserContributions
      tags: [repos]
      summary: Contribution calendar of a user
      description: |
        Activity events of the user per UTC day (pushes, issues and pull
        requests opened, closed or merged, releases, comments), counted only
        in the repositories the caller can read. Without year the last 53
        weeks up to today.
      security:
        - session: [anonymous]
        - token: [repo:read]
      parameters:
        - name: year
          in: query
          schema:
            type: integer
            minimum: 2000
            maximum: 9999
      responses:
        "200":
          description: Calendar
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContributionCalendar"
        "404":
          $ref: "#/components/responses/Problem"
