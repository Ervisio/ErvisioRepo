            maxLength: 255
        - name: head
          in: query
          required: true
          schema:
            type: string
            maxLength: 255
      responses:
        "200":
          description: Comparison
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comparison"
        "301":
          $ref: "#/components/responses/Moved"
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Unavailable"
        default:
          $ref: "#/components/responses/Problem"
  /repos/{owner}/{name}/search/code:
    parameters:
      - $ref: "#/components/parameters/RepoOwner"
      - $ref: "#/components/parameters/RepoName"
    get:
      operationId: searchCode
      tags: [code]
      summary: Search the text files of a ref (git grep)
      description: Stops at the result limit or after a timeout; truncated tells whether it did.
      security:
        - session: [anonymous]
        - token: [repo:read]
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 256
        - $ref: "#/components/parameters/CodeRef"
        - $ref: "#/components/parameters/CodePath"
        - name: regexp
          in: query
          description: Extended regular expression instead of a fixed string
          schema:
            type: boolean
            default: false
        - name: ignoreCase
          in: query
          schema:
            type: boolean
            default: false
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 200
      responses:
        "200":
          description: Matches
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodeSearchResult"
        "301":
          $ref: "#/components/responses/Moved"
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Unavailable"
        default:
          $ref: "#/components/responses/Problem"
  /repos/{owner}/{name}/contents:
    parameters:
      - $ref: "#/components/parameters/RepoOwner"
      - $ref: "#/components/parameters/RepoName"
    post:
      operationId: editContents
      tags: [code]
      summary: Create, update or delete a file with a commit
      description: |
        Needs push permission. The commit goes on branch (default branch by
        default) or on a new branch started from it; the author is the
        caller. A stale sha or a concurrent change answers 409.
      security:
        - session: []
        - token: [repo:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FileEdit"
      responses:
        "201":
          description: Committed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileEditResult"
        "307":
          $ref: "#/components/responses/Moved"
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Unavailable"
        default:
          $ref: "#/components/responses/Problem"
  /search/repos:
    get:
      operationId: searchRepos
      tags: [code]
      summary: Search the visible repositories by name
      description: Exact matches first, then prefixes, then substrings.
      security:
        - session: [anonymous]
        - token: [repo:read]
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 100
        - $ref: "#/components/parameters/PageOffset"
        - $ref: "#/components/parameters/PageLimit"
      responses:
        "200":
          description: Repositories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Repo"
        "400":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /search/users:
    get:
      operationId: searchUsers
      tags: [users]
      summary: Search the users visible to the caller by username or display name prefix
      description: |
        For assignee and reviewer pickers. Active users only, exact username
        first, then username prefixes, then display name prefixes. With
        security.user_directory = "shared" (the default) a user sees the
        members of the organizations it belongs to, the collaborators of
        the repositories it owns or collaborates on and, with repo, the
        collaborators and owning organization members of that repository
        (which it must be able to read). With "instance", and for
        administrators, every active user is visible. Restricted users
        always get the shared scope.
      security:
        - session: []
        - token: [user:read]
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 100
        - name: repo
          in: query
          description: owner/name of a repository whose people are also visible
          schema:
            type: string
            maxLength: 140
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserSummary"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  # --- end code browsing ---
  # --- issues (tag: issues) ---
  /repos/{owner}/{name}/issues:
    parameters:
      - $ref: "#/components/parameters/RepoOwner"
      - $ref: "#/components/parameters/RepoName"
    get:
      operationId: listIssues
      tags: [issues]
      summary: Search the issues of the repository
      description: |
        Full-text search (title, body and comments) with filters. Without q
        the issues are sorted by creation date, newest first.
      security:
        - session: [anonymous]
        - token: [repo:read]
      parameters:
        - name: state
          in: query
          description: "Default open"
          schema:
            type: string
            enum: [open, closed, all]
        - name: labels
          in: query
          description: "Comma-separated label names; every one must be set"
          schema:
            type: string
        - name: milestone
          in: query
          description: "Milestone id, \"none\" or \"*\" (any)"
          schema:
            type: string
        - name: assignee
          in: query
          description: "Username, \"none\" or \"*\" (any)"
          schema:
            type: string
        - name: author
          in: query
          description: "Username of the author"
          schema:
            type: string
        - name: mentioned
          in: query
          description: "Username mentioned in the issue or its comments"
          schema:
            type: string
        - name: q
          in: query
          description: "Full-text query (websearch syntax)"
          schema:
            type: string
        - name: sort
          in: query
          description: "Default created, or relevance with q"
          schema:
            type: string
            enum: [created, updated, comments, relevance]
        - name: direction
          in: query
          description: "Default desc"
          schema:
            type: string
            enum: [asc, desc]
        - $ref: "#/components/parameters/PageOffset"
        - $ref: "#/components/parameters/PageLimit"
      responses:
        "200":
          description: OK
          headers:
            X-Has-More:
              $ref: "#/components/headers/HasMore"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Issue"
        "307":
          $ref: "#/components/responses/Moved"
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createIssue
      tags: [issues]
      summary: Open an issue
      description: |
        Any signed-in user who can read the repository can open an issue.
        Labels, assignees and the milestone need the triage permission and are
        silently ignored otherwise.
      security:
        - session: []
        - token: [repo:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
