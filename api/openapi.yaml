      - $ref: "#/components/parameters/RepoName"
    get:
      operationId: getTree
      tags: [code]
      summary: A directory of a ref
      description: |
        Directories first. With lastCommits the newest commit of each entry
        is filled within a time budget; entries left without lastCommit ran
        out of it. The raw content of a file is served by
        `GET /api/v1/repos/{owner}/{name}/raw?ref=&path=` and an archive by
        `GET /api/v1/repos/{owner}/{name}/archive?ref=&format=zip|tar.gz`.
      security:
        - session: [anonymous]
        - token: [repo:read]
      parameters:
        - $ref: "#/components/parameters/CodeRef"
        - $ref: "#/components/parameters/CodePath"
        - name: lastCommits
          in: query
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Directory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tree"
        "301":
          $ref: "#/components/responses/Moved"
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Unavailable"
        default:
          $ref: "#/components/responses/Problem"
