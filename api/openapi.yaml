  /repos/{owner}/{name}/issues:
    parameters:
      - $ref: "#/components/parameters/RepoOwner"
      - $ref: "#/components/parameters/RepoName"
    get:
      operationId: listIssues
      tags: [issues]
      summary: Search the issues of the repository
      description: |
        Full-text search (title, body and comments) with filters. Without q
        the issues are sorted by creation date, newest first.
      security:
        - session: [anonymous]
        - token: [repo:read]
      parameters:
        - name: state
          in: query
          description: "Default open"
          schema:
            type: string
            enum: [open, closed, all]
        - name: labels
          in: query
          description: "Comma-separated label names; every one must be set"
          schema:
            type: string
        - name: milestone
          in: query
          description: "Milestone id, \"none\" or \"*\" (any)"
          schema:
            type: string
        - name: assignee
          in: query
          description: "Username, \"none\" or \"*\" (any)"
          schema:
            type: string
        - name: author
          in: query
          description: "Username of the author"
          schema:
            type: string
        - name: mentioned
          in: query
          description: "Username mentioned in the issue or its comments"
          schema:
            type: string
        - name: q
          in: query
          description: "Full-text query (websearch syntax)"
          schema:
            type: string
        - name: sort
          in: query
          description: "Default created, or relevance with q"
          schema:
            type: string
            enum: [created, updated, comments, relevance]
        - name: direction
          in: query
          description: "Default desc"
          schema:
            type: string
            enum: [asc, desc]
        - $ref: "#/components/parameters/PageOffset"
        - $ref: "#/components/parameters/PageLimit"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Issue"
        "307":
          $ref: "#/components/responses/Moved"
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createIssue
      tags: [issues]
      summary: Open an issue
      description: |
        Any signed-in user who can read the repository can open an issue.
        Labels, assignees and the milestone need the triage permission and are
        silently ignored otherwise.
      security:
        - session: []
        - token: [repo:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
