openapi: 3.1.0
info:
  title: ErvisioRepo API
  version: 0.1.0
  description: REST API v1 of ErvisioRepo. The SPA, the CLI and the plugin use only this contract.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: /api/v1
tags:
  - name: meta
  - name: auth
  - name: users
  - name: admin
  - name: orgs
  - name: repos
  - name: releases
  - name: code
  - name: protection
  - name: webhooks
  - name: notifications
  - name: checks
  - name: actions
  - name: oauth
  - name: apps
  - name: presence
  - name: todo
# Every operation needs a session unless it declares `security: []`. The
# "admin" scope means an instance admin. Unsafe methods also need the
# X-CSRF-Token header (see components.securitySchemes.session).
security:
  - session: []
paths:
  /meta:
    get:
      operationId: getMeta
      tags: [meta]
      summary: Public information about this instance
      security: []
      responses:
        "200":
          description: Instance metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Meta"
        default:
          $ref: "#/components/responses/Problem"
  /admin/storage:
    get:
      operationId: getAdminStorage
      tags: [admin]
      summary: Storage targets, policies, cache usage and permanent warnings
      description: Instance admins only.
      security:
        - session: [admin]
      responses:
        "200":
          description: Storage status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageStatus"
        default:
          $ref: "#/components/responses/Problem"
  /admin/storage/{target}/test:
    post:
      operationId: testAdminStorageTarget
      tags: [admin]
      summary: Run a write/read/list/delete round trip on a storage target
      description: Instance admins only. Writes a random probe object under erepo-storage-test/ and always deletes it.
      security:
        - session: [admin]
      parameters:
        - name: target
          in: path
          required: true
          schema:
            type: string
            pattern: "^[a-z0-9][a-z0-9_-]{0,62}$"
      responses:
        "200":
          description: Test outcome; ok is false when a step failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageCheckResult"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /admin/storage/config:
    get:
      operationId: getAdminStorageConfig
      tags: [admin]
      summary: Storage targets and policies as the next start will run with them
      description: |
        Instance admins only. Targets of config.toml are read-only (source
        "file"); targets created in the web admin have source "database".
        Credentials are never returned, only whether each one is stored.
        Changes apply after a restart.
      security:
        - session: [admin]
      responses:
        "200":
          description: The storage configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageConfig"
        default:
          $ref: "#/components/responses/Problem"
  /admin/storage/host-keys:
    post:
      operationId: scanAdminStorageHostKeys
      tags: [admin]
      summary: Read the SSH host keys of an SFTP server
      description: |
        Instance admins only. Connects to the server, reads the host keys it
        offers (ed25519, ECDSA, RSA) without signing in, and returns them as
        known_hosts lines for the admin to check and save.
      security:
        - session: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StorageHostKeyScan"
      responses:
        "200":
          description: Host keys offered by the server
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageHostKeys"
        "400":
          $ref: "#/components/responses/Problem"
        "422":
          description: Invalid host or port, or the server cannot be reached
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ValidationProblem"
        default:
          $ref: "#/components/responses/Problem"
  /admin/storage/test:
    post:
      operationId: testAdminStorageDraft
      tags: [admin]
      summary: Run the connection test on a target definition that is not saved
      description: |
        Instance admins only. Writes a random probe object under
        erepo-storage-test/ and always deletes it. A credential left out
        falls back to the stored one of the database target with the same name.
      security:
        - session: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StorageTargetInput"
      responses:
        "200":
          description: Test outcome; ok is false when a step failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageCheckResult"
        "400":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          description: Invalid target definition
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ValidationProblem"
        default:
          $ref: "#/components/responses/Problem"
  /admin/storage/targets/{name}:
    parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
          pattern: "^[a-z0-9][a-z0-9_-]{0,62}$"
    put:
      operationId: putAdminStorageTarget
      tags: [admin]
      summary: Create or update an S3 or SFTP storage target
      description: |
        Instance admins only. Credentials are sealed with the master key; a
        credential left empty keeps the stored one. The name, kind and
        encrypt flag cannot change after creation, and the name cannot be one
        of config.toml. The change applies after a restart.
      security:
        - session: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StorageTargetInput"
      responses:
        "200":
          description: The storage configuration after the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageConfig"
        "400":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          description: Invalid target definition
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ValidationProblem"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteAdminStorageTarget
      tags: [admin]
      summary: Delete a storage target created in the web admin
      description: |
        Instance admins only. Refused while a policy uses the target. The
        change applies after a restart.
      security:
        - session: [admin]
      responses:
        "200":
          description: The storage configuration after the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageConfig"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          description: The target is read-only or still used by a policy
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ValidationProblem"
        default:
          $ref: "#/components/responses/Problem"
  /admin/storage/policies/{policy}/resync:
    parameters:
      - name: policy
        in: path
        required: true
        schema:
          type: string
          pattern: "^[a-z]{1,32}$"
    post:
      operationId: resyncAdminStoragePolicy
      tags: [admin]
      summary: Copy every object of a data type to its replicas again
      description: |
        Instance admins only. Queues every stored object of the running
        policy for replication (copies already complete are only re-hashed)
        and, for git, copies the repository manifests. Runs in the
        background; the pending count of the storage page shows progress.
        409 when the policy has no replica.
      security:
        - session: [admin]
      responses:
        "202":
          description: Objects queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageJobStarted"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /admin/storage/verify:
    post:
      operationId: verifyAdminStorage
      tags: [admin]
      summary: Verify every stored object
      description: |
        Instance admins only. Re-hashes every object on its primary and on
        every replica in the background (up to one million per run); a bad
        primary copy is repaired from a good replica and a bad replica is
        copied again. Results go to the server log and to the error counts
        of the storage page.
      security:
        - session: [admin]
      responses:
        "202":
          description: Verification started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageJobStarted"
        default:
          $ref: "#/components/responses/Problem"
  /admin/storage/policies/{policy}:
    parameters:
      - name: policy
        in: path
        required: true
        schema:
          type: string
          pattern: "^[a-z]{1,32}$"
    put:
      operationId: putAdminStoragePolicy
      tags: [admin]
      summary: Change where a data type is stored
      description: |
        Instance admins only. Sets the primary, replicas and cache of a
        policy declared in config.toml. The primary can only change while the
        policy holds no stored objects (422 otherwise), because objects are
        not migrated. Values equal to config.toml remove the override. The
        change applies after a restart.
      security:
        - session: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoragePolicyInput"
      responses:
        "200":
          description: The storage configuration after the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageConfig"
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          description: Invalid placement, or a primary change on a policy with objects
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ValidationProblem"
        default:
          $ref: "#/components/responses/Problem"
  /admin/storage/hot-cache:
    put:
      operationId: putAdminStorageHotCache
      tags: [admin]
      summary: Change the automatic hot cache of the instance
      description: |
        Instance admins only. When enabled, recently used data of every data
        type whose primary is remote stays on the local disk and moves back
        to the remote storage after ttlSeconds without reads or writes
        (0 uses the per data type defaults of hotCache.defaults). A data type
        can set its own TTL, or disable its cache, in its policy. Values
        equal to config.toml remove the override. The change applies after a
        restart.
      security:
        - session: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StorageHotCacheInput"
      responses:
        "200":
          description: The storage configuration after the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageConfig"
        "400":
          $ref: "#/components/responses/Problem"
        "422":
          description: Invalid TTL
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ValidationProblem"
        default:
          $ref: "#/components/responses/Problem"
  /admin/storage/hot-repos:
    get:
      operationId: listAdminHotRepos
      tags: [admin]
      summary: Repositories kept on the local disk, most recently used first
      description: |
        Instance admins only. Lists the hot repositories (hot, hydrating or
        evicting), or every repository with all=true, with the usage of the
        hot tier and where the repositories are stored. evictAt is when the
        idle TTL (or, for an ephemeral repository, the end of its use) moves
        a repository back to the remote storage; it is missing for pinned
        repositories and when there is no TTL or no remote storage.
      security:
        - session: [admin]
      parameters:
        - name: q
          in: query
          description: Case-insensitive substring of owner/name
          schema:
            type: string
            maxLength: 200
        - name: all
          in: query
          description: Also list repositories that are only on the remote storage
          schema:
            type: boolean
        - $ref: "#/components/parameters/PageOffset"
        - $ref: "#/components/parameters/PageLimit"
      responses:
        "200":
          description: A page of repositories with the hot tier usage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HotRepoPage"
        default:
          $ref: "#/components/responses/Problem"
  /admin/storage/avatars:
    get:
      operationId: getAdminAvatarStorage
      tags: [admin]
      summary: Where uploaded avatars are stored
      security:
        - session: [admin]
      responses:
        "200":
          description: Avatar storage settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvatarStorage"
        default:
          $ref: "#/components/responses/Problem"
    put:
      operationId: putAdminAvatarStorage
      tags: [admin]
      summary: Change where uploaded avatars are stored
      description: |
        Instance admins only. target is empty for the local storage of the
        instance (its first local target) or the name of a running target.
        publicUrl, when set, is the base URL a CDN serves the avatars from:
        new avatar URLs become <publicUrl>/avatars/<sha256>.png. The CDN may
        front this server (origin /avatars/) or the bucket of the target
        (objects under avatars/; not with an encrypted target). Applies at
        once to new uploads; avatars already uploaded are not moved, and
        this server keeps serving them from any running target.
      security:
        - session: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AvatarStorageInput"
      responses:
        "200":
          description: The settings after the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvatarStorage"
        "400":
          $ref: "#/components/responses/Problem"
        "422":
          description: Unknown target or invalid public URL
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ValidationProblem"
        default:
          $ref: "#/components/responses/Problem"
  /admin/repos/{owner}/{name}/pin:
    parameters:
      - $ref: "#/components/parameters/RepoOwner"
      - $ref: "#/components/parameters/RepoName"
    put:
      operationId: pinAdminRepo
      tags: [admin]
      summary: Pin a repository on the hot tier
      description: Instance admins only. A pinned repository is never evicted.
      security:
        - session: [admin]
      responses:
        "200":
          description: Tiering state after the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepoTiering"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: unpinAdminRepo
      tags: [admin]
      summary: Let the eviction job move a repository off the hot tier again
      description: Instance admins only.
      security:
        - session: [admin]
      responses:
        "200":
          description: Tiering state after the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepoTiering"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /admin/repos/{owner}/{name}/evict:
    parameters:
      - $ref: "#/components/parameters/RepoOwner"
      - $ref: "#/components/parameters/RepoName"
    post:
      operationId: evictAdminRepo
      tags: [admin]
      summary: Evict a hot repository to the remote tier now
      description: |
        Instance admins only. Applies the same checks as the eviction job
        (remote journal up to date and verified, lock free) but ignores the
        TTL and the pin. 409 when the repository is not hot or a check fails.
      security:
        - session: [admin]
      responses:
        "200":
          description: Tiering state after the eviction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepoTiering"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /admin/invites:
    get:
      operationId: listAdminInvites
      tags: [admin]
      summary: Instance invitations, newest first
      description: Instance admins only. Tokens are never returned.
      security:
        - session: [admin]
      parameters:
        - $ref: "#/components/parameters/PageOffset"
        - $ref: "#/components/parameters/PageLimit"
      responses:
        "200":
          description: A page of invitations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminInvitePage"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createInvite
      tags: [admin]
      summary: Create an instance invitation
      description: Instance admins only. The token is returned once and only its hash is stored.
      security:
        - session: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteRequest"
      responses:
        "201":
          description: Invitation created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invite"
        "400":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /admin/users:
    get:
      operationId: listAdminUsers
      tags: [admin]
      summary: Users of the instance, newest first
      description: Instance admins only.
      security:
        - session: [admin]
      parameters:
        - name: q
          in: query
          description: Case-insensitive substring of the username, display name or an email address
          schema:
            type: string
            maxLength: 200
        - name: role
          in: query
          schema:
            type: string
            enum: [admin, user, restricted]
        - name: suspended
          in: query
          schema:
            type: boolean
        - name: twoFactor
          in: query
          description: Only users with (true) or without (false) a second factor
          schema:
            type: boolean
        - name: bot
          in: query
          description: Only bot accounts (true) or only people (false)
          schema:
            type: boolean
        - $ref: "#/components/parameters/PageOffset"
        - $ref: "#/components/parameters/PageLimit"
      responses:
        "200":
          description: A page of users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserPage"
        default:
          $ref: "#/components/responses/Problem"
  /admin/users/{login}:
    parameters:
      - name: login
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getAdminUser
      tags: [admin]
      summary: One user of the instance
      description: Instance admins only.
      security:
        - session: [admin]
      responses:
        "200":
          description: The user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateAdminUser
      tags: [admin]
      summary: Change the role or suspension of a user
      description: |
        Instance admins only. Suspending revokes every session and token of
        the user. An admin cannot demote or suspend itself, the last
        active admin cannot be demoted or suspended, and bot accounts
        cannot be changed (409).
      security:
        - session: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUserUpdate"
      responses:
        "200":
          description: The updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /admin/users/{login}/2fa:
    delete:
      operationId: resetAdminUser2fa
      tags: [admin]
      summary: Remove the second factors of a user
      description: Instance admins only. Deletes the TOTP, recovery codes and passkeys.
      security:
        - session: [admin]
      parameters:
        - name: login
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Second factors removed
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /admin/invites/{inviteId}:
    delete:
      operationId: revokeInvite
      tags: [admin]
      summary: Revoke an unused instance invitation
      description: Instance admins only.
      security:
        - session: [admin]
      parameters:
        - name: inviteId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Invitation revoked
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /admin/overview:
    get:
      operationId: getAdminOverview
      tags: [admin]
      summary: Health and activity of the instance
      description: |
        Instance admins only. Request rate and disk samples are kept in
        memory by the server and start empty after a restart; job counts
        come from the Actions tables.
      security:
        - session: [admin]
      parameters:
        - name: range
          in: query
          schema:
            type: string
            enum: [24h, 7d]
            default: 24h
      responses:
        "200":
          description: Time series, service states and counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOverview"
        default:
          $ref: "#/components/responses/Problem"
  /admin/settings:
    get:
      operationId: getInstanceSettings
      tags: [admin]
      summary: Editable instance settings
      description: |
        Instance admins only. config.toml (or the defaults) is the base; the
        web admin stores overrides in the database. A key is locked when
        listed in [settings] locked or set by an EREPO_ variable. Changes
        apply at the next start.
      security:
        - session: [admin]
      responses:
        "200":
          description: The settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstanceSettings"
        default:
          $ref: "#/components/responses/Problem"
    put:
      operationId: updateInstanceSettings
      tags: [admin]
      summary: Change instance settings
      description: |
        Instance admins only. The whole resulting configuration is validated.
        A value equal to the one of config.toml removes the override. The
        change applies after a restart.
      security:
        - session: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstanceSettingsUpdate"
      responses:
        "200":
          description: The settings after the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstanceSettings"
        "400":
          $ref: "#/components/responses/Problem"
        "422":
          description: Invalid or locked settings
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ValidationProblem"
        default:
          $ref: "#/components/responses/Problem"
  /admin/updates:
    get:
      operationId: getUpdateStatus
      tags: [admin]
      summary: Server updates
      description: |
        Instance admins only. The running version, the releases found by the
        last GitHub check (every 6 hours, unless updates.check is off), the
        state of the Docker updater container and a terminal command that
        updates the instance by hand.
      security:
        - session: [admin]
      responses:
        "200":
          description: The update state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateStatus"
        default:
          $ref: "#/components/responses/Problem"
  /admin/updates/check:
    post:
      operationId: checkUpdates
      tags: [admin]
      summary: Check GitHub for new releases now
      security:
        - session: [admin]
      responses:
        "200":
          description: The update state after the check (a failed check is in checkError)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateStatus"
        default:
          $ref: "#/components/responses/Problem"
  /admin/updates/auto:
    put:
      operationId: setAutoUpdate
      tags: [admin]
      summary: Turn automatic updates on or off
      description: |
        Instance admins only. When on, the updater installs a new release an
        hour after it is published. Applies at once, no restart.
      security:
        - session: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: {type: boolean}
      responses:
        "200":
          description: The update state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateStatus"
        default:
          $ref: "#/components/responses/Problem"
  /admin/updates/apply:
    post:
      operationId: applyUpdate
      tags: [admin]
      summary: Update the Docker installation
      description: |
        Instance admins only. Hands the version to the updater container,
        which backs up .env, the configuration and the database, pulls the
        new image and recreates the containers, rolling back on failure. The
        server restarts during the update. 409 when an update is already
        running or the version is not a newer release; 503 when the
        installation is not Docker or the updater is not running.
      security:
        - session: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version: {type: string, description: "x.y.z"}
      responses:
        "202":
          description: The update was requested
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateStatus"
        "409":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Create an account
      description: |
        The answer does not reveal whether the email address is already
        registered: in that case nothing is created and the owner of the
        address receives a notice by mail. The first account of the instance
        becomes an instance admin and is accepted whatever the registration
        policy.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "202":
          description: Registration accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterAccepted"
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/Problem"
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Sign in with a password
      description: |
        Sets a new session cookie (the previous session of this browser is
        revoked) and a new CSRF cookie. Every credential failure answers the
        same 401. Repeated failures are slowed down per account and per IP.
        When the account has a second factor, or policy requires one, the
        answer is 202 with the pending step: no session yet, only the
        short-lived HttpOnly erepo_mfa cookie, to complete under /auth/mfa.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "202":
          description: Password accepted, second factor needed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MfaChallenge"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/Problem"
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Sign out and revoke the current session
      security: []
      responses:
        "204":
          description: Signed out
        default:
          $ref: "#/components/responses/Problem"
  /auth/email/verify:
    post:
      operationId: verifyEmail
      tags: [auth]
      summary: Confirm an email address with the token sent by mail
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenRequest"
      responses:
        "204":
          description: Address verified
        "400":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /auth/email/resend:
    post:
      operationId: resendVerification
      tags: [auth]
      summary: Send the verification mail again
      description: Always accepted, whether or not the address is registered.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailRequest"
      responses:
        "202":
          description: Accepted
        "400":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/Problem"
  /auth/password/reset:
    post:
      operationId: requestPasswordReset
      tags: [auth]
      summary: Send a password reset link
      description: Always accepted, whether or not the address is registered.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailRequest"
      responses:
        "202":
          description: Accepted
        "400":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/Problem"
  /auth/password/reset/confirm:
    post:
      operationId: resetPassword
      tags: [auth]
      summary: Set a new password with the token sent by mail
      description: Revokes every session of the account.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "204":
          description: Password changed
        "400":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /user:
    get:
      operationId: getCurrentUser
      tags: [users]
      summary: The signed-in user
      security:
        - session: []
        - token: [user:read]
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /user/profile:
    patch:
      operationId: updateProfile
      tags: [users]
      summary: Change display name, avatar and language
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdate"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /user/profile/details:
    get:
      operationId: getProfileDetails
      tags: [users]
      summary: Public profile details of the signed-in user
      security:
        - session: []
        - token: [user:read]
      responses:
        "200":
          description: Details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileDetails"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    put:
      operationId: updateProfileDetails
      tags: [users]
      summary: Change the public profile details
      description: publicEmail must be a verified address of the account, or empty.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileDetails"
      responses:
        "200":
          description: Saved details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileDetails"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /user/avatar:
    put:
      operationId: uploadAvatar
      tags: [users]
      summary: Upload an avatar image
      description: |
        The raw image is the body (Content-Type image/png, image/jpeg or
        image/gif; the format is detected from the content): at most 2 MiB and
        4096x4096 pixels. The server crops it to a centred square, scales it
        to 460x460 and stores it as PNG (dropping any metadata) under a
        content-addressed name, on the storage chosen by the admin (see
        /admin/storage/avatars). avatarUrl becomes the URL that serves it:
        GET /avatars/{sha256}.png on this server (public, outside this
        document, cached as immutable), or the same path under the public
        base URL set by the admin. It replaces an external avatar URL.
      security:
        - session: []
        - token: [user:write]
      requestBody:
        required: true
        content:
          image/*:
            schema: {type: string, format: binary}
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteAvatar
      tags: [users]
      summary: Remove the avatar
      description: Clears avatarUrl, uploaded or external. Stored images are kept, their URLs are immutable.
      security:
        - session: []
        - token: [user:write]
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /user/password:
    put:
      operationId: changePassword
      tags: [users]
      summary: Change the password
      description: |
        Needs the current password (omitted only by accounts that have none
        yet, for example created through an external identity). Every other
        session of the user is revoked.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordChange"
      responses:
        "204":
          description: Password changed
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/Problem"
  /user/sessions:
    get:
      operationId: listSessions
      tags: [users]
      summary: Active sessions of the signed-in user
      responses:
        "200":
          description: Sessions, most recently used first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SessionInfo"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: revokeOtherSessions
      tags: [users]
      summary: Sign out everywhere else
      description: Revokes every session except the current one.
      responses:
        "204":
          description: Revoked
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /user/sessions/{id}:
    delete:
      operationId: revokeSession
      tags: [users]
      summary: Revoke a session
      parameters:
        - $ref: "#/components/parameters/CredentialID"
      responses:
        "204":
          description: Revoked
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /user/emails:
    get:
      operationId: listEmails
      tags: [users]
      summary: Email addresses of the signed-in user
      responses:
        "200":
          description: Addresses, the primary one first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EmailAddress"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: addEmail
      tags: [users]
      summary: Add an email address
      description: The address stays unverified until the link sent to it is opened.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailRequest"
      responses:
        "201":
          description: Added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailAddress"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/Problem"
  /user/emails/{id}:
    delete:
      operationId: deleteEmail
      tags: [users]
      summary: Remove an email address
      description: The primary address cannot be removed (409); make another one primary first.
      parameters:
        - $ref: "#/components/parameters/CredentialID"
      responses:
        "204":
          description: Removed
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /user/emails/{id}/primary:
    post:
      operationId: setPrimaryEmail
      tags: [users]
      summary: Make an address the primary one
      description: With mail enabled the address must be verified (409 otherwise).
      parameters:
        - $ref: "#/components/parameters/CredentialID"
      responses:
        "204":
          description: Done
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /user/emails/{id}/verify:
    post:
      operationId: resendEmailVerification
      tags: [users]
      summary: Send the verification link again
      parameters:
        - $ref: "#/components/parameters/CredentialID"
      responses:
        "202":
          description: Queued
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/Problem"
  /auth/mfa:
    get:
      operationId: getMfaChallenge
      tags: [auth]
      summary: The pending second-factor step of this browser
      description: |
        Reads the pending login held in the erepo_mfa cookie (set by a 202
        from POST /auth/login). 401 when there is none or it expired.
      security: []
      responses:
        "200":
          description: Pending login
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MfaChallenge"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /auth/mfa/totp:
    post:
      operationId: verifyMfaTotp
      tags: [auth]
      summary: Complete a pending login with an authenticator app code
      description: |
        A code is accepted once: a replay in the same time window fails.
        After five wrong codes the pending login is dropped.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CodeRequest"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/Problem"
  /auth/mfa/recovery:
    post:
      operationId: verifyMfaRecovery
      tags: [auth]
      summary: Complete a pending login with a recovery code
      description: Each recovery code works once.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CodeRequest"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/Problem"
  /auth/mfa/webauthn/options:
    post:
      operationId: beginMfaWebAuthn
      tags: [auth]
      summary: Options to complete a pending login with a security key
      security: []
      responses:
        "200":
          description: Options for navigator.credentials.get
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebAuthnOptions"
        "401":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /auth/mfa/webauthn:
    post:
      operationId: verifyMfaWebAuthn
      tags: [auth]
      summary: Complete a pending login with a security key
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebAuthnCredentialRequest"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /auth/mfa/enroll/totp:
    post:
      operationId: beginMfaEnrollTotp
      tags: [auth]
      summary: Set up an authenticator app during a login that requires one
      description: |
        Only for a pending login with enrollmentRequired: the account must
        have a second factor and has none yet.
      security: []
      responses:
        "200":
          description: New secret, to confirm with a code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TotpSetup"
        "401":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /auth/mfa/enroll/totp/confirm:
    post:
      operationId: confirmMfaEnrollTotp
      tags: [auth]
      summary: Confirm the authenticator app and complete the login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CodeRequest"
      responses:
        "200":
          description: Signed in; the recovery codes are shown only once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MfaEnrollResult"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/Problem"
  /auth/mfa/passkey/options:
    post:
      operationId: beginPasskeyLogin
      tags: [auth]
      summary: Options for a passwordless sign-in with a passkey
      security: []
      responses:
        "200":
          description: Ceremony token and options for navigator.credentials.get
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasskeyChallenge"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /auth/mfa/passkey:
    post:
      operationId: passkeyLogin
      tags: [auth]
      summary: Sign in with a passkey
      description: |
        The passkey must verify the user (PIN or biometrics), so it stands
        for both factors. Sets the session and CSRF cookies like a login.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasskeyLoginRequest"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /user/security:
    get:
      operationId: getSecurity
      tags: [users]
      summary: Second factors of the signed-in user
      responses:
        "200":
          description: Second-factor setup
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecurityStatus"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /user/security/totp:
    post:
      operationId: setupTotp
      tags: [users]
      summary: Start setting up an authenticator app
      description: Needs the password or a current code. Confirm with POST /user/security/totp/confirm.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReauthRequest"
      responses:
        "200":
          description: New secret, to confirm with a code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TotpSetup"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: disableTotp
      tags: [users]
      summary: Remove the authenticator app
      description: |
        Needs the password or a current code. Refused (409) when it is the
        last factor and policy requires two-factor authentication.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReauthRequest"
      responses:
        "204":
          description: Removed
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/Problem"
  /user/security/totp/confirm:
    post:
      operationId: confirmTotp
      tags: [users]
      summary: Enable the authenticator app with a first code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CodeRequest"
      responses:
        "200":
          description: Enabled; new recovery codes when the account had none (shown only once)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryCodes"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/Problem"
  /user/security/recovery-codes:
    post:
      operationId: regenerateRecoveryCodes
      tags: [users]
      summary: Replace the recovery codes
      description: The old codes stop working. Needs the password or a current code.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReauthRequest"
      responses:
        "200":
          description: New recovery codes, shown only once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryCodes"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/Problem"
  /user/security/passkeys/options:
    post:
      operationId: beginPasskeyRegistration
      tags: [users]
      summary: Options to register a passkey
      description: Needs the password or a current code.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReauthRequest"
      responses:
        "200":
          description: Ceremony token and options for navigator.credentials.create
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasskeyChallenge"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /user/security/passkeys:
    post:
      operationId: registerPasskey
      tags: [users]
      summary: Register a passkey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasskeyRegisterRequest"
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Passkey"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /user/security/passkeys/{id}:
    delete:
      operationId: deletePasskey
      tags: [users]
      summary: Remove a passkey
      description: |
        Needs the password or a current code. Refused (409) when it is the
        last factor and policy requires two-factor authentication.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReauthRequest"
      responses:
        "204":
          description: Removed
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/Problem"
  /auth/oidc/providers:
    get:
      operationId: listOidcProviders
      tags: [auth]
      summary: External identity providers configured on this instance
      description: |
        Sign in with a provider by navigating the browser to
        /auth/oidc/{name}/login?return_to=/path (outside /api/v1); the
        provider redirects back to /auth/oidc/{name}/callback.
      security: []
      responses:
        "200":
          description: Providers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OidcProvider"
        default:
          $ref: "#/components/responses/Problem"
  /user/oidc:
    get:
      operationId: listOidcLinks
      tags: [users]
      summary: External identities linked to the account
      responses:
        "200":
          description: Linked identities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OidcLink"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /user/oidc/{provider}/link:
    post:
      operationId: beginOidcLink
      tags: [users]
      summary: Start linking an external identity
      description: |
        Returns the provider URL to navigate to and sets the state cookie.
        The callback links the identity only for the same signed-in session.
        An identity is never linked because its email matches the account.
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            maxLength: 64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OidcLinkRequest"
      responses:
        "200":
          description: Redirect target
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OidcRedirect"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "502":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /user/oidc/{id}:
    delete:
      operationId: unlinkOidc
      tags: [users]
      summary: Unlink an external identity
      description: Refused (409) when it is the last way to sign in.
      parameters:
        - $ref: "#/components/parameters/CredentialID"
      responses:
        "204":
          description: Unlinked
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /user/tokens:
    get:
      operationId: listAccessTokens
      tags: [users]
      summary: Personal access tokens of the account
      responses:
        "200":
          description: Tokens (without secrets)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AccessToken"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createAccessToken
      tags: [users]
      summary: Create a personal access token
      description: |
        The secret is returned only once. Only a session can manage tokens;
        the admin scope needs an instance admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccessTokenCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedAccessToken"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /user/tokens/{id}:
    delete:
      operationId: revokeAccessToken
      tags: [users]
      summary: Revoke a personal access token
      parameters:
        - $ref: "#/components/parameters/CredentialID"
      responses:
        "204":
          description: Revoked
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /user/ervisiocode:
    get:
      operationId: getErvisioCodeAccount
      tags: [users]
      summary: Get the account and current ErvisioCode device
      description: |
        Only an ErvisioCode device credential is accepted. The account ID is
        stable across username changes.

        To opt in, send `client_id=ErvisioCodeRemote` and the explicit
        `scope=ervisiocode:device` to `POST /login/device/code` at the server
        root (not under /api/v1). An optional `device_name` is a friendly
        label, not a network address. Send `Accept: application/json` for
        JSON. The user opens `verification_uri`, enters `user_code`, signs
        in if needed, and explicitly approves. Poll the server root's
        `POST /login/oauth/access_token` with the same `client_id`,
        `device_code`, and `grant_type=urn:ietf:params:oauth:grant-type:device_code`
        at the returned `interval` in seconds. Success returns
        `access_token`, `token_type=bearer`, and `scope=ervisiocode:device`.
        The issued credential is valid until revoked or expired.
      security:
        - token: [ervisiocode:device]
      responses:
        "200":
          description: The signed-in account and current device credential
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErvisioCodeAccount"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /user/ervisiocode/hub-session:
    post:
      operationId: createErvisioCodeHubSession
      tags: [users]
      summary: Issue an ErvisioCode hub session for the current device
      description: Replaces the current device's hub session. The HTTPS-only cookie is usable only by the hub session, sessions, and projects operations, is not a browser sign-in, and expires after 15 minutes at most.
      security:
        - token: [ervisiocode:device]
      responses:
        "204":
          description: Hub session issued
          headers:
            Set-Cookie:
              required: true
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    get:
      operationId: getErvisioCodeHubSession
      tags: [users]
      summary: Read the account and devices of an active ErvisioCode hub session
      description: Only the hub cookie is accepted. The session stops working when its issuing device expires or is revoked.
      security:
        - hubSession: []
      parameters:
        - name: accountId
          in: query
          required: true
          description: The account ID stored by the device. Must match the hub session.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Account and authorized devices
          content:
            application/json:
              schema:
                type: object
                required: [accountId, username, devices]
                properties:
                  accountId:
                    type: string
                    format: uuid
                  username:
                    type: string
                  displayName:
                    type: string
                    description: Profile display name for the authenticated account.
                  avatarUrl:
                    type: string
                    description: Profile avatar URL, if set for the authenticated account.
                  devices:
                    type: array
                    items:
                      $ref: "#/components/schemas/ErvisioCodeDevice"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /user/ervisiocode/devices:
    get:
      operationId: listErvisioCodeDevices
      tags: [users]
      summary: List active ErvisioCode device credentials
      description: Returns only the caller's unexpired device registrations, newest first. Remote presence is advisory. No secrets are returned.
      security:
        - session: []
        - token: [ervisiocode:device]
      responses:
        "200":
          description: Active devices
          headers:
            Cache-Control:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ErvisioCodeDevice"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /user/ervisiocode/devices/{id}:
    delete:
      operationId: revokeErvisioCodeDevice
      tags: [users]
      summary: Revoke an ErvisioCode device credential
      description: An account session can revoke any device it owns. A device credential can revoke only itself.
      security:
        - session: []
        - token: [ervisiocode:device]
      parameters:
        - $ref: "#/components/parameters/CredentialID"
      responses:
        "204":
          description: Revoked
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /user/ervisiocode/remote:
    put:
      operationId: setErvisioCodeRemotePresence
      tags: [users]
      summary: Update the current ErvisioCode device's remote presence
      description: |
        Only the device credential can report its own presence. Send `active: true`
        periodically while Remote Control is running. Presence expires 45 seconds
        after the last heartbeat, or immediately on `active: false`. This reports
        status only and does not expose or connect to the device.
      security:
        - token: [ervisiocode:device]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ErvisioCodeRemotePresenceUpdate"
      responses:
        "204":
          description: Presence updated
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /user/ervisiocode/sessions:
    parameters:
      - name: accountId
        in: query
        description: Required for the hub cookie. When supplied, authenticates only that embedded hub session, except that Bearer callers may supply their own account ID.
        schema: {type: string, format: uuid}
    get:
      operationId: listErvisioCodeSessions
      tags: [users]
      summary: List live ErvisioCode Remote sessions and offline recent metadata
      description: Only explicitly published sessions appear. Live access expires 15 seconds after the last poll. Offline entries carry no relay ID and cannot be acted on.
      security:
        - session: []
        - hubSession: []
        - token: [ervisiocode:device]
      responses:
        "200":
          description: Live sessions and offline recent metadata for the caller's linked devices
          content:
            application/json:
              schema:
                type: object
                required: [sessions, recent]
                properties:
                  sessions:
                    type: array
                    items: {$ref: "#/components/schemas/ErvisioCodeRemoteSession"}
                  recent:
                    type: array
                    items: {$ref: "#/components/schemas/ErvisioCodeRemoteRecent"}
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: actOnErvisioCodeSession
      tags: [users]
      summary: Read, prompt, or interrupt one live ErvisioCode Remote session
      description: |
        Waits at most 10 seconds for the linked host. Browser sessions use the normal
        CSRF token; embedded hub sessions require a matching HTTPS Origin and JSON.
        Prompt and interrupt are never automatically replayed; a timeout does
        not prove the host did not already accept the operation.
      security:
        - session: []
        - hubSession: []
        - token: [ervisiocode:device]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ErvisioCodeRemoteAction"}
      responses:
        "200":
          description: Session state or acknowledgement
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErvisioCodeRemoteState"}
        "404":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
        "502":
          $ref: "#/components/responses/Problem"
        "504":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /user/ervisiocode/projects:
    parameters:
      - name: accountId
        in: query
        description: Required for the hub cookie. When supplied, authenticates only that embedded hub session, except that Bearer callers may supply their own account ID.
        schema: {type: string, format: uuid}
    get:
      operationId: listErvisioCodeProjects
      tags: [users]
      summary: List locally approved projects advertised by the caller's live linked hosts
      security:
        - session: []
        - hubSession: []
        - token: [ervisiocode:device]
      responses:
        "200":
          description: Live project advertisements
          content:
            application/json:
              schema:
                type: object
                required: [projects]
                properties:
                  projects:
                    type: array
                    items: {$ref: "#/components/schemas/ErvisioCodeRemoteProject"}
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createErvisioCodeRemoteSession
      tags: [users]
      summary: Create a session on a live linked host in a locally approved project
      description: |
        Local projects have up to 10 seconds. Repository-backed projects allow
        up to 12 additional seconds for live provider authorization before giving
        the host up to 45 seconds for a separate checkout or 10 seconds otherwise.
        Browser sessions use the normal CSRF token; embedded hub sessions require
        a matching HTTPS Origin and JSON.
        A timeout does not prove the host did not create a session. Refresh the live
        list instead of automatically retrying.
      security:
        - session: []
        - hubSession: []
        - token: [ervisiocode:device]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ErvisioCodeRemoteCreate"}
      responses:
        "200":
          description: The host created and published a session
          content:
            application/json:
              schema:
                type: object
                required: [sessionId]
                properties:
                  sessionId: {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9_-]+$'}
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
        "502":
          $ref: "#/components/responses/Problem"
        "504":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /user/ervisiocode/catalog:
    parameters:
      - name: accountId
        in: query
        description: Selects the matching embedded hub session. Omit for a normal browser session.
        schema: {type: string, format: uuid}
    get:
      operationId: listErvisioCodeRepositoryCatalog
      tags: [users]
      summary: List the selected account's repositories and their matching live host approvals
      description: |
        Discovery does not grant checkout access. A repository with no matching live
        host approval has an empty checkouts array. Only the IDs of a live host
        approval can be used to create a session. GitHub discovery uses the selected
        account's personal GitHub.com connections configured in ErvisioRepo.
      security:
        - session: []
        - hubSession: []
      responses:
        "200":
          description: Provider catalog results
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErvisioCodeRepositoryCatalog"}
        default:
          $ref: "#/components/responses/Problem"
  /user/ervisiocode/shares:
    parameters:
      - $ref: "#/components/parameters/ErvisioCodeShareAccountId"
    get:
      operationId: listErvisioCodeShares
      tags: [users]
      summary: List owned and currently accessible ErvisioCode shares
      security:
        - session: []
        - hubSession: []
      parameters:
        - $ref: "#/components/parameters/ErvisioCodeShareBeforeId"
      responses:
        "200":
          description: Owned shares, active received shares, and valid pending invites issued to the caller
          content:
            application/json:
              schema:
                type: object
                required: [shares, pendingInvitations]
                properties:
                  shares:
                    type: array
                    items: {$ref: "#/components/schemas/ErvisioCodeShare"}
                  pendingInvitations: {type: integer, format: int64, minimum: 0, description: Total valid pending personal invitations issued to the caller across all pages.}
                  nextBeforeId: {type: string, format: uuid}
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createErvisioCodeShare
      tags: [users]
      summary: Invite an account or grant current members of an organization access
      description: Browser writes require the CSRF header. All writes require the configured HTTPS origin. Personal invites expire after seven days and only the named account can accept. Organization grants require the host account to be a current owner or admin. Direct grants require a capable live host, full history, and separate consent for organization grants.
      security:
        - session: []
        - hubSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ErvisioCodeShareCreate"}
      responses:
        "201":
          description: Created share; the secret token is returned only on creation of a personal invite
          content:
            application/json:
              schema:
                type: object
                required: [share]
                properties:
                  share: {$ref: "#/components/schemas/ErvisioCodeShare"}
                  token: {type: string}
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /user/ervisiocode/shares/recipients:
    parameters:
      - $ref: "#/components/parameters/ErvisioCodeShareAccountId"
    get:
      operationId: searchErvisioCodeRecipients
      tags: [users]
      summary: Search the ErvisioCode sharing directory
      description: Searches visible accounts or organizations where the caller is an owner or admin. Returns at most ten matches and never returns email addresses.
      security:
        - session: []
        - hubSession: []
      parameters:
        - name: q
          in: query
          required: true
          description: A case-insensitive handle or display-name prefix, optionally prefixed by @.
          schema: {type: string, minLength: 1, maxLength: 100}
        - name: kind
          in: query
          required: true
          schema: {$ref: "#/components/schemas/ErvisioCodeRecipientKind"}
      responses:
        "200":
          description: Eligible sharing recipients matching the prefix
          content:
            application/json:
              schema:
                type: object
                required: [recipients]
                properties:
                  recipients:
                    type: array
                    maxItems: 10
                    items: {$ref: "#/components/schemas/ErvisioCodeRecipient"}
        default:
          $ref: "#/components/responses/Problem"
  /user/ervisiocode/shares/accept:
    parameters:
      - $ref: "#/components/parameters/ErvisioCodeShareAccountId"
    post:
      operationId: acceptErvisioCodeShare
      tags: [users]
      summary: Accept a personal invitation as the account it was issued to
      security:
        - session: []
        - hubSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ErvisioCodeShareAccept"}
      responses:
        "200":
          description: Accepted share
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErvisioCodeShare"}
        default:
          $ref: "#/components/responses/Problem"
  /user/ervisiocode/shares/{shareId}:
    parameters:
      - $ref: "#/components/parameters/ErvisioCodeShareAccountId"
      - $ref: "#/components/parameters/ErvisioCodeShareId"
    delete:
      operationId: revokeErvisioCodeShare
      tags: [users]
      summary: Revoke a share or pending personal invite
      security:
        - session: []
        - hubSession: []
      responses:
        "204":
          description: Share revoked by its host account or a current organization owner or admin
        default:
          $ref: "#/components/responses/Problem"
  /user/ervisiocode/shares/{shareId}/accept:
    parameters:
      - $ref: "#/components/parameters/ErvisioCodeShareAccountId"
      - $ref: "#/components/parameters/ErvisioCodeShareId"
    post:
      operationId: acceptErvisioCodeShareById
      tags: [users]
      summary: Accept a pending personal invitation from the signed-in account's inbox
      description: Only the named recipient can accept. The invite must be unexpired and unrevoked, and target a session still published by a valid linked device. The device may be offline.
      security:
        - session: []
        - hubSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: false}
      responses:
        "200":
          description: Accepted share
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErvisioCodeShare"}
        default:
          $ref: "#/components/responses/Problem"
  /user/ervisiocode/shares/{shareId}/reject:
    parameters:
      - $ref: "#/components/parameters/ErvisioCodeShareAccountId"
      - $ref: "#/components/parameters/ErvisioCodeShareId"
    post:
      operationId: rejectErvisioCodeShare
      tags: [users]
      summary: Reject a pending personal invitation as its named recipient
      description: Only an unexpired, unrevoked personal invitation can be rejected. This does not revoke accepted shares or organization grants.
      security:
        - session: []
        - hubSession: []
      responses:
        "204":
          description: Personal invitation rejected
        default:
          $ref: "#/components/responses/Problem"
  /user/ervisiocode/shares/{shareId}/state:
    parameters:
      - $ref: "#/components/parameters/ErvisioCodeShareAccountId"
      - $ref: "#/components/parameters/ErvisioCodeShareId"
    get:
      operationId: getErvisioCodeSharedState
      tags: [users]
      summary: Read the visible transcript of a live shared session
      description: Returns the host's visible session transcript. Restricted grants require a host that applies the requested history boundary and never fall back to full history. On compatible hosts, an active direct grant can add attributed prompts to the same transcript, and the host's agent works on them. The service does not persist the transcript.
      security:
        - session: []
        - hubSession: []
      responses:
        "200":
          description: Recent messages and session busy status
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErvisioCodeSharedState"}
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
        "502":
          $ref: "#/components/responses/Problem"
        "504":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /user/ervisiocode/shares/{shareId}/collaboration:
    parameters:
      - $ref: "#/components/parameters/ErvisioCodeShareAccountId"
      - $ref: "#/components/parameters/ErvisioCodeShareId"
    post:
      operationId: actOnErvisioCodeCollaboration
      tags: [users]
      summary: Send or stop a tool-free contribution in the shared session
      description: An active direct grant can submit plain text for a model response in the session transcript. Only its requester or the owner may stop the pending contribution. Acknowledgment does not wait for generation. These operations never target owner execution.
      security:
        - session: []
        - hubSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ErvisioCodeCollaborationAction"}
      responses:
        "204":
          description: The host acknowledged the action
        default:
          $ref: "#/components/responses/Problem"
  /user/ervisiocode/shares/{shareId}/proposals:
    parameters:
