      security:
        - session: []
        - token: [repo:read]
      parameters:
        - $ref: "#/components/parameters/PageOffset"
        - $ref: "#/components/parameters/PageLimit"
      responses:
        "200":
          description: Events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /user/pins:
