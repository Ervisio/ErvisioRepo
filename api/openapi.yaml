        "307":
          $ref: "#/components/responses/Moved"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /repos/{owner}/{name}/collaborators/{username}:
    parameters:
      - $ref: "#/components/parameters/RepoOwner"
      - $ref: "#/components/parameters/RepoName"
      - $ref: "#/components/parameters/Username"
    put:
      operationId: setRepoCollaborator
      tags: [repos]
      summary: Grant a permission to a user
      description: Admins of the repository.
      security:
        - session: []
        - token: [repo:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RepoPermissionRequest"
      responses:
        "204":
          description: Granted
        "307":
          $ref: "#/components/responses/Moved"
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
