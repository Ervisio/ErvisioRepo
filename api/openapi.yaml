  /user/ervisiocode/relay:
    post:
      operationId: pollErvisioCodeRelay
      tags: [users]
      summary: Poll typed ErvisioCode Remote actions as the linked host
      description: |
        Use only over HTTPS with the linked device Bearer token. Poll serially about every
        two seconds with a fresh UUID per active Remote lifetime and a complete opt-in
        list of sessions in host-approved projects. `enabled: true` permits an empty
        session list and publishes the approved project advertisements. `enabled: false`
        withdraws live access without clearing recents. An enabled snapshot also replaces
        the stored metadata, so omitted sessions disappear from recents. When `enabled`
        is omitted, the lifetime is active only when sessions are present.
        Deliveries are at most once; discard expired requests and recheck
        local approval before acting on any session or creating one in a project.
      security:
        - token: [ervisiocode:device]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ErvisioCodeRelayPoll"}
      responses:
        "200":
          description: Actions to dispatch to a still-approved local session or project, in order
          content:
            application/json:
              schema:
                type: object
                required: [requests]
                properties:
                  requests:
                    type: array
                    items: {$ref: "#/components/schemas/ErvisioCodeRelayRequest"}
        default:
          $ref: "#/components/responses/Problem"
  /user/ervisiocode/shares/{shareId}/collaboration/check:
    parameters:
      - $ref: "#/components/parameters/ErvisioCodeShareId"
    post:
      operationId: checkErvisioCodeCollaboration
      tags: [users]
      summary: Recheck grant and contributor access as the approved linked host
      description: Use the same device Bearer token as the relay poll. Check before acting on a collaboration delivery and before retaining or publishing a collaboration reply. A non-204 response denies access.
      security:
        - token: [ervisiocode:device]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ErvisioCodeCollaborationCheck"}
      responses:
        "204":
          description: The exact live device publication and contributor are authorized
        default:
          $ref: "#/components/responses/Problem"
  /user/device/{userCode}:
    parameters:
      - name: userCode
        in: path
        required: true
        description: The one-time code shown by the device (XXXX-XXXX; case and dash are ignored)
        schema:
          type: string
          maxLength: 32
    get:
      operationId: getDeviceAuthorization
      tags: [users]
      summary: Look up a pending OAuth device authorization
      description: |
        Session only. Returns the request a device started with
        POST /login/device/code (RFC 8628) while it is pending and not
        expired. Wrong codes are rate limited per account and client IP
        (429 with Retry-After).
      responses:
        "200":
          description: The pending request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceAuthorization"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: decideDeviceAuthorization
      tags: [users]
      summary: Authorize or deny a pending OAuth device authorization
      description: |
        Session only. On approval the device receives a new access token of
        the caller at its next poll of POST /login/oauth/access_token; the
        token appears among the personal access tokens for the gh and eg
        clients. ErvisioCode credentials are listed separately at
        /user/ervisiocode/devices.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceAuthorizationDecision"
      responses:
        "204":
          description: Recorded
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
