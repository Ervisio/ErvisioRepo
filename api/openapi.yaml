components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: __Host-erepo_session
      description: |
        Opaque session cookie set by POST /auth/login. When the public URL is
        plain http on a non-loopback host the cookie is named erepo_session.
        Requests with an unsafe method must send the X-CSRF-Token header with
        the value of the erepo_csrf cookie (__Host-erepo_csrf on https).
    token:
      type: http
      scheme: bearer
      description: |
        Personal access token (erp_...) in "Authorization: Bearer". Only the
        operations that list the token scheme accept it, and the token must
        hold every scope listed there. Tokens skip the CSRF check.
  parameters:
    CredentialID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OrgName:
      name: org
      in: path
      required: true
      schema:
        type: string
        maxLength: 39
    TeamName:
      name: team
      in: path
      required: true
      schema:
        type: string
        maxLength: 39
    Username:
      name: username
      in: path
      required: true
      schema:
        type: string
        maxLength: 39
    AuditBefore:
      name: before
      in: query
      description: Cursor; the next value of the previous page
      schema:
        type: string
        format: uuid
    AuditLimit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    AuditAction:
      name: action
      in: query
      description: Exact action, or a prefix ending with "." (e.g. org.)
      schema:
        type: string
        maxLength: 100
  responses:
    Problem:
      description: Error in RFC 9457 format
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    TooManyRequests:
      description: Too many attempts; retry after the given number of seconds
      headers:
        Retry-After:
          required: true
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    OidcProvider:
      type: object
      required: [name, label]
      properties:
        name:
          type: string
        label:
          type: string
    OidcLink:
      type: object
      required: [id, provider, label, createdAt]
      properties:
        id:
          type: string
          format: uuid
        provider:
          type: string
        label:
          type: string
        email:
          type: string
          description: Email address reported by the provider, if any
        createdAt:
          type: string
          format: date-time
        lastLoginAt:
          type: string
          format: date-time
    OidcLinkRequest:
      type: object
      properties:
        returnTo:
          type: string
          maxLength: 2000
          description: Local path to return to after the provider (default /settings)
    OidcRedirect:
      type: object
      required: [url]
      properties:
        url:
          type: string
          format: uri
    AccessToken:
      type: object
      required: [id, name, hint, scopes, expiresAt, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        hint:
          type: string
          description: First characters of the token (erp_ and four more)
        scopes:
          type: array
          items:
            type: string
        expiresAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
    AccessTokenCreate:
      type: object
      required: [name, scopes, expiresAt]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        scopes:
          type: array
          minItems: 1
          maxItems: 8
          items:
            type: string
            enum: [user:read, user:write, repo:read, repo:write, packages:read, packages:write, actions:write, admin]
        expiresAt:
          type: string
          format: date-time
          description: Required; at most the configured maximum lifetime from now
    CreatedAccessToken:
      type: object
      required: [token, secret]
      properties:
        token:
          $ref: "#/components/schemas/AccessToken"
        secret:
          type: string
          description: The token (erp_...), shown only once; send it as "Authorization Bearer"
    SshKey:
      type: object
      required: [id, title, type, fingerprint, publicKey, createdAt]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        type:
          type: string
          example: ssh-ed25519
        fingerprint:
          type: string
          example: SHA256:nThbg6kXUpJWGl7E1IGOCspRomTxdCARLviKw6E5SY8
        publicKey:
          type: string
        bits:
          type: integer
        lastUsedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
    SshKeyCreate:
      type: object
      required: [title, key]
      properties:
        title:
          type: string
          maxLength: 100
          description: Empty uses the key comment, or the key type
        key:
          type: string
          maxLength: 16384
    GpgKey:
      type: object
      required: [id, keyId, fingerprint, subkeyIds, emails, verifiedEmails, createdAt]
      properties:
        id:
          type: string
          format: uuid
        keyId:
          type: string
          example: 3AA5C34371567BD2
        fingerprint:
          type: string
        subkeyIds:
          type: array
          items:
            type: string
        emails:
          type: array
          items:
            type: string
        verifiedEmails:
          type: array
          description: The emails that are verified addresses of the account
          items:
            type: string
        expiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
    GpgKeyCreate:
      type: object
      required: [armoredKey]
      properties:
        armoredKey:
          type: string
          maxLength: 65536
    RegisterRequest:
      type: object
      required: [username, email, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 39
          description: Letters, digits and single inner hyphens; shared namespace with organizations
        email:
          type: string
          minLength: 3
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 1024
        inviteToken:
          type: string
          maxLength: 128
          description: Required when registration is "invite"
        locale:
          type: string
          enum: [en, it]
    RegisterAccepted:
      type: object
      required: [verificationRequired]
      properties:
        verificationRequired:
          type: boolean
          description: True when the address must be confirmed by mail before signing in
    LoginRequest:
      type: object
      required: [login, password]
      properties:
        login:
          type: string
          minLength: 1
          maxLength: 254
          description: Username or email address
        password:
          type: string
          minLength: 1
          maxLength: 1024
    TokenRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 128
    EmailRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          minLength: 3
          maxLength: 254
    ResetPasswordRequest:
      type: object
      required: [token, password]
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 128
        password:
          type: string
          minLength: 1
          maxLength: 1024
    InviteRequest:
      type: object
      properties:
        email:
          type: string
          maxLength: 254
          description: When set, only this address can use the invitation
    Invite:
      type: object
      required: [id, token, expiresAt]
      properties:
        id:
          type: string
          format: uuid
        token:
          type: string
          description: Shown only once
        email:
          type: string
        expiresAt:
          type: string
          format: date-time
    User:
      type: object
      required: [id, username, displayName, role, locale, emailVerified, createdAt]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        displayName:
          type: string
        role:
          type: string
          enum: [admin, user, restricted]
        locale:
          type: string
          enum: [en, it]
        email:
          type: string
          description: Primary email address
        emailVerified:
          type: boolean
        createdAt:
          type: string
          format: date-time
    StorageStatus:
      type: object
      required: [targets, policies, caches, warnings]
      properties:
        targets:
          type: array
          items:
            $ref: "#/components/schemas/StorageTarget"
        policies:
          type: array
          items:
            $ref: "#/components/schemas/StoragePolicy"
        caches:
          type: array
          items:
            $ref: "#/components/schemas/StorageCache"
        warnings:
          type: array
          description: Permanent configuration warnings, such as storage_local_only
          items:
            $ref: "#/components/schemas/StorageWarning"
    StorageTarget:
      type: object
      required: [name, kind, encrypted, roles, caps]
      properties:
        name:
          type: string
        kind:
          type: string
          enum: [local, s3, sftp, webdav]
        encrypted:
          type: boolean
        roles:
          type: array
          description: Uses of this target, as primary:<policy>, replica:<policy> or cache:<policy>
          items:
            type: string
        caps:
          $ref: "#/components/schemas/StorageCaps"
    StorageCaps:
      type: object
      required: [range, presign, multipart, atomicRename, conditionalPut, maxConns]
      properties:
        range:
          type: boolean
        presign:
          type: boolean
        multipart:
          type: boolean
        atomicRename:
          type: boolean
        conditionalPut:
          type: boolean
        maxConns:
          type: integer
          description: Connection limit, 0 means unlimited
    StoragePolicy:
      type: object
      required: [name, primary, replicas, cacheTtlSeconds, cacheShare, durability, objects, bytes, pendingReplicas, errors]
      properties:
        name:
          type: string
          description: Data type, such as git, lfs or registry
        primary:
          type: string
        replicas:
          type: array
          items:
            type: string
        cache:
          type: string
        cacheTtlSeconds:
          type: integer
          format: int64
        cacheShare:
          type: number
          format: double
        durability:
          type: string
        objects:
          type: integer
          format: int64
        bytes:
          type: integer
          format: int64
        pendingReplicas:
          type: integer
          format: int64
        errors:
          type: integer
          format: int64
          description: Objects whose last replication or verification failed
    StorageCache:
      type: object
      required: [target, budget, used, entries, highWatermark, lowWatermark, usedBy]
      properties:
        target:
          type: string
        budget:
          type: integer
          format: int64
          description: Budget in bytes, 0 means unlimited
        used:
          type: integer
          format: int64
        entries:
          type: integer
        highWatermark:
          type: number
          format: double
        lowWatermark:
          type: number
          format: double
        usedBy:
          type: object
          description: Bytes used per data type
          additionalProperties:
            type: integer
            format: int64
    StorageWarning:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum: [storage_not_configured, storage_local_only, storage_policy_local]
        policy:
          type: string
        message:
          type: string
    StorageCheckResult:
      type: object
      required: [target, ok, durationMs, steps]
      properties:
        target:
          type: string
        ok:
          type: boolean
        durationMs:
          type: integer
          format: int64
        steps:
          type: array
          items:
            $ref: "#/components/schemas/StorageCheckStep"
    StorageCheckStep:
      type: object
      required: [name, ok, durationMs]
      properties:
        name:
          type: string
          enum: [put, stat, get, range, list, delete]
        ok:
          type: boolean
        durationMs:
          type: integer
          format: int64
        error:
          type: string
    Meta:
      type: object
      required: [name, version, instanceId, publicUrl, registration]
      properties:
        name:
          type: string
          example: ErvisioRepo
        version:
          type: string
          example: 0.1.0
        commit:
          type: string
          description: VCS revision the binary was built from, if known
        instanceId:
          type: string
          format: uuid
          description: Stable UUID v7 generated on first start and stored in the settings table
        publicUrl:
          type: string
          format: uri
        registration:
          type: string
          enum: [open, invite, closed]
    MfaChallenge:
      type: object
      required: [methods, enrollmentRequired, expiresAt]
      description: |
        A login waiting for its second factor. The pending state lives in
        the HttpOnly erepo_mfa cookie (__Host-erepo_mfa on https), never in
        a session cookie.
      properties:
        methods:
          type: array
          items:
            type: string
            enum: [totp, webauthn, recovery]
        enrollmentRequired:
          type: boolean
          description: Policy requires a second factor and the account has none; set up an authenticator app to continue
        expiresAt:
          type: string
          format: date-time
    CodeRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 64
    ReauthRequest:
      type: object
      description: Either the password or a current authenticator app or recovery code
      properties:
        password:
          type: string
          maxLength: 1024
        code:
          type: string
          maxLength: 64
    TotpSetup:
      type: object
      required: [secret, uri]
      properties:
        secret:
          type: string
          description: Base32 secret for manual entry
        uri:
          type: string
          description: otpauth:// URI for a QR code
    RecoveryCodes:
      type: object
      required: [codes]
      properties:
        codes:
          type: array
          description: Shown only once; empty when existing codes were kept
          items:
            type: string
    MfaEnrollResult:
      type: object
      required: [user, recoveryCodes]
      properties:
        user:
          $ref: "#/components/schemas/User"
        recoveryCodes:
          type: array
          items:
            type: string
    WebAuthnOptions:
      type: object
      required: [options]
      properties:
        options:
          type: object
          additionalProperties: true
          description: PublicKeyCredentialRequestOptions wrapper ({publicKey}), binary fields in base64url
    WebAuthnCredentialRequest:
      type: object
      required: [credential]
      properties:
        credential:
          type: object
          additionalProperties: true
          description: PublicKeyCredential JSON (toJSON), binary fields in base64url
    PasskeyChallenge:
      type: object
      required: [challenge, options]
      properties:
        challenge:
          type: string
          description: Ceremony token to send back with the response
        options:
          type: object
          additionalProperties: true
    PasskeyLoginRequest:
      type: object
      required: [challenge, credential]
      properties:
        challenge:
          type: string
          minLength: 1
          maxLength: 128
        credential:
          type: object
          additionalProperties: true
    PasskeyRegisterRequest:
      type: object
      required: [challenge, name, credential]
      properties:
        challenge:
          type: string
          minLength: 1
          maxLength: 128
        name:
          type: string
          minLength: 1
          maxLength: 64
        credential:
          type: object
          additionalProperties: true
    Passkey:
      type: object
      required: [id, name, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
    SecurityStatus:
      type: object
      required: [totp, totpPending, passkeys, recoveryCodesLeft, recoveryCodesTotal, required, webauthnAvailable]
      properties:
        totp:
          type: boolean
          description: An authenticator app is enabled
        totpPending:
          type: boolean
          description: An authenticator app setup waits for its first code
        passkeys:
          type: array
          items:
            $ref: "#/components/schemas/Passkey"
        recoveryCodesLeft:
          type: integer
        recoveryCodesTotal:
          type: integer
        required:
          type: boolean
          description: Policy (instance or organization) requires a second factor
        webauthnAvailable:
          type: boolean
    OrgRole:
      type: string
      enum: [owner, admin, member, billing]
    Permission:
      type: string
      enum: [none, read, triage, write, maintain, admin]
    Org:
      type: object
      required: [id, name, displayName, description, basePermission, require2fa, verified, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        displayName:
          type: string
        description:
          type: string
        basePermission:
          $ref: "#/components/schemas/Permission"
        require2fa:
          type: boolean
          description: Members must have a second factor; enforced from their next sign-in.
        verified:
          type: boolean
        role:
          $ref: "#/components/schemas/OrgRole"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    OrgCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 39
        displayName:
          type: string
          maxLength: 100
        description:
          type: string
          maxLength: 1000
    OrgUpdate:
      type: object
      properties:
        displayName:
          type: string
          maxLength: 100
        description:
          type: string
          maxLength: 1000
        basePermission:
          $ref: "#/components/schemas/Permission"
        require2fa:
          type: boolean
          description: Owners only. Requires a second factor from every member.
    OrgMember:
      type: object
      required: [username, displayName, role, since]
      properties:
        username:
          type: string
        displayName:
          type: string
        role:
          $ref: "#/components/schemas/OrgRole"
        since:
          type: string
          format: date-time
    OrgRoleRequest:
      type: object
      required: [role]
      properties:
        role:
          $ref: "#/components/schemas/OrgRole"
    Team:
      type: object
      required: [id, name, description, members, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        members:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    TeamCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 39
        description:
          type: string
          maxLength: 1000
    TeamUpdate:
      type: object
      properties:
        name:
          type: string
          maxLength: 39
        description:
          type: string
          maxLength: 1000
    TeamMember:
      type: object
      required: [username, displayName, role, since]
      properties:
        username:
          type: string
        displayName:
          type: string
        role:
          type: string
          enum: [maintainer, member]
        since:
          type: string
          format: date-time
    TeamRoleRequest:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [maintainer, member]
    OrgInviteRequest:
      type: object
      required: [email, role]
      properties:
        email:
          type: string
          maxLength: 254
        role:
          $ref: "#/components/schemas/OrgRole"
        teams:
          type: array
          maxItems: 20
          items:
            type: string
            maxLength: 39
    OrgInvite:
      type: object
      required: [id, email, role, teams, expiresAt, createdAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        role:
          $ref: "#/components/schemas/OrgRole"
        teams:
          type: array
          items:
            type: string
        invitedBy:
          type: string
        expiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        token:
          type: string
          description: Only at creation and only when mail is disabled; shown once
    OrgInviteAccepted:
      type: object
      required: [org, role]
      properties:
        org:
          type: string
        role:
          $ref: "#/components/schemas/OrgRole"
    Quota:
      type: object
      required: [maxRepos, maxStorageBytes, repos, storageBytes]
      properties:
        maxRepos:
          type: integer
          format: int32
          description: -1 means unlimited
        maxStorageBytes:
          type: integer
          format: int64
          description: -1 means unlimited
        repos:
          type: integer
          format: int32
        storageBytes:
          type: integer
          format: int64
    AuditEntry:
      type: object
      required: [id, at, action, targetType, targetId, ip, data]
      properties:
        id:
          type: string
          format: uuid
        at:
          type: string
          format: date-time
        actorId:
          type: string
          format: uuid
        actor:
          type: string
          description: Username of the actor; absent when anonymous or deleted
        action:
          type: string
        targetType:
          type: string
        targetId:
          type: string
        ip:
          type: string
        orgId:
          type: string
          format: uuid
        data:
          type: object
          additionalProperties: true
    AuditPage:
      type: object
      required: [entries]
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/AuditEntry"
        next:
          type: string
          format: uuid
          description: Cursor of the next page (pass as before); absent on the last page
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          example: about:blank
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
