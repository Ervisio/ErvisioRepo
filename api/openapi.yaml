openapi: 3.1.0
info:
  title: ErvisioRepo API
  version: 0.1.0
  description: REST API v1 of ErvisioRepo. The SPA, the CLI and the plugin use only this contract.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: /api/v1
tags:
  - name: meta
  - name: auth
  - name: users
  - name: admin
  - name: orgs
# Every operation needs a session unless it declares `security: []`. The
# "admin" scope means an instance admin. Unsafe methods also need the
# X-CSRF-Token header (see components.securitySchemes.session).
security:
  - session: []
paths:
  /meta:
    get:
      operationId: getMeta
      tags: [meta]
      summary: Public information about this instance
      security: []
      responses:
        "200":
          description: Instance metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Meta"
        default:
          $ref: "#/components/responses/Problem"
  /admin/storage:
    get:
      operationId: getAdminStorage
      tags: [admin]
      summary: Storage targets, policies, cache usage and permanent warnings
      description: Instance admins only.
      security:
        - session: [admin]
      responses:
        "200":
          description: Storage status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageStatus"
        default:
          $ref: "#/components/responses/Problem"
  /admin/storage/{target}/test:
    post:
      operationId: testAdminStorageTarget
      tags: [admin]
      summary: Run a write/read/list/delete round trip on a storage target
      description: Instance admins only. Writes a random probe object under erepo-storage-test/ and always deletes it.
      security:
        - session: [admin]
      parameters:
        - name: target
          in: path
          required: true
          schema:
            type: string
            pattern: "^[a-z0-9][a-z0-9_-]{0,62}$"
      responses:
        "200":
          description: Test outcome; ok is false when a step failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageCheckResult"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /admin/invites:
    post:
      operationId: createInvite
      tags: [admin]
      summary: Create an instance invitation
      description: Instance admins only. The token is returned once and only its hash is stored.
      security:
        - session: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteRequest"
      responses:
        "201":
          description: Invitation created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invite"
        "400":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Create an account
      description: |
        The answer does not reveal whether the email address is already
        registered: in that case nothing is created and the owner of the
        address receives a notice by mail. The first account of the instance
        becomes an instance admin and is accepted whatever the registration
        policy.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "202":
          description: Registration accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterAccepted"
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/Problem"
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Sign in with a password
      description: |
        Sets a new session cookie (the previous session of this browser is
        revoked) and a new CSRF cookie. Every credential failure answers the
        same 401. Repeated failures are slowed down per account and per IP.
        When the account has a second factor, or policy requires one, the
        answer is 202 with the pending step: no session yet, only the
        short-lived HttpOnly erepo_mfa cookie, to complete under /auth/mfa.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "202":
          description: Password accepted, second factor needed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MfaChallenge"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/Problem"
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Sign out and revoke the current session
      security: []
      responses:
        "204":
          description: Signed out
        default:
          $ref: "#/components/responses/Problem"
  /auth/email/verify:
    post:
      operationId: verifyEmail
      tags: [auth]
      summary: Confirm an email address with the token sent by mail
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenRequest"
      responses:
        "204":
          description: Address verified
        "400":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /auth/email/resend:
    post:
      operationId: resendVerification
      tags: [auth]
      summary: Send the verification mail again
      description: Always accepted, whether or not the address is registered.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailRequest"
      responses:
        "202":
          description: Accepted
        "400":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/Problem"
  /auth/password/reset:
    post:
      operationId: requestPasswordReset
      tags: [auth]
      summary: Send a password reset link
      description: Always accepted, whether or not the address is registered.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailRequest"
      responses:
        "202":
          description: Accepted
        "400":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/Problem"
  /auth/password/reset/confirm:
    post:
      operationId: resetPassword
      tags: [auth]
      summary: Set a new password with the token sent by mail
      description: Revokes every session of the account.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "204":
          description: Password changed
        "400":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /user:
    get:
      operationId: getCurrentUser
      tags: [users]
      summary: The signed-in user
      security:
        - session: []
        - token: [user:read]
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /auth/mfa:
    get:
      operationId: getMfaChallenge
      tags: [auth]
      summary: The pending second-factor step of this browser
      description: |
        Reads the pending login held in the erepo_mfa cookie (set by a 202
        from POST /auth/login). 401 when there is none or it expired.
      security: []
      responses:
        "200":
          description: Pending login
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MfaChallenge"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /auth/mfa/totp:
    post:
      operationId: verifyMfaTotp
      tags: [auth]
      summary: Complete a pending login with an authenticator app code
      description: |
        A code is accepted once: a replay in the same time window fails.
        After five wrong codes the pending login is dropped.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CodeRequest"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/Problem"
  /auth/mfa/recovery:
    post:
      operationId: verifyMfaRecovery
      tags: [auth]
      summary: Complete a pending login with a recovery code
      description: Each recovery code works once.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CodeRequest"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/Problem"
  /auth/mfa/webauthn/options:
    post:
      operationId: beginMfaWebAuthn
      tags: [auth]
      summary: Options to complete a pending login with a security key
      security: []
      responses:
        "200":
          description: Options for navigator.credentials.get
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebAuthnOptions"
        "401":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /auth/mfa/webauthn:
    post:
      operationId: verifyMfaWebAuthn
      tags: [auth]
      summary: Complete a pending login with a security key
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebAuthnCredentialRequest"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /auth/mfa/enroll/totp:
    post:
      operationId: beginMfaEnrollTotp
      tags: [auth]
      summary: Set up an authenticator app during a login that requires one
      description: |
        Only for a pending login with enrollmentRequired: the account must
        have a second factor and has none yet.
      security: []
      responses:
        "200":
          description: New secret, to confirm with a code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TotpSetup"
        "401":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /auth/mfa/enroll/totp/confirm:
    post:
      operationId: confirmMfaEnrollTotp
      tags: [auth]
      summary: Confirm the authenticator app and complete the login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CodeRequest"
      responses:
        "200":
          description: Signed in; the recovery codes are shown only once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MfaEnrollResult"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/Problem"
  /auth/mfa/passkey/options:
    post:
      operationId: beginPasskeyLogin
      tags: [auth]
      summary: Options for a passwordless sign-in with a passkey
      security: []
      responses:
        "200":
          description: Ceremony token and options for navigator.credentials.get
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasskeyChallenge"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /auth/mfa/passkey:
    post:
      operationId: passkeyLogin
      tags: [auth]
      summary: Sign in with a passkey
      description: |
        The passkey must verify the user (PIN or biometrics), so it stands
        for both factors. Sets the session and CSRF cookies like a login.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasskeyLoginRequest"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /user/security:
    get:
      operationId: getSecurity
      tags: [users]
      summary: Second factors of the signed-in user
      responses:
        "200":
          description: Second-factor setup
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecurityStatus"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /user/security/totp:
    post:
      operationId: setupTotp
      tags: [users]
      summary: Start setting up an authenticator app
      description: Needs the password or a current code. Confirm with POST /user/security/totp/confirm.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReauthRequest"
      responses:
        "200":
          description: New secret, to confirm with a code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TotpSetup"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: disableTotp
      tags: [users]
      summary: Remove the authenticator app
      description: |
        Needs the password or a current code. Refused (409) when it is the
        last factor and policy requires two-factor authentication.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReauthRequest"
      responses:
        "204":
          description: Removed
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/Problem"
  /user/security/totp/confirm:
    post:
      operationId: confirmTotp
      tags: [users]
      summary: Enable the authenticator app with a first code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CodeRequest"
      responses:
        "200":
          description: Enabled; new recovery codes when the account had none (shown only once)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryCodes"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/Problem"
  /user/security/recovery-codes:
    post:
      operationId: regenerateRecoveryCodes
      tags: [users]
      summary: Replace the recovery codes
      description: The old codes stop working. Needs the password or a current code.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReauthRequest"
      responses:
        "200":
          description: New recovery codes, shown only once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryCodes"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/Problem"
  /user/security/passkeys/options:
    post:
      operationId: beginPasskeyRegistration
      tags: [users]
      summary: Options to register a passkey
      description: Needs the password or a current code.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReauthRequest"
      responses:
        "200":
          description: Ceremony token and options for navigator.credentials.create
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasskeyChallenge"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /user/security/passkeys:
    post:
      operationId: registerPasskey
      tags: [users]
      summary: Register a passkey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasskeyRegisterRequest"
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Passkey"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /user/security/passkeys/{id}:
    delete:
      operationId: deletePasskey
      tags: [users]
      summary: Remove a passkey
      description: |
        Needs the password or a current code. Refused (409) when it is the
        last factor and policy requires two-factor authentication.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReauthRequest"
      responses:
        "204":
          description: Removed
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/Problem"
  /auth/oidc/providers:
    get:
      operationId: listOidcProviders
      tags: [auth]
      summary: External identity providers configured on this instance
      description: |
        Sign in with a provider by navigating the browser to
        /auth/oidc/{name}/login?return_to=/path (outside /api/v1); the
        provider redirects back to /auth/oidc/{name}/callback.
      security: []
      responses:
        "200":
          description: Providers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OidcProvider"
        default:
          $ref: "#/components/responses/Problem"
  /user/oidc:
    get:
      operationId: listOidcLinks
      tags: [users]
      summary: External identities linked to the account
      responses:
        "200":
          description: Linked identities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OidcLink"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /user/oidc/{provider}/link:
    post:
      operationId: beginOidcLink
      tags: [users]
      summary: Start linking an external identity
      description: |
        Returns the provider URL to navigate to and sets the state cookie.
        The callback links the identity only for the same signed-in session.
        An identity is never linked because its email matches the account.
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            maxLength: 64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OidcLinkRequest"
      responses:
        "200":
          description: Redirect target
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OidcRedirect"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "502":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /user/oidc/{id}:
    delete:
      operationId: unlinkOidc
      tags: [users]
      summary: Unlink an external identity
      description: Refused (409) when it is the last way to sign in.
      parameters:
        - $ref: "#/components/parameters/CredentialID"
      responses:
        "204":
          description: Unlinked
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /user/tokens:
    get:
      operationId: listAccessTokens
      tags: [users]
      summary: Personal access tokens of the account
      responses:
        "200":
          description: Tokens (without secrets)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AccessToken"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createAccessToken
      tags: [users]
      summary: Create a personal access token
      description: |
        The secret is returned only once. Only a session can manage tokens;
        the admin scope needs an instance admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccessTokenCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedAccessToken"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
