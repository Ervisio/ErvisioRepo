      operationId: getBlob
      tags: [code]
      summary: A file of a ref
      description: Text files within the size limit carry their content; others only the metadata.
      security:
        - session: [anonymous]
        - token: [repo:read]
      parameters:
        - $ref: "#/components/parameters/CodeRef"
        - $ref: "#/components/parameters/CodeFilePath"
      responses:
        "200":
          description: File
