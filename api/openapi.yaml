  /user/oauth/authorize:
    get:
      operationId: getOAuthConsent
      tags: [oauth]
      summary: Check an OAuth web flow request and describe it for the consent page
      description: |
        Session only. The SPA route /login/oauth/authorize passes the query of
        GitHub's authorize URL. 404 for an unknown client_id, 400 for a
        redirect_uri that does not match a registered callback URL (the
        consent page then never redirects).
      parameters:
        - {name: client_id, in: query, required: true, schema: {type: string, maxLength: 100}}
        - {name: redirect_uri, in: query, schema: {type: string, maxLength: 2000}}
        - {name: scope, in: query, schema: {type: string, maxLength: 1000}}
        - {name: code_challenge, in: query, schema: {type: string, maxLength: 200}}
        - {name: code_challenge_method, in: query, schema: {type: string, maxLength: 20}}
      responses:
        "200":
          description: The request
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OAuthConsent"}
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: decideOAuthConsent
      tags: [oauth]
      summary: Authorize or deny an OAuth web flow request
      description: |
        Session only. Returns the URL to send the browser to: the app's
        redirect_uri with code and state, or with error=access_denied.
        The code is single use and expires after 10 minutes.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/OAuthConsentDecision"}
      responses:
        "200":
          description: Where to go next
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OAuthRedirect"}
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
