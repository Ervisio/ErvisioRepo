      responses:
        "200":
          description: Unexpired proposals ordered newest first
          content:
            application/json:
              schema:
                type: object
                required: [proposals]
                properties:
                  proposals:
                    type: array
                    items: {$ref: "#/components/schemas/ErvisioCodeProposal"}
                  nextBeforeId: {type: string, format: uuid}
        "403":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createErvisioCodeProposal
      tags: [users]
      summary: Submit a proposal without executing it
      description: Proposal submission is paused. This operation currently returns 403.
      security:
        - session: []
        - hubSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ErvisioCodeProposalCreate"}
      responses:
        "201":
          description: Pending proposal saved for review
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErvisioCodeProposal"}
        "403":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /user/ervisiocode/shares/{shareId}/proposals/{proposalId}/review:
    parameters:
      - $ref: "#/components/parameters/ErvisioCodeShareAccountId"
      - $ref: "#/components/parameters/ErvisioCodeShareId"
      - name: proposalId
        in: path
        required: true
        schema: {type: string, format: uuid}
    post:
      operationId: reviewErvisioCodeProposal
      tags: [users]
      summary: Record the session owner's decision on a pending proposal
      description: Proposal review is paused. This operation currently returns 403.
      security:
        - session: []
        - hubSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ErvisioCodeProposalReview"}
      responses:
        "200":
          description: Reviewed proposal
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErvisioCodeProposal"}
        "403":
          $ref: "#/components/responses/Problem"
        default:
