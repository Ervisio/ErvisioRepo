openapi: 3.1.0
info:
  title: ErvisioRepo API
  version: 0.1.0
  description: REST API v1 of ErvisioRepo. The SPA, the CLI and the plugin use only this contract.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: /api/v1
tags:
  - name: meta
  - name: auth
  - name: users
  - name: admin
# Every operation needs a session unless it declares `security: []`. The
# "admin" scope means an instance admin. Unsafe methods also need the
# X-CSRF-Token header (see components.securitySchemes.session).
security:
  - session: []
paths:
  /meta:
    get:
      operationId: getMeta
      tags: [meta]
      summary: Public information about this instance
      security: []
      responses:
        "200":
          description: Instance metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Meta"
        default:
          $ref: "#/components/responses/Problem"
  /admin/storage:
    get:
      operationId: getAdminStorage
      tags: [admin]
      summary: Storage targets, policies, cache usage and permanent warnings
      description: Instance admins only.
      security:
        - session: [admin]
      responses:
        "200":
          description: Storage status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageStatus"
        default:
          $ref: "#/components/responses/Problem"
  /admin/storage/{target}/test:
    post:
      operationId: testAdminStorageTarget
      tags: [admin]
      summary: Run a write/read/list/delete round trip on a storage target
      description: Instance admins only. Writes a random probe object under erepo-storage-test/ and always deletes it.
      security:
        - session: [admin]
      parameters:
        - name: target
          in: path
          required: true
          schema:
            type: string
            pattern: "^[a-z0-9][a-z0-9_-]{0,62}$"
      responses:
        "200":
          description: Test outcome; ok is false when a step failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageCheckResult"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /admin/invites:
    post:
      operationId: createInvite
      tags: [admin]
      summary: Create an instance invitation
      description: Instance admins only. The token is returned once and only its hash is stored.
      security:
        - session: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteRequest"
      responses:
        "201":
          description: Invitation created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invite"
        "400":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Create an account
      description: |
        The answer does not reveal whether the email address is already
        registered: in that case nothing is created and the owner of the
        address receives a notice by mail. The first account of the instance
        becomes an instance admin and is accepted whatever the registration
        policy.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "202":
          description: Registration accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterAccepted"
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/Problem"
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Sign in with a password
      description: |
        Sets a new session cookie (the previous session of this browser is
        revoked) and a new CSRF cookie. Every credential failure answers the
        same 401. Repeated failures are slowed down per account and per IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/Problem"
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Sign out and revoke the current session
      security: []
      responses:
        "204":
          description: Signed out
        default:
          $ref: "#/components/responses/Problem"
  /auth/email/verify:
    post:
      operationId: verifyEmail
      tags: [auth]
      summary: Confirm an email address with the token sent by mail
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenRequest"
      responses:
        "204":
          description: Address verified
        "400":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /auth/email/resend:
    post:
      operationId: resendVerification
      tags: [auth]
      summary: Send the verification mail again
      description: Always accepted, whether or not the address is registered.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailRequest"
      responses:
        "202":
          description: Accepted
        "400":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/Problem"
  /auth/password/reset:
    post:
      operationId: requestPasswordReset
      tags: [auth]
      summary: Send a password reset link
      description: Always accepted, whether or not the address is registered.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailRequest"
      responses:
        "202":
          description: Accepted
        "400":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/Problem"
  /auth/password/reset/confirm:
    post:
      operationId: resetPassword
      tags: [auth]
      summary: Set a new password with the token sent by mail
      description: Revokes every session of the account.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "204":
          description: Password changed
        "400":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /user:
    get:
      operationId: getCurrentUser
      tags: [users]
      summary: The signed-in user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: __Host-erepo_session
      description: |
        Opaque session cookie set by POST /auth/login. When the public URL is
        plain http on a non-loopback host the cookie is named erepo_session.
        Requests with an unsafe method must send the X-CSRF-Token header with
        the value of the erepo_csrf cookie (__Host-erepo_csrf on https).
  responses:
    Problem:
      description: Error in RFC 9457 format
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    TooManyRequests:
      description: Too many attempts; retry after the given number of seconds
      headers:
        Retry-After:
          required: true
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    RegisterRequest:
      type: object
      required: [username, email, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 39
          description: Letters, digits and single inner hyphens; shared namespace with organizations
        email:
          type: string
          minLength: 3
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 1024
        inviteToken:
          type: string
          maxLength: 128
          description: Required when registration is "invite"
        locale:
          type: string
          enum: [en, it]
    RegisterAccepted:
      type: object
      required: [verificationRequired]
      properties:
        verificationRequired:
          type: boolean
          description: True when the address must be confirmed by mail before signing in
    LoginRequest:
      type: object
      required: [login, password]
      properties:
        login:
          type: string
          minLength: 1
          maxLength: 254
          description: Username or email address
        password:
          type: string
          minLength: 1
          maxLength: 1024
    TokenRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 128
    EmailRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          minLength: 3
          maxLength: 254
    ResetPasswordRequest:
      type: object
      required: [token, password]
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 128
        password:
          type: string
          minLength: 1
          maxLength: 1024
    InviteRequest:
      type: object
      properties:
        email:
          type: string
          maxLength: 254
          description: When set, only this address can use the invitation
    Invite:
      type: object
      required: [id, token, expiresAt]
      properties:
        id:
          type: string
          format: uuid
        token:
          type: string
          description: Shown only once
        email:
          type: string
        expiresAt:
          type: string
          format: date-time
    User:
      type: object
      required: [id, username, displayName, role, locale, emailVerified, createdAt]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        displayName:
          type: string
        role:
          type: string
          enum: [admin, user, restricted]
        locale:
          type: string
          enum: [en, it]
        email:
          type: string
          description: Primary email address
        emailVerified:
          type: boolean
        createdAt:
          type: string
          format: date-time
    StorageStatus:
      type: object
      required: [targets, policies, caches, warnings]
      properties:
        targets:
          type: array
          items:
            $ref: "#/components/schemas/StorageTarget"
        policies:
          type: array
          items:
            $ref: "#/components/schemas/StoragePolicy"
        caches:
          type: array
          items:
            $ref: "#/components/schemas/StorageCache"
        warnings:
          type: array
          description: Permanent configuration warnings, such as storage_local_only
          items:
            $ref: "#/components/schemas/StorageWarning"
    StorageTarget:
      type: object
      required: [name, kind, encrypted, roles, caps]
      properties:
        name:
          type: string
        kind:
          type: string
          enum: [local, s3, sftp, webdav]
        encrypted:
          type: boolean
        roles:
          type: array
          description: Uses of this target, as primary:<policy>, replica:<policy> or cache:<policy>
          items:
            type: string
        caps:
          $ref: "#/components/schemas/StorageCaps"
    StorageCaps:
      type: object
      required: [range, presign, multipart, atomicRename, conditionalPut, maxConns]
      properties:
        range:
          type: boolean
        presign:
          type: boolean
        multipart:
          type: boolean
        atomicRename:
          type: boolean
        conditionalPut:
          type: boolean
        maxConns:
          type: integer
          description: Connection limit, 0 means unlimited
    StoragePolicy:
      type: object
      required: [name, primary, replicas, cacheTtlSeconds, cacheShare, durability, objects, bytes, pendingReplicas, errors]
      properties:
        name:
          type: string
          description: Data type, such as git, lfs or registry
        primary:
          type: string
        replicas:
          type: array
          items:
            type: string
        cache:
          type: string
        cacheTtlSeconds:
          type: integer
          format: int64
        cacheShare:
          type: number
          format: double
        durability:
          type: string
        objects:
          type: integer
          format: int64
        bytes:
          type: integer
          format: int64
        pendingReplicas:
          type: integer
          format: int64
        errors:
          type: integer
          format: int64
          description: Objects whose last replication or verification failed
    StorageCache:
      type: object
      required: [target, budget, used, entries, highWatermark, lowWatermark, usedBy]
      properties:
        target:
          type: string
        budget:
          type: integer
          format: int64
          description: Budget in bytes, 0 means unlimited
        used:
          type: integer
          format: int64
        entries:
          type: integer
        highWatermark:
          type: number
          format: double
        lowWatermark:
          type: number
          format: double
        usedBy:
          type: object
          description: Bytes used per data type
          additionalProperties:
            type: integer
            format: int64
    StorageWarning:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum: [storage_not_configured, storage_local_only, storage_policy_local]
        policy:
          type: string
        message:
          type: string
    StorageCheckResult:
      type: object
      required: [target, ok, durationMs, steps]
      properties:
        target:
          type: string
        ok:
          type: boolean
        durationMs:
          type: integer
          format: int64
        steps:
          type: array
          items:
            $ref: "#/components/schemas/StorageCheckStep"
    StorageCheckStep:
      type: object
      required: [name, ok, durationMs]
      properties:
        name:
          type: string
          enum: [put, stat, get, range, list, delete]
        ok:
          type: boolean
        durationMs:
          type: integer
          format: int64
        error:
          type: string
    Meta:
      type: object
      required: [name, version, instanceId, publicUrl, registration]
      properties:
        name:
          type: string
          example: ErvisioRepo
        version:
          type: string
          example: 0.1.0
        commit:
          type: string
          description: VCS revision the binary was built from, if known
        instanceId:
          type: string
          format: uuid
          description: Stable UUID v7 generated on first start and stored in the settings table
        publicUrl:
          type: string
          format: uri
        registration:
          type: string
          enum: [open, invite, closed]
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          example: about:blank
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
