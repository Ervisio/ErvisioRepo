          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /notifications/subject:
    get:
      operationId: getNotificationSubject
      tags: [notifications]
      summary: Thread and subscription of the caller for an issue, pull request or release
      description: |
        Looks up the caller's thread for a subject (absent when the caller
        never received it) and whether the caller is subscribed to it. Without
        an explicit choice the caller is subscribed when it has a thread,
        takes part in the conversation or watches the repository.
      security:
        - session: []
        - token: [user:read]
      parameters:
        - $ref: "#/components/parameters/SubjectRepo"
