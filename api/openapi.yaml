        A paused runner finishes the jobs it is running but takes no new
        ones until it is resumed. Recorded in the audit log.
      security:
        - session: []
        - token: [actions:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActionsRunnerPause"
      responses:
        "200":
          description: The runner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionsRunner"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Unavailable"
        default:
          $ref: "#/components/responses/Problem"
  /orgs/{org}/actions/runners/registration-token:
    parameters:
      - $ref: "#/components/parameters/OrgName"
    post:
      operationId: createOrgActionsRegistrationToken
      tags: [actions]
      summary: Create a runner registration token
      security:
        - session: []
        - token: [actions:write]
      responses:
        "201":
          description: Token (shown only once)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionsRegistrationToken"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Unavailable"
        default:
          $ref: "#/components/responses/Problem"
  /admin/actions/runners:
    get:
      operationId: listInstanceActionsRunners
      tags: [actions]
      summary: Self-hosted runners
      description: |
        Instance runners. Instance admins only.
      security:
        - session: [admin]
        - token: [admin]
      responses:
        "200":
          description: Runners
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/ActionsRunner"}
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Unavailable"
        default:
          $ref: "#/components/responses/Problem"
  /admin/actions/runners/{runnerId}:
    parameters:
      - $ref: "#/components/parameters/ActionsRunnerId"
    delete:
      operationId: deleteInstanceActionsRunner
      tags: [actions]
      summary: Remove a self-hosted runner
      description: |
        Its running jobs fail at the next sweep.
      security:
        - session: [admin]
        - token: [admin]
      responses:
        "204":
          description: Deleted
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Unavailable"
        default:
          $ref: "#/components/responses/Problem"
  /admin/actions/runners/{runnerId}/paused:
    parameters:
      - $ref: "#/components/parameters/ActionsRunnerId"
    put:
      operationId: setInstanceActionsRunnerPaused
      tags: [actions]
      summary: Pause or resume a self-hosted runner
      description: |
        A paused runner finishes the jobs it is running but takes no new
        ones until it is resumed. Recorded in the audit log.
      security:
        - session: [admin]
        - token: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActionsRunnerPause"
      responses:
        "200":
          description: The runner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionsRunner"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Unavailable"
        default:
          $ref: "#/components/responses/Problem"
  /admin/actions/runners/{runnerId}/update:
    parameters:
      - $ref: "#/components/parameters/ActionsRunnerId"
    post:
      operationId: updateInstanceActionsRunner
      tags: [actions]
      summary: Update a self-hosted runner to the server version
      description: |
        Asks the runner to update itself to the version of the server: it
        stops taking jobs, lets the running ones finish, downloads and
        verifies the release binary and restarts on it. 409 when the runner
        cannot update itself (built-in runner, container, older runner) or
        already runs the server version. Recorded in the audit log.
      security:
        - session: [admin]
        - token: [admin]
      responses:
        "202":
          description: The runner, with the update pending
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionsRunner"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Unavailable"
        default:
          $ref: "#/components/responses/Problem"
  /admin/actions/runners/{runnerId}/wake:
    parameters:
      - $ref: "#/components/parameters/ActionsRunnerId"
    put:
      operationId: setInstanceActionsRunnerWake
      tags: [actions]
      summary: Configure the on-demand start of a self-hosted runner
      description: |
        Makes the runner on-demand: while it is offline and a queued job
        needs it, the server calls the start URL (POST, with the token in
        the given header) at most once per cooldown. Meant for machines
        switched off while idle, e.g. an EC2 instance started by an AWS
        Lambda function URL. An omitted token keeps the stored one. Needs
        the master key to store a token. Recorded in the audit log.
      security:
        - session: [admin]
        - token: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActionsRunnerWakeSettings"
      responses:
        "200":
          description: The runner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionsRunner"
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Unavailable"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteInstanceActionsRunnerWake
      tags: [actions]
      summary: Remove the on-demand start of a self-hosted runner
      security:
        - session: [admin]
        - token: [admin]
      responses:
        "200":
          description: The runner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionsRunner"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Unavailable"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: wakeInstanceActionsRunner
      tags: [actions]
      summary: Start an on-demand runner now
      description: |
        Calls the start URL at once, without waiting for a queued job. The
        answer carries the outcome in wake.lastStatus and wake.lastError.
        409 when the runner has no start URL.
      security:
        - session: [admin]
        - token: [admin]
      responses:
        "200":
          description: The runner, with the outcome of the call
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionsRunner"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Unavailable"
        default:
          $ref: "#/components/responses/Problem"
  /admin/actions/runners/update:
    post:
      operationId: updateInstanceActionsRunners
      tags: [actions]
      summary: Update every outdated self-hosted runner
      description: |
        Requests the update of every online instance runner that runs an
        older version than the server and can update itself.
      security:
        - session: [admin]
        - token: [admin]
      responses:
        "202":
          description: Number of runners asked to update
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionsRunnerUpdateAll"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Unavailable"
        default:
          $ref: "#/components/responses/Problem"
  /admin/actions/runners/registration-token:
    post:
      operationId: createInstanceActionsRegistrationToken
      tags: [actions]
      summary: Create a runner registration token
      security:
        - session: [admin]
        - token: [admin]
      responses:
        "201":
          description: Token (shown only once)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionsRegistrationToken"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Unavailable"
        default:
          $ref: "#/components/responses/Problem"
  /actions/runner-devices/{userCode}:
    parameters:
      - name: userCode
        in: path
        required: true
        description: The code shown by the runner installer (XXXX-XXXX; case and dash are ignored)
        schema:
          type: string
          maxLength: 32
    get:
      operationId: getActionsRunnerDevice
      tags: [actions]
      summary: Look up a pending runner registration
      description: |
        Session only. Returns the machine facts and requested settings a
        runner installer sent with the RequestDevice call of the runner
        protocol, while the request is pending (15 minutes). Wrong codes are
        rate limited per account and client IP (429 with Retry-After).
      responses:
        "200":
          description: The pending request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionsRunnerDevice"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Unavailable"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: decideActionsRunnerDevice
      tags: [actions]
      summary: Approve or deny a pending runner registration
      description: |
        Session only. Approving registers the runner at the chosen scope:
        instance (admins), org:<name> (owners) or repo:<owner>/<name>
        (repository admins). The installer's next poll receives a
        single-use registration token and the approved name, labels and
        capacity. Recorded in the audit log.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActionsRunnerDeviceDecision"
      responses:
        "204":
          description: Recorded
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Unavailable"
        default:
          $ref: "#/components/responses/Problem"
  # --- end actions ---
components:
  securitySchemes:
    hubSession:
      type: apiKey
      in: cookie
      name: erepo_hub_session
      description: Opaque, short-lived cookie accepted only on explicitly listed ErvisioCode hub operations.
    session:
      type: apiKey
      in: cookie
      name: __Host-erepo_session
      description: |
        Opaque session cookie set by POST /auth/login. When the public URL is
        plain http on a non-loopback host the cookie is named erepo_session.
        Requests with an unsafe method must send the X-CSRF-Token header with
        the value of the erepo_csrf cookie (__Host-erepo_csrf on https).
    token:
      type: http
      scheme: bearer
      description: |
        Personal access token (erp_...) in "Authorization: Bearer". Only the
        operations that list the token scheme accept it, and the token must
        hold every scope listed there. Tokens skip the CSRF check.
  parameters:
    ErvisioCodeShareAccountId:
      name: accountId
      in: query
      description: Required for the scoped hub cookie. When present, only the hub cookie can authenticate this account; there is no fallback to a browser session.
      schema: {type: string, format: uuid}
    ErvisioCodeShareBeforeId:
      name: beforeId
      in: query
      description: Pass the previous page's nextBeforeId to continue.
      schema: {type: string, format: uuid}
    ErvisioCodeShareId:
      name: shareId
      in: path
      required: true
      schema: {type: string, format: uuid}
    # --- actions parameters ---
    ActionsWorkflowParam:
      name: workflow
      in: path
      required: true
      description: Workflow file name (ci.yml) or path (.github/workflows/ci.yml, URL-encoded)
      schema:
        type: string
        maxLength: 255
    ActionsRunId:
      name: runId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ActionsJobId:
      name: jobId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ActionsRunnerId:
      name: runnerId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ActionsSecretName:
      name: secretName
      in: path
      required: true
      description: Letters, digits and underscores (stored upper case)
      schema:
        type: string
        maxLength: 255
    ActionsVariableName:
      name: variableName
      in: path
      required: true
      description: Letters, digits and underscores (stored upper case)
      schema:
        type: string
        maxLength: 255
    ActionsEnvironmentName:
      name: environment
      in: path
      required: true
      schema:
        type: string
        maxLength: 255
    ActionsEnvironmentFilter:
      name: environment
      in: query
      description: An environment of the repository instead of the repository itself
      schema:
        type: string
        maxLength: 255
    ActionsBranch:
      name: branch
      in: query
      description: Branch name or full ref
      schema:
        type: string
        maxLength: 255
    ActionsWorkflowFilter:
      name: workflow
      in: query
      description: Workflow file name or path
      schema:
        type: string
        maxLength: 255
    ActionsEventFilter:
      name: event
      in: query
      schema:
        type: string
        maxLength: 64
    ActionsStatusFilter:
      name: status
      in: query
      description: A status (queued, in_progress, completed, ...) or a conclusion (success, failure, ...)
      schema:
        type: string
        maxLength: 32
    ActionsShaFilter:
      name: sha
      in: query
      schema:
        type: string
        maxLength: 64
    ActionsPage:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    ActionsPerPage:
      name: perPage
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 30
    ActionsAttempt:
      name: attempt
      in: query
      description: Run attempt (default the latest)
      schema:
        type: integer
        minimum: 1
    ActionsLogFrom:
      name: from
      in: query
      description: First log row index
      schema:
        type: integer
        format: int64
        minimum: 0
        default: 0
    ActionsLogLimit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 1000
    # --- end actions parameters ---
    # --- commit statuses and checks parameters ---
    CommitRef:
      name: sha
      in: path
      required: true
      description: Commit id (full or abbreviated), branch or tag
      schema:
        type: string
        maxLength: 255
    CheckRunId:
      name: checkRunId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CheckSuiteId:
      name: checkSuiteId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CheckNameFilter:
      name: checkName
      in: query
      description: Only the runs of this exact name
      schema:
        type: string
        maxLength: 255
    CheckStatusFilter:
      name: status
      in: query
      description: Only the runs in this status
      schema:
        type: string
        enum: [queued, in_progress, completed]
    CheckAppFilter:
      name: app
      in: query
      description: Only the runs or suites of this app
      schema:
        type: string
        maxLength: 255
    CheckLatestFilter:
      name: filter
      in: query
      description: latest keeps the newest run of each name; all lists every run
      schema:
        type: string
        enum: [latest, all]
        default: latest
    # --- end commit statuses and checks parameters ---
    # --- branch protection parameters ---
    ProtectionRuleId:
      name: ruleId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    # --- end branch protection parameters ---
    # --- pulls parameters ---
    PullNumber:
      name: number
      in: path
      required: true
      description: Pull request number
      schema:
        type: integer
        format: int64
    PullReviewId:
      name: reviewId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PullCommentId:
      name: commentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    # --- end pulls parameters ---
    RepoOwner:
      name: owner
      in: path
      required: true
      description: User or organization name
      schema:
        type: string
        maxLength: 39
    RepoName:
      name: name
      in: path
      required: true
      schema:
        type: string
        maxLength: 100
    PageOffset:
      name: offset
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
    PageLimit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 30
    CredentialID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AppSlug:
      name: slug
      in: path
      required: true
      schema:
        type: string
        maxLength: 100
    InstallationID:
      name: installationId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    OAuthClientID:
      name: clientId
      in: path
      required: true
      schema:
        type: string
        maxLength: 100
    OrgName:
      name: org
      in: path
      required: true
      schema:
        type: string
        maxLength: 39
    TeamName:
      name: team
      in: path
      required: true
      schema:
        type: string
        maxLength: 39
    Username:
      name: username
      in: path
      required: true
      schema:
        type: string
        maxLength: 39
    AuditBefore:
      name: before
      in: query
      description: Cursor; the next value of the previous page
      schema:
        type: string
        format: uuid
    AuditLimit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    AuditAction:
      name: action
      in: query
      description: Exact action, or a prefix ending with "." (e.g. org.)
      schema:
        type: string
        maxLength: 100
    CodeRef:
      name: ref
      in: query
      description: Branch, tag or commit id; empty means the default branch
      schema:
        type: string
        maxLength: 255
    CodePath:
      name: path
      in: query
      description: Directory path; empty means the root
      schema:
        type: string
        maxLength: 4096
    CodeFilePath:
      name: path
      in: query
      required: true
      description: File path
      schema:
        type: string
        minLength: 1
        maxLength: 4096
    NotificationRepo:
      name: repo
      in: query
      description: Only the threads of this repository (owner/name)
      schema:
        type: string
        maxLength: 140
    SubjectRepo:
      name: repo
      in: query
      required: true
      description: Repository of the subject (owner/name)
      schema:
        type: string
        minLength: 3
        maxLength: 140
    SubjectNumber:
      name: number
      in: query
      description: Issue or pull request number (exactly one of number and release)
      schema:
        type: integer
        format: int64
        minimum: 1
    SubjectRelease:
      name: release
      in: query
      description: Release id (exactly one of number and release)
      schema:
        type: string
        format: uuid
  headers:
    HasMore:
      description: "\"true\" when there is a page after this one, \"false\" otherwise"
      required: true
      schema:
        type: string
        enum: ["true", "false"]
  requestBodies:
    TodoBoardWrite:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/TodoBoardWrite"
    TodoPreference:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/TodoPreference"
  responses:
    TodoBoard:
      description: Updated shared list
      headers:
        Cache-Control:
          schema: {type: string, enum: [no-store]}
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/TodoBoard"
    TodoView:
      description: Shared list with the viewer's private display preference
      headers:
        Cache-Control:
          schema: {type: string, enum: [no-store]}
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/TodoView"
    Moved:
      description: |
        The repository was renamed or transferred; Location is its new URL
        (301 for GET, 307 for the other methods, which must be repeated there).
      headers:
        Location:
          required: true
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Problem:
      description: Error in RFC 9457 format
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    TooManyRequests:
      description: Too many attempts; retry after the given number of seconds
      headers:
        Retry-After:
          required: true
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unavailable:
      description: |
        The repository is being restored from the remote store or is busy;
        retry after the given number of seconds (absent when degraded).
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    TodoCategory:
      type: object
      required: [id, name]
      properties:
        id: {type: string, format: uuid}
        name: {type: string, minLength: 1, maxLength: 80}
    TodoItemWrite:
      type: object
      required: [id, title, completed]
      properties:
        id: {type: string, format: uuid}
        title: {type: string, minLength: 1, maxLength: 240}
        completed: {type: boolean}
        categoryId: {type: string, format: uuid, description: Absent for uncategorized items}
    TodoItem:
      allOf:
        - $ref: "#/components/schemas/TodoItemWrite"
        - type: object
          properties:
            completedBy:
              description: The member who checked this item. Absent when unchecked or attribution is unavailable.
              readOnly: true
              allOf:
                - $ref: "#/components/schemas/UserSummary"
    TodoBoardWrite:
      type: object
      required: [revision, categories, items]
      properties:
        revision:
          type: integer
          format: int64
          minimum: 0
          description: Pass back the last seen revision to avoid overwriting another member's changes.
        categories:
          type: array
          maxItems: 64
          items:
            $ref: "#/components/schemas/TodoCategory"
        items:
          type: array
          maxItems: 500
          description: Category and item arrays are in display order.
          items:
            $ref: "#/components/schemas/TodoItemWrite"
    TodoBoard:
      type: object
      required: [revision, categories, items]
      properties:
        revision:
          type: integer
          format: int64
          minimum: 0
          description: Use this revision when saving changes.
        categories:
          type: array
          maxItems: 64
          items:
            $ref: "#/components/schemas/TodoCategory"
        items:
          type: array
          maxItems: 500
          description: Category and item arrays are in display order.
          items:
            $ref: "#/components/schemas/TodoItem"
    TodoPreference:
      type: object
      required: [collapsed]
      properties:
        collapsed: {type: boolean}
    TodoView:
      type: object
      required: [board, collapsed]
      properties:
        board:
          $ref: "#/components/schemas/TodoBoard"
        collapsed: {type: boolean}
    # --- actions schemas ---
    ActionsWorkflow:
      type: object
      required: [path, name]
      properties:
        path: {type: string}
        name: {type: string}
        lastRunAt: {type: string, format: date-time, nullable: true, description: Absent when it never ran}
        onDefaultBranch: {type: boolean, description: The file exists on the default branch}
    ActionsGitHubImportRequest:
      type: object
      properties:
        overwriteVariables: {type: boolean, default: false, description: Replace the variables that already exist}
        runs: {type: boolean, default: true, description: Also read the latest workflow runs}
    ActionsGitHubSecretName:
      type: object
      required: [name, environment]
      properties:
        name: {type: string}
        environment: {type: string, description: Empty for a repository secret}
    ActionsGitHubImport:
      type: object
      required: [available, remote, variablesImported, variablesSkipped, runsImported, lastError, missingSecrets]
      properties:
        available: {type: boolean, description: The repository is linked to or was imported from GitHub}
        remote: {type: string, description: owner/name on GitHub}
        remoteUrl: {type: string}
        importedAt: {type: string, format: date-time, nullable: true}
        runsSyncedAt: {type: string, format: date-time, nullable: true}
        variablesImported: {type: integer}
        variablesSkipped: {type: integer, description: Variables kept because they already existed}
        runsImported: {type: integer}
        lastError: {type: string}
        missingSecrets:
          type: array
          items: {$ref: "#/components/schemas/ActionsGitHubSecretName"}
    ActionsRun:
      type: object
      required: [id, runNumber, attempt, workflowPath, workflowName, event, eventAction, ref, sha, title, status,
        conclusion, needsApproval, fork, actor, triggerActor, url, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        runNumber: {type: integer, format: int64}
        attempt: {type: integer}
        workflowPath: {type: string}
        workflowName: {type: string}
        event: {type: string}
        eventAction: {type: string}
        ref: {type: string}
        sha: {type: string}
        title: {type: string}
        status: {type: string, enum: [waiting, pending, queued, in_progress, completed]}
        conclusion: {type: string, description: Empty unless completed}
        needsApproval: {type: boolean}
        fork: {type: boolean}
        actor: {type: string}
        triggerActor: {type: string}
        url: {type: string, description: Web page of the run}
        external:
          type: boolean
          description: A read-only run imported from GitHub (no jobs or logs here; see htmlUrl)
        htmlUrl: {type: string, description: Page of an external run on GitHub}
        startedAt: {type: string, format: date-time, nullable: true}
        completedAt: {type: string, format: date-time, nullable: true}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    ActionsRunList:
      type: object
      required: [totalCount, runs]
      properties:
        totalCount: {type: integer, format: int64}
        runs:
          type: array
          items: {$ref: "#/components/schemas/ActionsRun"}
    LabelRef:
      type: object
      required: [name, color]
      properties:
        name: {type: string}
        color: {type: string, description: Six lowercase hex digits, without "#"}
    UserIssue:
      type: object
      required: [owner, repo, fullName, number, title, kind, state, author, labels, commentCount, createdAt, updatedAt]
      properties:
        owner: {type: string}
        repo: {type: string}
        fullName: {type: string, description: owner/repo}
        number: {type: integer, format: int64}
        title: {type: string}
        kind: {type: string, enum: [issue, pull]}
        state: {type: string, enum: [open, closed, merged]}
        author: {type: string, description: Username; empty when the account is gone}
        labels:
          type: array
          items: {$ref: "#/components/schemas/LabelRef"}
        commentCount: {type: integer}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    UserIssueList:
      type: object
      required: [totalCount, items]
      properties:
        totalCount: {type: integer, format: int64}
        items:
          type: array
          items: {$ref: "#/components/schemas/UserIssue"}
    UserActionsRun:
      type: object
      required: [owner, repo, fullName, id, runNumber, workflowName, title, branch, event, status, conclusion, url,
        createdAt, updatedAt]
      properties:
        owner: {type: string}
        repo: {type: string}
        fullName: {type: string}
        id: {type: string, format: uuid}
        runNumber: {type: integer, format: int64}
        workflowName: {type: string}
        title: {type: string}
        branch: {type: string, description: Short ref name (the full ref for tags and pull requests)}
        event: {type: string}
        status: {type: string, enum: [waiting, pending, queued, in_progress, completed]}
        conclusion: {type: string, description: Empty unless completed}
        url: {type: string, description: Web page of the run}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    UserActionsRunList:
      type: object
      required: [totalCount, runs]
      properties:
        totalCount: {type: integer, format: int64}
        runs:
          type: array
          items: {$ref: "#/components/schemas/UserActionsRun"}
    ActivityItem:
      type: object
      required: [id, kind, action, actor, owner, repo, fullName, number, title, createdAt]
      properties:
        id: {type: string, format: uuid}
        kind: {type: string, enum: [push, issue, pull_request, release, comment]}
        action:
          type: string
          description: "pushed, opened, closed, reopened, merged, published or created"
        actor: {type: string, description: Username; empty when the account is gone}
        owner: {type: string}
        repo: {type: string}
        fullName: {type: string}
        number: {type: integer, format: int64, description: Issue or pull request number; 0 for pushes and releases}
        title: {type: string, description: Issue or pull request title, release tag, or pushed ref}
        createdAt: {type: string, format: date-time}
    ExploreRepoList:
      type: object
      required: [totalCount, items]
      properties:
        totalCount: {type: integer, format: int64}
        items:
          type: array
          items: {$ref: "#/components/schemas/Repo"}
    UserPreferences:
      type: object
      required: [theme, layout]
      properties:
        theme: {type: string, enum: [system, light, dark, oled, soft]}
        layout: {type: string, enum: ["", console, foglio, corsie], description: Empty = the instance default}
    UserPreferencesUpdate:
      type: object
      properties:
        theme: {type: string, enum: [system, light, dark, oled, soft]}
        layout: {type: string, enum: ["", console, foglio, corsie]}
    ActionsJob:
      type: object
      required: [id, runId, key, name, needs, status, conclusion, environment, cancelRequested, approved, runsOn,
        runner, reusable, caller, logLength, logExpired, url]
      properties:
        id: {type: string, format: uuid}
        runId: {type: string, format: uuid}
        key: {type: string}
        name: {type: string}
        needs:
          type: array
          items: {type: string}
        status: {type: string, enum: [blocked, waiting, queued, in_progress, completed]}
        conclusion: {type: string, description: "success, failure, cancelled, skipped or timed_out; empty unless completed"}
        environment: {type: string}
        cancelRequested: {type: boolean}
        approved: {type: boolean, description: The deployment to environment was approved}
        runsOn:
          type: array
          items: {type: string}
        runner: {type: string, description: Name of the runner that took the job}
        reusable: {type: boolean, description: The job calls a reusable workflow; its jobs follow with caller set}
        caller: {type: string}
        logLength: {type: integer, format: int64}
        logExpired: {type: boolean, description: "The log was deleted because the run is not tied to a release (actions.unreleased_retention)"}
        url: {type: string}
        startedAt: {type: string, format: date-time, nullable: true}
        completedAt: {type: string, format: date-time, nullable: true}
    ActionsStep:
      type: object
      required: [index, name, status, conclusion, logIndex, logLength]
      properties:
        index: {type: integer}
        name: {type: string}
        status: {type: string}
        conclusion: {type: string}
        logIndex: {type: integer, format: int64, description: First log row of the step}
        logLength: {type: integer, format: int64}
        startedAt: {type: string, format: date-time, nullable: true}
        completedAt: {type: string, format: date-time, nullable: true}
    ActionsJobDetail:
      type: object
      required: [job, steps]
      properties:
        job: {$ref: "#/components/schemas/ActionsJob"}
        steps:
          type: array
          items: {$ref: "#/components/schemas/ActionsStep"}
    ActionsLogLine:
      type: object
      required: [index, time, content]
      properties:
        index: {type: integer, format: int64}
        time: {type: string, format: date-time}
        content: {type: string}
    ActionsLogPage:
      type: object
      required: [lines, next, complete]
      properties:
        lines:
          type: array
          items: {$ref: "#/components/schemas/ActionsLogLine"}
        next: {type: integer, format: int64, description: Index to read from next}
        complete: {type: boolean, description: The job ended and every row was read}
    ActionsDispatch:
      type: object
      properties:
        ref: {type: string, maxLength: 255, description: Branch or tag; defaults to the default branch}
        inputs:
          type: object
          additionalProperties: true
    ActionsDeploymentReview:
      type: object
      required: [approve]
      properties:
        approve: {type: boolean, description: false rejects (cancels) the job}
    ActionsSecret:
      type: object
      required: [name, scope, environment, createdAt, updatedAt]
      properties:
        name: {type: string}
        scope: {type: string, description: "instance, org:<name> or repo:<owner>/<name>"}
        environment: {type: string}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    ActionsSecretPut:
      type: object
      required: [value]
      properties:
        value: {type: string, maxLength: 49152, writeOnly: true}
    ActionsVariable:
      type: object
      required: [name, value, scope, environment, createdAt, updatedAt]
      properties:
        name: {type: string}
        value: {type: string}
        scope: {type: string}
        environment: {type: string}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    ActionsVariablePut:
      type: object
      required: [value]
      properties:
        value: {type: string, maxLength: 65536}
    ActionsEnvironment:
      type: object
      required: [name, requireApproval, reviewers, createdAt, updatedAt]
      properties:
        name: {type: string}
        requireApproval: {type: boolean}
        reviewers:
          type: array
          description: User ids
          items: {type: string, format: uuid}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    ActionsEnvironmentPut:
      type: object
      properties:
        requireApproval: {type: boolean}
        reviewers:
          type: array
          description: Usernames; empty means the repository maintainers
          maxItems: 100
          items: {type: string, maxLength: 39}
    ActionsRunner:
      type: object
      required: [id, name, scope, labels, version, ephemeral, online, busy, paused, status, running, capacity, createdAt,
        jobs, updateAvailable, updatePending, selfUpdate]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        scope: {type: string, description: "instance, org:<name> or repo:<owner>/<name>"}
        labels:
          type: array
          items: {type: string}
        version: {type: string}
        ephemeral: {type: boolean}
        online: {type: boolean}
        busy: {type: boolean}
        paused: {type: boolean, description: Takes no new jobs; running ones finish}
        status:
          type: string
          enum: [offline, paused, idle, online, busy]
          description: |
            offline (silent), paused, idle (no job), online (running jobs
            below capacity) or busy (every slot taken).
        running: {type: integer, description: Jobs running now}
        capacity: {type: integer, description: Jobs it runs at the same time as it reported; 0 when unknown}
        lastSeenAt: {type: string, format: date-time, nullable: true}
        createdAt: {type: string, format: date-time}
        metrics:
          $ref: '#/components/schemas/ActionsRunnerMetrics'
        jobs:
          type: array
          description: Jobs running on the runner now, oldest first
          items: {$ref: '#/components/schemas/ActionsRunnerJob'}
        updateAvailable: {type: boolean, description: The runner runs an older version than the server}
        updatePending:
          type: boolean
          description: An update to updateVersion was requested and the runner has not reported it yet
        updateVersion: {type: string, description: Target version of the pending update}
        updateError: {type: string, description: Why the last requested update failed, as the runner reported it}
        selfUpdate:
          type: boolean
          description: |
            The runner can update itself from the admin panel (false for the
            built-in runner, runners in containers, ephemeral runners and
            versions without self-update)
        wake:
          $ref: '#/components/schemas/ActionsRunnerWake'
    ActionsRunnerUpdateAll:
      type: object
      required: [requested, version]
      properties:
        requested: {type: integer, description: Runners asked to update}
        version: {type: string, description: Target version (the server version)}
    ActionsRunnerMetrics:
      type: object
      description: |
        Latest resource usage reported by the runner (absent until it reports).
        Fields the runner could not measure are omitted.
      required: [reportedAt, cpuCount, gpus]
      properties:
        reportedAt: {type: string, format: date-time}
        hostname: {type: string}
        os: {type: string}
        arch: {type: string}
        cpuCount: {type: integer, description: Logical CPUs; 0 when unknown}
        cpuPercent: {type: number, format: double, description: Busy share of the whole machine (0-100)}
        load1: {type: number, format: double, description: One-minute load average}
        memoryUsedBytes: {type: integer, format: int64}
        memoryTotalBytes: {type: integer, format: int64}
        diskUsedBytes: {type: integer, format: int64, description: Filesystem of the runner data directory}
        diskTotalBytes: {type: integer, format: int64}
        gpus:
          type: array
          items: {$ref: '#/components/schemas/ActionsRunnerGpu'}
    ActionsRunnerGpu:
      type: object
      required: [name]
      properties:
        name: {type: string}
        utilizationPercent: {type: number, format: double}
        memoryUsedBytes: {type: integer, format: int64}
        memoryTotalBytes: {type: integer, format: int64}
    ActionsRunnerJob:
      type: object
      description: |
        A job running on a runner. visible is false when the caller cannot
        read its repository: only id and startedAt are set then.
      required: [id, visible]
      properties:
        id: {type: string, format: uuid}
        visible: {type: boolean}
        startedAt: {type: string, format: date-time}
        name: {type: string}
        runId: {type: string, format: uuid}
        runNumber: {type: integer, format: int64}
        workflowName: {type: string}
        repository: {$ref: '#/components/schemas/ActionsRunnerJobRepo'}
    ActionsRunnerJobRepo:
      type: object
      required: [owner, name, fullName]
      properties:
        owner: {type: string}
        name: {type: string}
        fullName: {type: string, description: owner/name}
    ActionsRunnerWake:
      type: object
      description: |
        On-demand start of an instance runner (absent when none is set).
        The token is write-only.
      required: [enabled, url, header, hasToken, cooldownSeconds, lastStatus]
      properties:
        enabled: {type: boolean}
        url: {type: string, description: Start URL called with POST}
        header: {type: string, description: Header carrying the token; empty sends it as Authorization Bearer}
        hasToken: {type: boolean}
        cooldownSeconds: {type: integer, description: Minimum time between two calls}
        lastWakeAt: {type: string, format: date-time, nullable: true}
        lastStatus: {type: integer, description: HTTP status of the last call; 0 when the call failed or never ran}
        lastError: {type: string, description: Why the last call failed}
    ActionsRunnerWakeSettings:
      type: object
      required: [enabled, url]
      properties:
        enabled: {type: boolean}
        url: {type: string, maxLength: 2048, description: "https:// start URL"}
        header: {type: string, maxLength: 128, description: "Token header, e.g. x-token; empty means Authorization: Bearer"}
        token: {type: string, maxLength: 4096, description: "Token sent in the header; omitted keeps the stored one, empty removes it"}
        cooldownSeconds: {type: integer, minimum: 30, maximum: 3600, description: Minimum time between two calls (default 180)}
    ActionsRunnerPause:
      type: object
      required: [paused]
      properties:
        paused: {type: boolean}
    ActionsRunnerDevice:
      type: object
      required: [userCode, hostname, os, arch, cpus, memoryBytes, docker, version, name, labels, capacity,
        requestIp, canInstance, createdAt, expiresAt]
      properties:
        userCode: {type: string, description: XXXX-XXXX}
        hostname: {type: string}
        os: {type: string}
        arch: {type: string}
        cpus: {type: integer}
        memoryBytes: {type: integer, format: int64}
        docker: {type: boolean, description: Docker was found on the machine}
        version: {type: string, description: ervisio-runner version}
        name: {type: string, description: Requested runner name}
        labels:
          type: array
          description: Requested label names
          items: {type: string}
        capacity: {type: integer, description: Requested capacity}
        requestIp: {type: string}
        canInstance: {type: boolean, description: The caller may approve an instance runner}
        createdAt: {type: string, format: date-time}
        expiresAt: {type: string, format: date-time}
    ActionsRunnerDeviceDecision:
      type: object
      required: [approve]
      properties:
        approve: {type: boolean}
        scope:
          type: string
          maxLength: 300
          description: "instance, org:<name> or repo:<owner>/<name>; required to approve"
        name: {type: string, maxLength: 255, description: Defaults to the requested name}
        labels:
          type: array
          maxItems: 64
          description: Label names; defaults to the requested ones
          items: {type: string, maxLength: 255}
        capacity: {type: integer, minimum: 0, maximum: 64, description: 0 keeps the requested capacity}
    ActionsRegistrationToken:
      type: object
      required: [token, scope, expiresAt]
      properties:
        token: {type: string, description: "errt_... secret, shown only once"}
        scope: {type: string}
        expiresAt: {type: string, format: date-time}
    # --- end actions schemas ---
    # --- commit statuses and checks schemas ---
    CommitStatus:
      type: object
      required: [id, sha, state, context, description, targetUrl, creator, createdAt]
      properties:
        id: {type: string, format: uuid}
        sha: {type: string}
        state: {type: string, enum: [error, failure, pending, success]}
        context: {type: string}
        description: {type: string}
        targetUrl: {type: string}
        creator: {type: string, description: Username of the reporter; empty when unknown}
        createdAt: {type: string, format: date-time}
    CommitStatusCreate:
      type: object
      required: [state]
      properties:
        state: {type: string, enum: [error, failure, pending, success]}
        context: {type: string, maxLength: 255, description: Defaults to "default"}
        description: {type: string, maxLength: 1024}
        targetUrl: {type: string, maxLength: 2048, description: An http or https URL}
    CombinedStatus:
      type: object
      required: [sha, state, totalCount, statuses]
      properties:
        sha: {type: string}
        state: {type: string, enum: [failure, pending, success]}
        totalCount: {type: integer}
        statuses:
          type: array
          items:
            $ref: "#/components/schemas/CommitStatus"
    CheckAnnotation:
      type: object
      required: [path, startLine, endLine, level, message]
      properties:
        path: {type: string, maxLength: 4096}
        startLine: {type: integer, minimum: 1}
        endLine: {type: integer, minimum: 1}
        startColumn: {type: integer, minimum: 1}
        endColumn: {type: integer, minimum: 1}
        level: {type: string, enum: [notice, warning, failure]}
        message: {type: string, maxLength: 65535}
        title: {type: string, maxLength: 255}
        rawDetails: {type: string, maxLength: 65535}
    CheckRunOutput:
      type: object
      properties:
        title: {type: string, maxLength: 1024}
        summary: {type: string, maxLength: 65535}
        text: {type: string, maxLength: 65535}
        annotations:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/CheckAnnotation"
    CheckRun:
      type: object
      required: [id, suiteId, headSha, headBranch, name, app, status, conclusion, externalId, detailsUrl,
        title, summary, text, annotationsCount, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        suiteId: {type: string, format: uuid}
        headSha: {type: string}
        headBranch: {type: string, description: Branch the suite was first reported for; may be empty}
        name: {type: string}
        app: {type: string, description: Reporter of the suite}
        status: {type: string, enum: [queued, in_progress, completed]}
        conclusion: {type: string, description: Empty unless completed}
        externalId: {type: string}
        detailsUrl: {type: string}
        title: {type: string}
        summary: {type: string}
        text: {type: string}
        annotationsCount: {type: integer}
        startedAt: {type: string, format: date-time, nullable: true}
        completedAt: {type: string, format: date-time, nullable: true}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    CheckRunCreate:
      type: object
      required: [name, headSha]
      properties:
        name: {type: string, maxLength: 255}
        headSha: {type: string, maxLength: 255, description: Commit id or any ref}
        status: {type: string, enum: [queued, in_progress, completed]}
        conclusion:
          type: string
          enum: [success, failure, neutral, cancelled, skipped, timed_out, action_required, stale, startup_failure]
        externalId: {type: string, maxLength: 255}
        detailsUrl: {type: string, maxLength: 2048}
        startedAt: {type: string, format: date-time}
        completedAt: {type: string, format: date-time}
        app: {type: string, maxLength: 255, description: Reporter; defaults to the caller's username}
        output:
          $ref: "#/components/schemas/CheckRunOutput"
    CheckRunUpdate:
      type: object
      properties:
        name: {type: string, maxLength: 255}
        status: {type: string, enum: [queued, in_progress, completed]}
        conclusion:
          type: string
          enum: [success, failure, neutral, cancelled, skipped, timed_out, action_required, stale, startup_failure]
        externalId: {type: string, maxLength: 255}
        detailsUrl: {type: string, maxLength: 2048}
        startedAt: {type: string, format: date-time}
        completedAt: {type: string, format: date-time}
        output:
          $ref: "#/components/schemas/CheckRunOutput"
    CheckRunList:
      type: object
      required: [totalCount, checkRuns]
      properties:
        totalCount: {type: integer}
        checkRuns:
          type: array
          items:
            $ref: "#/components/schemas/CheckRun"
    CheckSuite:
      type: object
      required: [id, headSha, headBranch, app, status, conclusion, runsCount, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        headSha: {type: string}
        headBranch: {type: string}
        app: {type: string}
        status: {type: string, enum: [queued, in_progress, completed]}
        conclusion: {type: string, description: Empty unless completed}
        runsCount: {type: integer, description: Number of distinct check run names}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    CheckSuiteList:
      type: object
      required: [totalCount, checkSuites]
      properties:
        totalCount: {type: integer}
        checkSuites:
          type: array
          items:
            $ref: "#/components/schemas/CheckSuite"
    # --- end commit statuses and checks schemas ---
    # --- github sync schemas ---
    GitHubConnection:
      type: object
      required: [id, owner, ownerKind, name, kind, baseUrl, webhookUrl, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        owner: {type: string}
        ownerKind: {type: string, enum: [user, org]}
        name: {type: string}
        kind: {type: string, enum: [app, token]}
        baseUrl: {type: string, description: Web URL of github.com or of a GitHub Enterprise Server}
        appId: {type: integer, format: int64}
        installationId: {type: integer, format: int64}
        webhookUrl: {type: string, description: Payload URL to configure on GitHub (content type application/json)}
        webhookSecret:
          type: string
          description: Only in the response that created or rotated it
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    GitHubConnectionCreate:
      type: object
      required: [name, kind]
      properties:
        owner: {type: string, maxLength: 39, description: User or organization; the caller when empty}
        name: {type: string, minLength: 1, maxLength: 100}
        kind: {type: string, enum: [app, token]}
        baseUrl: {type: string, maxLength: 255}
        appId: {type: integer, format: int64, minimum: 1}
        installationId: {type: integer, format: int64, minimum: 1}
        privateKey: {type: string, maxLength: 16384, description: PEM private key of the GitHub App (app)}
        token: {type: string, maxLength: 1024, description: Fine-grained personal access token (token)}
        webhookSecret: {type: string, minLength: 16, maxLength: 256, description: Generated when empty}
    GitHubConnectionUpdate:
      type: object
      properties:
        name: {type: string, minLength: 1, maxLength: 100}
        appId: {type: integer, format: int64, minimum: 1}
        installationId: {type: integer, format: int64, minimum: 1}
        privateKey: {type: string, maxLength: 16384}
        token: {type: string, maxLength: 1024}
        rotateWebhookSecret: {type: boolean}
    GitHubConnectionCheck:
      type: object
      required: [ok]
      properties:
        ok: {type: boolean}
        detail: {type: string, description: Why the check failed}
    GitHubImportCreate:
      type: object
      required: [connectionId, remoteOwner, remoteName]
      properties:
        connectionId: {type: string, format: uuid}
        remoteOwner: {type: string, maxLength: 39}
        remoteName: {type: string, maxLength: 100}
        owner: {type: string, maxLength: 39, description: Owner of the new repository; the caller when empty}
        name: {type: string, maxLength: 100, description: Name of the new repository; remoteName when empty}
        description: {type: string, maxLength: 1000}
        visibility: {$ref: "#/components/schemas/Visibility"}
        include:
          type: array
          description: Kinds of non-git data to import; all when empty or absent
          maxItems: 6
          items: {$ref: "#/components/schemas/GitHubImportKind"}
    GitHubImportKind:
      type: string
      enum: [labels, milestones, pulls, issues, releases, actions]
    GitHubImport:
      type: object
      required: [id, repoId, repoFullName, remoteOwner, remoteName, status, lastError, createdAt]
      properties:
        id: {type: string, format: uuid}
        repoId: {type: string, format: uuid}
        repoFullName: {type: string}
        remoteOwner: {type: string}
        remoteName: {type: string}
        status: {type: string, enum: [pending, running, done, error]}
        lastError: {type: string}
        include:
          type: array
          description: Kinds of non-git data imported; empty means all
          items: {$ref: "#/components/schemas/GitHubImportKind"}
        createdAt: {type: string, format: date-time}
        startedAt: {type: string, format: date-time}
        finishedAt: {type: string, format: date-time}
    GitHubSyncMode:
      type: string
      enum: [mirror, backup, sync]
    GitHubSyncLink:
      type: object
      required: [connectionId, mode, remoteOwner, remoteName, prune, trustGithub, createMissing, intervalMinutes,
        enabled, runActions, readOnly, status, lastError, failures, lfsSkipped, createdAt, updatedAt]
      properties:
        connectionId: {type: string, format: uuid}
        mode: {$ref: "#/components/schemas/GitHubSyncMode"}
        remoteOwner: {type: string}
        remoteName: {type: string}
        prune: {type: boolean}
        trustGithub:
          type: array
          items: {type: string}
        createMissing: {type: boolean}
        intervalMinutes: {type: integer}
        enabled: {type: boolean}
        runActions: {type: boolean, description: "Synced pushes start workflows (as ervisio-sync[bot])"}
        readOnly: {type: boolean, description: Pushes are refused (mirror)}
        status: {type: string, enum: [pending, ok, diverged, error]}
        lastError: {type: string}
        failures: {type: integer}
        nextAttemptAt: {type: string, format: date-time}
        lastRunAt: {type: string, format: date-time}
        lastSuccessAt: {type: string, format: date-time}
        lfsSkipped:
          type: boolean
          description: The repository has Git LFS objects, which are not sent to GitHub
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    GitHubSyncLinkPut:
      type: object
      required: [connectionId, mode, remoteOwner, remoteName]
      properties:
        connectionId: {type: string, format: uuid}
        mode: {$ref: "#/components/schemas/GitHubSyncMode"}
        remoteOwner: {type: string, maxLength: 39}
        remoteName: {type: string, maxLength: 100}
        prune: {type: boolean, default: false, description: Propagate branch and tag deletions}
        trustGithub:
          type: array
          maxItems: 50
          description: Branch patterns (sync) on which GitHub wins a divergence
          items: {type: string, maxLength: 255}
        createMissing:
          type: boolean
          default: false
          description: Create the GitHub repository (private) when it does not exist (backup, sync)
        intervalMinutes: {type: integer, minimum: 10, maximum: 10080, default: 10}
        enabled: {type: boolean, default: true}
        runActions:
          type: boolean
          default: false
          description: Run Actions on synced pushes (mirror, sync); the runs show ervisio-sync[bot] as actor
    GitHubSyncRef:
      type: object
      required: [ref, localSha, remoteSha, status, lastError, retries, resolution, updatedAt]
      properties:
        ref: {type: string}
        localSha: {type: string}
        remoteSha: {type: string}
        status: {type: string, enum: [ok, diverged, error]}
        lastError: {type: string}
        retries: {type: integer}
        conflictRef: {type: string, description: Branch holding the GitHub commit of a divergence}
        conflictSha: {type: string}
        resolution: {type: string, enum: ["", merge_request]}
        updatedAt: {type: string, format: date-time}
    GitHubSyncResolve:
      type: object
      required: [ref, resolution]
      properties:
        ref: {type: string, maxLength: 255, description: Full ref name (refs/heads/...)}
        resolution: {type: string, enum: [keep_ervisio, keep_github, merge_request]}
    # --- end github sync schemas ---
    OidcProvider:
      type: object
      required: [name, label]
      properties:
        name:
          type: string
        label:
          type: string
    OidcLink:
      type: object
      required: [id, provider, label, createdAt]
      properties:
        id:
          type: string
          format: uuid
        provider:
          type: string
        label:
          type: string
        email:
          type: string
          description: Email address reported by the provider, if any
        createdAt:
          type: string
          format: date-time
        lastLoginAt:
          type: string
          format: date-time
    OidcLinkRequest:
      type: object
      properties:
        returnTo:
          type: string
          maxLength: 2000
          description: Local path to return to after the provider (default /settings)
    OidcRedirect:
      type: object
      required: [url]
      properties:
        url:
          type: string
          format: uri
    AccessToken:
      type: object
      required: [id, name, hint, scopes, expiresAt, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        hint:
          type: string
          description: First characters of the token (erp_ and four more)
        scopes:
          type: array
          items:
            type: string
        expiresAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
    AccessTokenCreate:
      type: object
      required: [name, scopes, expiresAt]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        scopes:
          type: array
          minItems: 1
          maxItems: 8
          items:
            type: string
            enum: [user:read, user:write, repo:read, repo:write, packages:read, packages:write, actions:write, admin]
        expiresAt:
          type: string
          format: date-time
          description: Required; at most the configured maximum lifetime from now
    ErvisioCodeAccount:
      type: object
      required: [accountId, username, device]
      properties:
        accountId:
          type: string
          format: uuid
        username:
          type: string
        device:
          $ref: "#/components/schemas/ErvisioCodeDevice"
    ErvisioCodeDevice:
      type: object
      required: [id, name, createdAt, expiresAt]
      properties:
        id:
          type: string
          format: uuid
          description: Server-assigned device credential ID
        name:
          type: string
          description: Friendly label
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
        remote:
          $ref: "#/components/schemas/ErvisioCodeRemotePresence"
    ErvisioCodeRemotePresence:
      type: object
      required: [online]
      properties:
        online:
          type: boolean
    ErvisioCodeRemotePresenceUpdate:
      type: object
      x-go-type: remotePresenceUpdate
      additionalProperties: false
      required: [active]
      properties:
        active:
          type: boolean
    ErvisioCodeRemoteSession:
      type: object
      required: [deviceId, relayId, sessionId, title, lastActivityAt]
      properties:
        deviceId: {type: string, format: uuid}
        relayId: {type: string, format: uuid}
        sessionId: {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9_-]+$'}
        title: {type: string, maxLength: 256}
        lastActivityAt: {type: string, format: date-time}
        textCollaboration: {type: boolean, description: The exact live publication supports tool-free collaboration in the session transcript.}
    ErvisioCodeRemoteRecent:
      type: object
      required: [deviceId, sessionId, title, lastActivityAt]
      properties:
        deviceId: {type: string, format: uuid}
        sessionId: {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9_-]+$'}
        title: {type: string, maxLength: 256}
        lastActivityAt: {type: string, format: date-time}
    ErvisioCodeRemoteOp:
      type: string
      enum: [state, prompt, interrupt]
    ErvisioCodeRemoteProject:
      type: object
      required: [deviceId, relayId, projectId, label]
      properties:
        deviceId: {type: string, format: uuid}
        relayId: {type: string, format: uuid}
        projectId: {type: string, format: uuid}
        label: {type: string, minLength: 1, maxLength: 128}
        deviceName: {type: string}
        repository: {$ref: "#/components/schemas/ErvisioCodeRemoteRepository"}
    ErvisioCodeRemoteRepository:
      type: object
      additionalProperties: false
      description: Display metadata for a host-approved checkout. Never contains a path, URL, or credentials.
      required: [provider, name, checkout]
      properties:
        provider: {type: string, enum: [ervisiorepo, github]}
        name: {type: string, maxLength: 201, pattern: '^[A-Za-z0-9][A-Za-z0-9_.-]{0,99}/[A-Za-z0-9][A-Za-z0-9_.-]{0,99}$'}
        checkout: {type: string, enum: [separate, existing]}
    ErvisioCodeRepositoryCatalog:
      type: object
      required: [ervisiorepo, github]
      properties:
        ervisiorepo: {$ref: "#/components/schemas/ErvisioCodeProviderCatalog"}
        github: {$ref: "#/components/schemas/ErvisioCodeProviderCatalog"}
    ErvisioCodeProviderCatalog:
      type: object
      required: [status, repositories]
      properties:
        status:
          type: string
          enum: [ready, not_connected, unavailable, partial]
          x-enum-varnames: [CatalogReady, CatalogNotConnected, CatalogUnavailable, CatalogPartial]
          description: Partial means only part of the catalog could be listed; listed repositories are still authorized.
        repositories:
          type: array
          items: {$ref: "#/components/schemas/ErvisioCodeCatalogRepository"}
    ErvisioCodeCatalogRepository:
      type: object
      required: [name, checkouts]
      properties:
        name: {type: string, maxLength: 201, pattern: '^[A-Za-z0-9][A-Za-z0-9_.-]{0,99}/[A-Za-z0-9][A-Za-z0-9_.-]{0,99}$'}
        checkouts:
          type: array
          items: {$ref: "#/components/schemas/ErvisioCodeRemoteProject"}
    ErvisioCodeRemoteCreate:
      type: object
      additionalProperties: false
      required: [deviceId, relayId, projectId]
      properties:
        deviceId: {type: string, format: uuid}
        relayId: {type: string, format: uuid}
        projectId: {type: string, format: uuid}
    ErvisioCodeRemoteAction:
      type: object
      additionalProperties: false
      required: [deviceId, relayId, sessionId, op]
      properties:
        deviceId: {type: string, format: uuid}
        relayId: {type: string, format: uuid}
        sessionId: {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9_-]+$'}
        op: {$ref: "#/components/schemas/ErvisioCodeRemoteOp"}
        text: {type: string, minLength: 1, maxLength: 16384, description: Plain prompt text; required only for the prompt operation.}
    ErvisioCodeRemoteMessage:
      type: object
      additionalProperties: false
      required: [role, text]
      properties:
        messageId: {$ref: "#/components/schemas/ErvisioCodeMessageId"}
        role: {type: string, enum: [user, assistant]}
        text: {type: string, maxLength: 16384, description: At most 8192 UTF-8 bytes except for a contributor's prompt (16384 bytes).}
        contributorId: {type: string, format: uuid, description: Account that submitted the collaborator prompt that produced this message; omitted for ordinary owner turns.}
    ErvisioCodeRemoteState:
      type: object
      properties:
        messages:
          type: array
          maxItems: 50
          description: Recent visible messages, oldest first, at most 65536 bytes of text in total. Required for state; omitted for mutations.
          items: {$ref: "#/components/schemas/ErvisioCodeRemoteMessage"}
        busy: {type: boolean, description: Whether owner execution is busy. Required for state; omitted for mutations.}
        collaborationBusy: {type: boolean, description: Whether the session is running on a prompt; on collaboration state it mirrors busy.}
        todos:
          type: array
          maxItems: 50
          description: The agent's current todo list, from its latest update; omitted when the visible messages never set one.
          items: {$ref: "#/components/schemas/ErvisioCodeTodo"}
    ErvisioCodeTodo:
      type: object
      additionalProperties: false
      required: [content, status]
      properties:
        content: {type: string, minLength: 1, maxLength: 512}
        status: {type: string, enum: [pending, in_progress, completed, cancelled], x-enum-varnames: [TodoPending, TodoInProgress, TodoCompleted, TodoCancelled]}
    ErvisioCodeSharedState:
      type: object
      properties:
        messages:
          type: array
          maxItems: 50
          items: {$ref: "#/components/schemas/ErvisioCodeRemoteMessage"}
        busy: {type: boolean, description: Whether owner execution is busy.}
        textCollaboration: {type: boolean, description: This active direct grant can add prompts to the session, and the host's agent works on them.}
        collaborationBusy: {type: boolean, description: Whether the session is running on a prompt.}
        collaborationContributorId: {type: string, format: uuid, description: Contributor whose prompt started the current run, when it is this grant's contributor.}
        todos:
          type: array
          maxItems: 50
          description: The agent's current todo list, from its latest update; omitted when the visible messages never set one.
          items: {$ref: "#/components/schemas/ErvisioCodeTodo"}
    ErvisioCodeCollaborationAction:
      type: object
      additionalProperties: false
      required: [op]
      properties:
        op:
          type: string
          enum: [prompt, interrupt]
          x-enum-varnames: [CollaborationPrompt, CollaborationInterrupt]
        text: {type: string, minLength: 1, maxLength: 16384, description: Plain text only; required for prompt and forbidden for interrupt.}
    ErvisioCodeCollaborationCheck:
      type: object
      additionalProperties: false
      required: [relayId, sessionId, contributorId]
      properties:
        relayId: {type: string, format: uuid}
        sessionId: {$ref: "#/components/schemas/ErvisioCodeMessageId"}
        contributorId: {type: string, format: uuid}
    ErvisioCodeRecipientKind:
      type: string
      enum: [user, org]
      x-enum-varnames: [RecipientUser, RecipientOrg]
    ErvisioCodeRecipient:
      type: object
      required: [id, kind, name]
      properties:
        id: {type: string, format: uuid}
        kind: {$ref: "#/components/schemas/ErvisioCodeRecipientKind"}
        name: {type: string}
        displayName: {type: string}
        avatarUrl: {type: string}
    ErvisioCodeShareRole:
      type: string
      description: Direct grants authorize tool-free model turns in the shared session transcript. Proposer grants remain disabled and may appear on historical revoked shares.
      enum: [reader, proposer, direct]
      x-enum-varnames: [ShareReader, ShareProposer, ShareDirect]
    ErvisioCodeShare:
      type: object
      required: [id, ownerId, deviceId, sessionId, role, fullHistory, createdAt]
      properties:
        id: {type: string, format: uuid}
        ownerId: {type: string, format: uuid}
        deviceId: {type: string, format: uuid}
        sessionId: {type: string}
        sessionTitle: {type: string, description: The latest title published by the approved linked device for this session, when available.}
        ownerUsername: {type: string}
        ownerDisplayName: {type: string}
        ownerAvatarUrl: {type: string}
        recipientId: {type: string, format: uuid}
        orgId: {type: string, format: uuid}
        role: {$ref: "#/components/schemas/ErvisioCodeShareRole"}
        fullHistory: {type: boolean}
        afterMessageId: {$ref: "#/components/schemas/ErvisioCodeMessageId"}
        fromMessageId: {$ref: "#/components/schemas/ErvisioCodeMessageId"}
        newOnly: {type: boolean, description: A private host cursor is stored for this grant.}
        createdAt: {type: string, format: date-time}
        inviteExpiresAt: {type: string, format: date-time}
        acceptedAt: {type: string, format: date-time}
        revokedAt: {type: string, format: date-time}
    ErvisioCodeShareCreate:
      type: object
      additionalProperties: false
      required: [deviceId, sessionId, role]
      description: Supply exactly one of recipientId or orgId, and exactly one history choice. Direct grants require fullHistory true and a live host with text collaboration; organization direct grants also require organizationConsent true.
      properties:
        deviceId: {type: string, format: uuid}
        sessionId: {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9_-]+$'}
        recipientId: {type: string, format: uuid}
        orgId: {type: string, format: uuid}
        role: {$ref: "#/components/schemas/ErvisioCodeShareRole"}
        fullHistory: {type: boolean, enum: [true], description: Explicit consent to disclose existing and future messages.}
        organizationConsent: {type: boolean, description: Separate explicit consent to let current organization members write in the chat and drive the host's agent. Required as true when role is direct and orgId is present.}
        afterMessageId: {$ref: "#/components/schemas/ErvisioCodeMessageId"}
        fromMessageId: {$ref: "#/components/schemas/ErvisioCodeMessageId"}
        newOnly: {type: boolean, enum: [true], description: Start after the host's current history boundary.}
    ErvisioCodeShareAccept:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token: {type: string, minLength: 43, maxLength: 43}
    ErvisioCodeProposal:
      type: object
      required: [id, shareId, authorId, body, status, createdAt, expiresAt]
      properties:
        id: {type: string, format: uuid}
        shareId: {type: string, format: uuid}
        authorId: {type: string, format: uuid}
        body: {type: string}
        status: {type: string, enum: [pending, approved, rejected]}
        createdAt: {type: string, format: date-time}
        reviewedAt: {type: string, format: date-time}
        expiresAt: {type: string, format: date-time}
    ErvisioCodeProposalCreate:
      type: object
      additionalProperties: false
      required: [body]
      properties:
        body: {type: string, minLength: 1, maxLength: 16384, description: Plain text; maximum 16384 UTF-8 bytes.}
    ErvisioCodeProposalReview:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: {type: string, enum: [approved, rejected]}
    ErvisioCodeMessageId:
      type: string
      minLength: 1
      maxLength: 128
      pattern: '^[A-Za-z0-9_-]+$'
      description: Opaque native message identifier scoped to the session.
    ErvisioCodeHostCursor:
      type: string
      minLength: 1
      maxLength: 128
      pattern: '^[A-Za-z0-9_-]+$'
      description: Opaque history cursor created and interpreted by the bound host.
    ErvisioCodeRelayHistory:
      oneOf:
        - $ref: "#/components/schemas/ErvisioCodeHistoryFrom"
        - $ref: "#/components/schemas/ErvisioCodeHistoryAfter"
        - $ref: "#/components/schemas/ErvisioCodeHistoryCursor"
    ErvisioCodeHistoryFrom:
      type: object
      additionalProperties: false
      required: [fromMessageId]
      properties:
        fromMessageId: {$ref: "#/components/schemas/ErvisioCodeMessageId"}
    ErvisioCodeHistoryAfter:
      type: object
      additionalProperties: false
      required: [afterMessageId]
      properties:
        afterMessageId: {$ref: "#/components/schemas/ErvisioCodeMessageId"}
    ErvisioCodeHistoryCursor:
      type: object
      additionalProperties: false
      required: [hostCursor]
      properties:
        hostCursor: {$ref: "#/components/schemas/ErvisioCodeHostCursor"}
    ErvisioCodeRelayPoll:
      type: object
      additionalProperties: false
      required: [relayId, sessions]
      properties:
        relayId: {type: string, format: uuid}
        enabled: {type: boolean, description: When omitted, falls back to whether sessions is nonempty.}
        historyFiltering: {type: boolean, description: The host supports history-boundary and can filter before returning any restricted state.}
        textCollaboration: {type: boolean, description: The host supports tool-free collaboration in the session transcripts in this live publication.}
        projects:
          type: array
          maxItems: 16
          description: Complete set of approved project advertisements; omit to advertise none.
          items: {$ref: "#/components/schemas/ErvisioCodeRemoteProjectPublication"}
        sessions:
          type: array
          maxItems: 16
          items: {$ref: "#/components/schemas/ErvisioCodeRemotePublication"}
        results:
          type: array
          maxItems: 8
          items: {$ref: "#/components/schemas/ErvisioCodeRelayResult"}
    ErvisioCodeRemoteProjectPublication:
      type: object
      additionalProperties: false
      required: [projectId, label]
      properties:
        projectId: {type: string, format: uuid}
        label: {type: string, minLength: 1, maxLength: 128, description: Display label only; do not include local paths or repository URLs.}
        repository: {$ref: "#/components/schemas/ErvisioCodeRemoteRepository"}
    ErvisioCodeRemotePublication:
      type: object
      additionalProperties: false
      required: [sessionId, title]
      properties:
        sessionId: {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9_-]+$'}
        title: {type: string, maxLength: 256}
        lastActivityAt: {type: string, format: date-time, description: Local session activity, not heartbeat time. For omitted timestamps, the server preserves last known activity or uses initial publication time.}
    ErvisioCodeRelayRequest:
      type: object
      required: [id, op, expiresAt]
      properties:
        id: {type: string, format: uuid}
        sessionId: {type: string, description: Present only for actions targeting existing sessions.}
        projectId: {type: string, format: uuid, description: Present only for create.}
        grantId: {type: string, format: uuid, description: Present only for collaboration operations.}
        contributorId: {type: string, format: uuid, description: Server-authenticated actor; present only for collaboration operations.}
        op: {$ref: "#/components/schemas/ErvisioCodeRelayOp"}
        text: {type: string}
        history: {$ref: "#/components/schemas/ErvisioCodeRelayHistory"}
        expiresAt: {type: string, format: date-time}
    ErvisioCodeRelayOp:
      type: string
      enum: [state, prompt, interrupt, create, history-boundary, collaboration-state, collaboration-prompt, collaboration-stop]
      x-enum-varnames: [RelayState, RelayPrompt, RelayInterrupt, RelayCreate, RelayHistoryBoundary, RelayCollaborationState, RelayCollaborationPrompt, RelayCollaborationStop]
    ErvisioCodeRelayResult:
      type: object
      additionalProperties: false
      required: [id, ok]
      properties:
        id: {type: string, format: uuid}
        ok: {type: boolean}
        sessionId: {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9_-]+$', description: On successful create only; also include the new session in this poll's sessions.}
        messages:
          type: array
          maxItems: 50
          items: {$ref: "#/components/schemas/ErvisioCodeRemoteMessage"}
        busy: {type: boolean}
        collaborationBusy: {type: boolean}
        collaborationContributorId: {type: string, format: uuid, description: Returned by collaboration-state when its grant and contributor can stop the active request.}
        todos:
          type: array
          maxItems: 50
          description: The agent's current todo list, from its latest update; omitted when the visible messages never set one.
          items: {$ref: "#/components/schemas/ErvisioCodeTodo"}
        hostCursor: {$ref: "#/components/schemas/ErvisioCodeHostCursor"}
        historyApplied: {type: boolean, description: Set to true only after the host successfully applied the requested state boundary.}
        error: {type: string, maxLength: 160, description: Optional host diagnostic; not shown to controllers.}
    DeviceAuthorization:
      type: object
      required: [userCode, clientId, appName, requestedScopes, scopes, createdAt, expiresAt]
      properties:
        userCode:
          type: string
          description: Normalized code (XXXX-XXXX)
        clientId:
          type: string
        appName:
          type: string
          description: Display name of the OAuth client
        requestedScopes:
          type: array
          description: OAuth scopes the device asked for (GitHub-style, or ervisiocode:device for ErvisioCode)
          items:
            type: string
        scopes:
          type: array
          description: Token scopes of this server the device will receive
          items:
            type: string
        requestIp:
          type: string
          description: Client IP that started the request, when known
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
    DeviceAuthorizationDecision:
      type: object
      required: [approve]
      properties:
        approve:
          type: boolean
    OAuthAppOwner:
      type: object
      required: [kind, name]
      properties:
        kind:
          type: string
          enum: [user, org, system]
        name:
          type: string
          description: Login of the owner; empty for the built-in clients
    OAuthApp:
      type: object
      required: [clientId, name, description, homepageUrl, callbackUrls, deviceFlow, owner, users, createdAt, updatedAt]
      properties:
        clientId:
          type: string
        name:
          type: string
        description:
          type: string
        homepageUrl:
          type: string
        logoUrl:
          type: string
          description: Optional https URL of the logo
        callbackUrls:
          type: array
          items: {type: string}
        deviceFlow:
          type: boolean
        owner: {$ref: "#/components/schemas/OAuthAppOwner"}
        users:
          type: integer
          description: Accounts that have authorized the app
        secrets:
          type: array
          description: Client secrets (getOAuthApp only)
          items: {$ref: "#/components/schemas/OAuthAppSecret"}
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    OAuthAppCreate:
      type: object
      required: [name, homepageUrl, callbackUrls]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 1000
        homepageUrl:
          type: string
          maxLength: 2000
        logoUrl:
          type: string
          maxLength: 2000
        callbackUrls:
          type: array
          minItems: 1
          maxItems: 10
          items: {type: string, maxLength: 2000}
        deviceFlow:
          type: boolean
    OAuthAppUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 1000
        homepageUrl:
          type: string
          maxLength: 2000
        logoUrl:
          type: string
          maxLength: 2000
        callbackUrls:
          type: array
          minItems: 1
          maxItems: 10
          items: {type: string, maxLength: 2000}
        deviceFlow:
          type: boolean
    OAuthAppSecret:
      type: object
      required: [id, hint, createdAt]
      properties:
        id:
          type: string
          format: uuid
        hint:
          type: string
          description: Last eight characters of the secret
        createdBy:
          type: string
          description: Login of the account that generated it
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
    CreatedOAuthAppSecret:
      type: object
      required: [secret, clientSecret]
      properties:
        secret: {$ref: "#/components/schemas/OAuthAppSecret"}
        clientSecret:
          type: string
          description: The secret itself, shown only once
    AppPermissions:
      type: object
      description: GitHub permission names (contents, issues, pull_requests…) with level read or write
      additionalProperties:
        type: string
        enum: [read, write]
    AppCatalog:
      type: object
      required: [repository, organization, user, writeOnly, events]
      properties:
        repository:
          type: array
          items: {type: string}
        organization:
          type: array
          items: {type: string}
        user:
          type: array
          items: {type: string}
        writeOnly:
          type: array
          description: Permissions offered at the write level only
          items: {type: string}
        events:
          type: array
          items: {$ref: "#/components/schemas/AppCatalogEvent"}
    AppCatalogEvent:
      type: object
      required: [name, permission]
      properties:
        name:
          type: string
        permission:
          type: string
          description: Permission the event needs (read); empty for none
        alternative:
          type: string
          description: Another permission that also allows the event
    AppKey:
      type: object
      required: [id, fingerprint, createdAt]
      properties:
        id: {type: string, format: uuid}
        fingerprint: {type: string, description: "SHA256:… of the public key"}
        createdBy: {type: string}
        createdAt: {type: string, format: date-time}
        lastUsedAt: {type: string, format: date-time}
    CreatedAppKey:
      type: object
      required: [key, privateKey]
      properties:
        key: {$ref: "#/components/schemas/AppKey"}
        privateKey:
          type: string
          description: The PEM (PKCS#1) of the private key, shown only once
    AppWebhookConfig:
      type: object
      required: [url, active, hasSecret]
      properties:
        url: {type: string}
        active: {type: boolean}
        hasSecret: {type: boolean}
        lastDelivery: {$ref: "#/components/schemas/WebhookLastDelivery"}
    App:
      type: object
      required: [id, slug, name, description, homepageUrl, logoUrl, public, owner, botLogin, clientId, permissions,
        events, installations, manageable, createdAt, updatedAt]
      properties:
        id:
          type: integer
          format: int64
          description: Numeric App id (the iss of the App JWT)
        slug: {type: string}
        name: {type: string}
        description: {type: string}
        homepageUrl: {type: string}
        logoUrl: {type: string}
        public: {type: boolean}
        owner: {$ref: "#/components/schemas/OAuthAppOwner"}
        botLogin: {type: string, description: "slug[bot]"}
        clientId: {type: string}
        permissions: {$ref: "#/components/schemas/AppPermissions"}
        events:
          type: array
          items: {type: string}
        installations: {type: integer}
        manageable:
          type: boolean
          description: The caller manages the App; the fields below are then set
        setupUrl: {type: string}
        callbackUrls:
          type: array
          items: {type: string}
        webhook: {$ref: "#/components/schemas/AppWebhookConfig"}
        keys:
          type: array
          items: {$ref: "#/components/schemas/AppKey"}
        clientSecrets:
          type: array
          items: {$ref: "#/components/schemas/OAuthAppSecret"}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    AppCreate:
      type: object
      required: [name, homepageUrl]
      properties:
        name: {type: string, minLength: 1, maxLength: 100}
        slug: {type: string, maxLength: 34, description: Derived from the name when empty}
        description: {type: string, maxLength: 1000}
        homepageUrl: {type: string, maxLength: 2000}
        logoUrl: {type: string, maxLength: 2000}
        public: {type: boolean}
        permissions: {$ref: "#/components/schemas/AppPermissions"}
        events:
          type: array
          maxItems: 32
          items: {type: string}
        setupUrl: {type: string, maxLength: 2000}
        callbackUrls:
          type: array
          maxItems: 10
          items: {type: string, maxLength: 2000}
        webhookUrl: {type: string, maxLength: 2048, description: Empty for no webhook}
        webhookSecret: {type: string, maxLength: 256}
        webhookActive: {type: boolean}
    AppUpdate:
      type: object
      properties:
        name: {type: string, minLength: 1, maxLength: 100}
        description: {type: string, maxLength: 1000}
        homepageUrl: {type: string, maxLength: 2000}
        logoUrl: {type: string, maxLength: 2000}
        public: {type: boolean}
        permissions: {$ref: "#/components/schemas/AppPermissions"}
        events:
          type: array
          maxItems: 32
          items: {type: string}
        setupUrl: {type: string, maxLength: 2000}
        callbackUrls:
          type: array
          maxItems: 10
          items: {type: string, maxLength: 2000}
        webhookUrl: {type: string, maxLength: 2048, description: Empty removes the webhook}
        webhookSecret: {type: string, maxLength: 256, description: Empty removes the secret; absent keeps it}
        webhookActive: {type: boolean}
    AppInstallTarget:
      type: object
      required: [kind, name]
      properties:
        kind: {type: string, enum: [user, org]}
        name: {type: string}
        installationId:
          type: integer
          format: int64
          description: Set when the App is installed on this account already
    AppInstall:
      type: object
      required: [account, repositorySelection]
      properties:
        account: {type: string, description: Login of the user or organization}
        repositorySelection: {type: string, enum: [all, selected]}
        repositories:
          type: array
          maxItems: 500
          items: {type: string, maxLength: 200}
    AppInstallResult:
      type: object
      required: [installation]
      properties:
        installation: {$ref: "#/components/schemas/AppInstallation"}
        redirectUrl: {type: string, description: The App's setup URL with installation_id and setup_action}
    AppInstallationUpdate:
      type: object
      required: [repositorySelection]
      properties:
        repositorySelection: {type: string, enum: [all, selected]}
        repositories:
          type: array
          maxItems: 500
          items: {type: string, maxLength: 200}
    AppInstallationRepo:
      type: object
      required: [owner, name, visibility]
      properties:
        owner: {type: string}
        name: {type: string}
        visibility: {type: string}
    AppInstallation:
      type: object
      required: [id, app, account, repositorySelection, permissions, events, pending, createdAt, updatedAt]
      properties:
        id: {type: integer, format: int64}
        app: {$ref: "#/components/schemas/AppInstallationApp"}
        account:
          type: object
          required: [kind, name]
          properties:
            kind: {type: string, enum: [user, org]}
            name: {type: string}
        repositorySelection: {type: string, enum: [all, selected]}
        repositories:
          type: array
          description: Covered repositories (getAppInstallation only)
          items: {$ref: "#/components/schemas/AppInstallationRepo"}
        permissions: {$ref: "#/components/schemas/AppPermissions"}
        events:
          type: array
          items: {type: string}
        pending:
          type: boolean
          description: The App asks for permissions or events not accepted yet
        requestedPermissions: {$ref: "#/components/schemas/AppPermissions"}
        requestedEvents:
          type: array
          items: {type: string}
        suspendedAt: {type: string, format: date-time}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    AppInstallationApp:
      type: object
      required: [id, slug, name, botLogin]
      properties:
        id: {type: integer, format: int64}
        slug: {type: string}
        name: {type: string}
        botLogin: {type: string}
    OAuthAppSummary:
      type: object
      required: [clientId, name, description, homepageUrl, owner]
      properties:
        clientId:
          type: string
        name:
          type: string
        description:
          type: string
        homepageUrl:
          type: string
        logoUrl:
          type: string
        owner: {$ref: "#/components/schemas/OAuthAppOwner"}
    OAuthAuthorization:
      type: object
      required: [id, app, scopes, tokenScopes, tokens, createdAt]
      properties:
        id:
          type: string
          format: uuid
        app: {$ref: "#/components/schemas/OAuthAppSummary"}
        scopes:
          type: array
          description: GitHub-style scopes granted (repo, read:org...)
          items: {type: string}
        tokenScopes:
          type: array
          description: Token scopes of this server they map to
          items: {type: string}
        tokens:
          type: integer
          description: Active tokens issued under the grant
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
    OAuthConsent:
      type: object
      required: [app, redirectUri, requestedScopes, scopes, granted]
      properties:
        app: {$ref: "#/components/schemas/OAuthAppSummary"}
        redirectUri:
          type: string
          description: The callback the browser returns to (redirect_uri or the first registered one)
        requestedScopes:
          type: array
          description: GitHub-style scopes asked for, unknown ones dropped
          items: {type: string}
        scopes:
          type: array
          description: Token scopes of this server the app will receive
          items: {type: string}
        granted:
          type: boolean
          description: The account already authorized these scopes; the page can skip the question
    OAuthConsentDecision:
      type: object
      required: [clientId, approve]
      properties:
        clientId:
          type: string
          maxLength: 100
        redirectUri:
          type: string
          maxLength: 2000
        scope:
          type: string
          maxLength: 1000
        state:
          type: string
          maxLength: 2000
        codeChallenge:
          type: string
          maxLength: 200
        codeChallengeMethod:
          type: string
          maxLength: 20
        approve:
          type: boolean
    OAuthRedirect:
      type: object
      required: [url]
      properties:
        url:
          type: string
    CreatedAccessToken:
      type: object
      required: [token, secret]
      properties:
        token:
          $ref: "#/components/schemas/AccessToken"
        secret:
          type: string
          description: The token (erp_...), shown only once; send it as "Authorization Bearer"
    SshKey:
      type: object
      required: [id, title, type, fingerprint, publicKey, createdAt]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        type:
          type: string
          example: ssh-ed25519
        fingerprint:
          type: string
          example: SHA256:nThbg6kXUpJWGl7E1IGOCspRomTxdCARLviKw6E5SY8
        publicKey:
          type: string
        bits:
          type: integer
        lastUsedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
    SshKeyCreate:
      type: object
      required: [title, key]
      properties:
        title:
          type: string
          maxLength: 100
          description: Empty uses the key comment, or the key type
        key:
          type: string
          maxLength: 16384
    GpgKey:
      type: object
      required: [id, keyId, fingerprint, subkeyIds, emails, verifiedEmails, createdAt]
      properties:
        id:
          type: string
          format: uuid
        keyId:
          type: string
          example: 3AA5C34371567BD2
        fingerprint:
          type: string
        subkeyIds:
          type: array
          items:
            type: string
        emails:
          type: array
          items:
            type: string
        verifiedEmails:
          type: array
          description: The emails that are verified addresses of the account
          items:
            type: string
        expiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
    GpgKeyCreate:
      type: object
      required: [armoredKey]
      properties:
        armoredKey:
          type: string
          maxLength: 65536
    RegisterRequest:
      type: object
      required: [username, email, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 39
          description: Letters, digits and single inner hyphens; shared namespace with organizations
        email:
          type: string
          minLength: 3
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 1024
        inviteToken:
          type: string
          maxLength: 128
          description: Required when registration is "invite"
        locale:
          type: string
          enum: [en, it]
    RegisterAccepted:
      type: object
      required: [verificationRequired]
      properties:
        verificationRequired:
          type: boolean
          description: True when the address must be confirmed by mail before signing in
    LoginRequest:
      type: object
      required: [login, password]
      properties:
        login:
          type: string
          minLength: 1
          maxLength: 254
          description: Username or email address
        password:
          type: string
          minLength: 1
          maxLength: 1024
    TokenRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 128
    EmailRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          minLength: 3
          maxLength: 254
    ResetPasswordRequest:
      type: object
      required: [token, password]
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 128
        password:
          type: string
          minLength: 1
          maxLength: 1024
    InviteRequest:
      type: object
      properties:
        email:
          type: string
          maxLength: 254
          description: When set, only this address can use the invitation
    AdminUser:
      type: object
      required: [id, username, displayName, role, has2fa, isBot, createdAt]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        displayName:
          type: string
        avatarUrl:
          type: string
          description: Profile image URL, omitted when unset
        isBot:
          type: boolean
          description: A bot account (login ending in "[bot]"); bots cannot sign in and cannot be changed
        email:
          type: string
          description: Primary address
        role:
          type: string
          enum: [admin, user, restricted]
        suspendedAt:
          type: string
          format: date-time
        has2fa:
          type: boolean
        createdAt:
          type: string
          format: date-time
        lastActivity:
          type: string
          format: date-time
          description: Last use of a session
    AdminUserCounts:
      type: object
      description: Unfiltered counts for the filter shortcuts
      required: [all, admins, suspended, without2fa, bots]
      properties:
        all:
          type: integer
          format: int64
        admins:
          type: integer
          format: int64
        suspended:
          type: integer
          format: int64
        without2fa:
          type: integer
          format: int64
          description: People (not bots) without a second factor
        bots:
          type: integer
          format: int64
    AdminOverview:
      type: object
      required: [range, start, stepSeconds, requests, requestsNow, jobs, disk, services, counts, checkedAt]
      properties:
        range:
          type: string
          enum: [24h, 7d]
        start:
          type: string
          format: date-time
          description: Start of the first bucket of requests and jobs
        stepSeconds:
          type: integer
          description: Width of one bucket
        requests:
          type: array
          description: Mean requests per minute in each bucket, oldest first
          items:
            type: number
            format: double
        requestsNow:
          type: integer
          format: int64
          description: Requests in the last full minute
        jobs:
          type: array
          description: Completed Actions jobs in each bucket, oldest first
          items:
            $ref: "#/components/schemas/AdminJobBucket"
        disk:
          type: array
          description: Samples of the local disk in the range, oldest first
          items:
            $ref: "#/components/schemas/AdminDiskSample"
        diskTarget:
          type: string
          description: Local storage target whose disk is sampled
        services:
          type: array
          items:
            $ref: "#/components/schemas/AdminService"
        counts:
          $ref: "#/components/schemas/AdminCounts"
        checkedAt:
          type: string
          format: date-time
    AdminJobBucket:
      type: object
      required: [success, failure]
      properties:
        success:
          type: integer
          format: int64
        failure:
          type: integer
          format: int64
          description: Failed or timed out
    AdminDiskSample:
      type: object
      required: [at, used, total]
      properties:
        at:
          type: string
          format: date-time
        used:
          type: integer
          format: int64
        total:
          type: integer
          format: int64
    AdminService:
      type: object
      description: State of one subsystem; the fields set depend on the id
      required: [id, status]
      properties:
        id:
          type: string
          enum: [server, database, storage, hotCache, runners, email, jobs]
        status:
          type: string
          enum: [ok, warn, err, off]
        version:
          type: string
        uptimeSeconds:
          type: integer
          format: int64
        bytes:
          type: integer
          format: int64
          description: Database size or hot cache usage
        budget:
          type: integer
          format: int64
          description: Hot cache budget, 0 when unlimited
        warnings:
          type: integer
        online:
          type: integer
        total:
          type: integer
        queued:
          type: integer
          format: int64
        host:
          type: string
          description: SMTP relay
    AdminCounts:
      type: object
      required: [users, orgs, invites, runners]
      properties:
        users:
          type: integer
          format: int64
        orgs:
          type: integer
          format: int64
        invites:
          type: integer
          format: int64
          description: Pending invitations
        runners:
          type: integer
    AdminUserPage:
      type: object
      required: [items, total, counts]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminUser"
        counts:
          $ref: "#/components/schemas/AdminUserCounts"
        total:
          type: integer
          format: int64
    AdminUserUpdate:
      type: object
      properties:
        role:
          type: string
          enum: [admin, user, restricted]
        suspended:
          type: boolean
    AdminInvite:
      type: object
      required: [id, status, createdAt, expiresAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        status:
          type: string
          enum: [pending, used, expired]
        createdBy:
          type: string
          description: Username of the creator
        usedBy:
          type: string
          description: Username of the account created with it
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        usedAt:
          type: string
          format: date-time
    AdminInvitePage:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminInvite"
        total:
          type: integer
          format: int64
    InstanceSetting:
      type: object
      required: [key, value, fileValue, source, locked, restartPending]
      properties:
        key:
          type: string
          example: auth.require_2fa
        value:
          description: Value the next start runs with (string, boolean, integer or string list)
        fileValue:
          description: Value from config.toml, the environment or the default, without the override
        source:
          type: string
          enum: [default, file, db, env]
        locked:
          type: boolean
          description: Listed in [settings] locked or set by an EREPO_ variable
        restartPending:
          type: boolean
          description: The running process uses another value
    StorageJobStarted:
      type: object
      required: [objects]
      properties:
        objects: {type: integer, format: int64, description: Objects the job will copy or check}
    AvailableRelease:
      type: object
      required: [version, name, url, notes, publishedAt]
      properties:
        version: {type: string, description: "x.y.z"}
        name: {type: string}
        url: {type: string, description: GitHub page of the release}
        notes: {type: string, description: Release notes (Markdown), truncated at 16 KiB}
        publishedAt: {type: string, format: date-time}
    Updater:
      type: object
      required: [available, state, version, from, step, log, pending]
      properties:
        available: {type: boolean, description: The updater container is running}
        state: {type: string, enum: ["", idle, running, done, failed], description: "Empty when it never ran"}
        version: {type: string, description: Target of the last update}
        from: {type: string}
        startedAt: {type: string, format: date-time, nullable: true}
        finishedAt: {type: string, format: date-time, nullable: true}
        step: {type: string, description: "Last step reached: backup, fetch, pull, up or done"}
        log:
          type: array
          items: {type: string}
          description: End of the log of the last update
        pending: {type: string, description: Version requested and not yet taken by the updater}
    UpdateStatus:
      type: object
      required: [current, release, check, repository, checkError, newer, auto, deploy, deployDir, updater, canApply, command]
      properties:
        current: {type: string, description: Version of the running server}
        release: {type: boolean, description: "current is a release version, not a development build"}
        check: {type: boolean, description: updates.check}
        repository: {type: string, description: GitHub owner/name of the releases}
        checkedAt: {type: string, format: date-time, nullable: true}
        checkError: {type: string}
        latest:
          $ref: "#/components/schemas/AvailableRelease"
        newer:
          type: array
          items:
            $ref: "#/components/schemas/AvailableRelease"
          description: Releases newer than current, newest first
        auto: {type: boolean, description: Automatic updates are on}
        deploy: {type: string, enum: ["", docker, native]}
        deployDir: {type: string, description: Host folder of compose.yaml (Docker)}
        updater:
          $ref: "#/components/schemas/Updater"
        canApply: {type: boolean, description: An update can be started from the web now}
        command: {type: string, description: Terminal command that updates the instance by hand; empty when the deployment is unknown}
    InstanceSettings:
      type: object
      required: [settings, restartRequired]
      properties:
        settings:
          type: array
          items:
            $ref: "#/components/schemas/InstanceSetting"
        restartRequired:
          type: boolean
    InstanceSettingsUpdate:
      type: object
      required: [values]
      properties:
        values:
          type: object
          minProperties: 1
          additionalProperties: true
    FieldProblem:
      type: object
      required: [path, msg]
      properties:
        path:
          type: string
        msg:
          type: string
    ValidationProblem:
      type: object
      required: [type, title, status, errors]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        errors:
          type: array
          items:
            $ref: "#/components/schemas/FieldProblem"
    Invite:
      type: object
      required: [id, token, expiresAt]
      properties:
        id:
          type: string
          format: uuid
        token:
          type: string
          description: Shown only once
        email:
          type: string
        expiresAt:
          type: string
          format: date-time
    User:
      type: object
      required: [id, username, displayName, role, locale, emailVerified, createdAt]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        displayName:
          type: string
        role:
          type: string
          enum: [admin, user, restricted]
        locale:
          type: string
          enum: [en, it]
        avatarUrl:
          type: string
          description: Absolute https URL of the avatar; empty when unset
        email:
          type: string
          description: Primary email address
        emailVerified:
          type: boolean
        createdAt:
          type: string
          format: date-time
    ProfileUpdate:
      type: object
      required: [displayName, locale]
      properties:
        displayName:
          type: string
          maxLength: 100
        avatarUrl:
          type: string
          maxLength: 2048
          description: Absolute https URL, or empty to clear; the current value (for example an uploaded avatar) is accepted as it is
        locale:
          type: string
          enum: [en, it]
    PasswordChange:
      type: object
      required: [newPassword]
      properties:
        currentPassword:
          type: string
          maxLength: 1024
        newPassword:
          type: string
          minLength: 1
          maxLength: 1024
    SessionInfo:
      type: object
      required: [id, current, ip, userAgent, createdAt, lastSeenAt, expiresAt]
      properties:
        id:
          type: string
          format: uuid
        current:
          type: boolean
        ip:
          type: string
        userAgent:
          type: string
        createdAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
    EmailAddress:
      type: object
      required: [id, address, primary, verified, createdAt]
      properties:
        id:
          type: string
          format: uuid
        address:
          type: string
        primary:
          type: boolean
        verified:
          type: boolean
        createdAt:
          type: string
          format: date-time
    StorageStatus:
      type: object
      required: [targets, policies, caches, warnings]
      properties:
        targets:
          type: array
          items:
            $ref: "#/components/schemas/StorageTarget"
        policies:
          type: array
          items:
            $ref: "#/components/schemas/StoragePolicy"
        caches:
          type: array
          items:
            $ref: "#/components/schemas/StorageCache"
        warnings:
          type: array
          description: Permanent configuration warnings, such as storage_local_only
          items:
            $ref: "#/components/schemas/StorageWarning"
    StorageTarget:
      type: object
      required: [name, kind, encrypted, roles, caps]
      properties:
        name:
          type: string
        kind:
          type: string
          enum: [local, s3, sftp, webdav]
        encrypted:
          type: boolean
        roles:
          type: array
          description: Uses of this target, as primary:<policy>, replica:<policy> or cache:<policy>
          items:
            type: string
        caps:
          $ref: "#/components/schemas/StorageCaps"
        disk:
          $ref: "#/components/schemas/StorageDisk"
    StorageDisk:
      type: object
      description: Space of the file system of a local target
      required: [used, total]
      properties:
        used:
          type: integer
          format: int64
        total:
          type: integer
          format: int64
    StorageCaps:
      type: object
      required: [range, presign, multipart, atomicRename, conditionalPut, maxConns]
      properties:
        range:
          type: boolean
        presign:
          type: boolean
        multipart:
          type: boolean
        atomicRename:
          type: boolean
        conditionalPut:
          type: boolean
        maxConns:
          type: integer
          description: Connection limit, 0 means unlimited
    StoragePolicy:
      type: object
      required: [name, primary, replicas, cacheTtlSeconds, cacheShare, durability, objects, bytes, pendingReplicas, errors]
      properties:
        name:
          type: string
          description: Data type, such as git, lfs or registry
        primary:
          type: string
        replicas:
          type: array
          items:
            type: string
        cache:
          type: string
        cacheTtlSeconds:
          type: integer
          format: int64
        cacheShare:
          type: number
          format: double
        durability:
          type: string
        objects:
          type: integer
          format: int64
        bytes:
          type: integer
          format: int64
        pendingReplicas:
          type: integer
          format: int64
        errors:
          type: integer
          format: int64
          description: Objects whose last replication or verification failed
    StorageCache:
      type: object
      required: [target, budget, used, entries, highWatermark, lowWatermark, usedBy]
      properties:
        target:
          type: string
        budget:
          type: integer
          format: int64
          description: Budget in bytes, 0 means unlimited
        used:
          type: integer
          format: int64
        entries:
          type: integer
        highWatermark:
          type: number
          format: double
        lowWatermark:
          type: number
          format: double
        usedBy:
          type: object
          description: Bytes used per data type
          additionalProperties:
            type: integer
            format: int64
    StorageWarning:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum: [storage_not_configured, storage_local_only, storage_policy_local]
        policy:
          type: string
        message:
          type: string
    StorageConfig:
      type: object
      required: [targets, policies, hotCache, secretsAvailable, restartRequired, fallback]
      properties:
        hotCache:
          $ref: "#/components/schemas/StorageHotCache"
        fallback:
          type: boolean
          description: The stored configuration could not be applied at start and the server runs with config.toml only
        fallbackCause:
          type: string
          description: Why the stored configuration was not applied. Never contains credentials.
        targets:
          type: array
          items:
            $ref: "#/components/schemas/StorageTargetConfig"
        policies:
          type: array
          items:
            $ref: "#/components/schemas/StoragePolicyConfig"
        secretsAvailable:
          type: boolean
          description: False when no master key is available, so credentials cannot be saved
        restartRequired:
          type: boolean
          description: Saved changes apply the next time the server starts
    StorageTargetConfig:
      type: object
      description: A storage target. Credentials are never returned, only whether each one is stored.
      required: [name, kind, source, encrypt, pathStyle, usedBy, restartPending, removedAfterRestart, objects, locked, hasAccessKey, hasSecretKey, hasPrivateKey, hasPassphrase, hasKnownHosts, hasPassword]
      properties:
        name:
          type: string
        kind:
          type: string
          enum: [local, s3, sftp, webdav]
        source:
          type: string
          enum: [file, database]
          description: file targets come from config.toml and are read-only
        encrypt:
          type: boolean
        path:
          type: string
          description: Directory of a local target
        endpoint:
          type: string
        bucket:
          type: string
        region:
          type: string
        prefix:
          type: string
        pathStyle:
          type: boolean
        host:
          type: string
        port:
          type: integer
        user:
          type: string
        root:
          type: string
        maxConns:
          type: integer
        hasAccessKey:
          type: boolean
        hasSecretKey:
          type: boolean
        hasPrivateKey:
          type: boolean
        hasPassphrase:
          type: boolean
        hasKnownHosts:
          type: boolean
        hasPassword:
          type: boolean
          description: An SFTP password is stored (instead of or besides the private key)
        usedBy:
          type: array
          description: Uses of this target, as primary:<policy>, replica:<policy> or cache:<policy>
          items:
            type: string
        restartPending:
          type: boolean
          description: The saved definition differs from the one the server runs with
        removedAfterRestart:
          type: boolean
          description: The target was deleted and stops being used after the next restart
        objects:
          type: integer
          format: int64
          description: Stored objects that live on this target, as primary or as a confirmed replica
        locked:
          type: boolean
          description: The target holds objects, so its location and account fields cannot change (credentials can still be replaced)
    StoragePolicyConfig:
      type: object
      required: [name, source, primary, runningPrimary, replicas, cacheAuto, cacheTtlSeconds, cacheTtlOverrideSeconds, filePrimary, fileReplicas, objects, primaryLocked, restartPending]
      properties:
        name:
          type: string
        source:
          type: string
          enum: [file, database]
        primary:
          type: string
        runningPrimary:
          type: string
          description: The primary the server runs with now. Objects are stored under it, so it is the only one allowed while the policy holds objects.
        replicas:
          type: array
          items:
            type: string
        cache:
          type: string
          description: Configured cache, a local target or "none"; missing means the automatic hot cache
        effectiveCache:
          type: string
          description: Cache the next start uses; missing when the data type has none
        cacheAuto:
          type: boolean
          description: The hot cache chose effectiveCache automatically
        cacheTtlSeconds:
          type: integer
          format: int64
          description: Idle time after which cached data moves back to the remote storage, as the next start uses it; 0 means never
        cacheTtlOverrideSeconds:
          type: integer
          format: int64
          description: TTL set for this data type; 0 uses the hot cache setting
        filePrimary:
          type: string
        fileReplicas:
          type: array
          items:
            type: string
        fileCache:
          type: string
        objects:
          type: integer
          format: int64
        primaryLocked:
          type: boolean
          description: The policy holds objects, so its primary cannot change
        restartPending:
          type: boolean
    StorageTargetInput:
      type: object
      description: |
        Definition of an S3-compatible or SFTP target. Fields of the other
        kind must be left out. Credentials are optional on update: an empty
        one keeps the stored value.
      required: [name, kind]
      properties:
        name:
          type: string
          maxLength: 63
          pattern: "^[a-z0-9][a-z0-9_-]{0,62}$"
        kind:
          type: string
          enum: [s3, sftp]
        encrypt:
          type: boolean
        endpoint:
          type: string
          maxLength: 512
        bucket:
          type: string
          maxLength: 63
        region:
          type: string
          maxLength: 63
        prefix:
          type: string
          maxLength: 256
        pathStyle:
          type: boolean
        host:
          type: string
          maxLength: 253
        port:
          type: integer
        user:
          type: string
          maxLength: 64
        root:
          type: string
          maxLength: 255
        maxConns:
          type: integer
        secrets:
          $ref: "#/components/schemas/StorageSecretsInput"
    StorageHostKeyScan:
      type: object
      required: [host]
      properties:
        host:
          type: string
          maxLength: 253
        port:
          type: integer
          description: Default 22
    StorageHostKeys:
      type: object
      required: [knownHosts, keys]
      properties:
        knownHosts:
          type: string
          description: The keys as known_hosts lines, ready for the knownHosts credential
        keys:
          type: array
          items:
            type: object
            required: [type, fingerprint]
            properties:
              type:
                type: string
              fingerprint:
                type: string
                description: SHA256 fingerprint, as printed by ssh-keygen -l
    StorageSecretsInput:
      type: object
      description: Write-only credentials, sealed with the master key. Never returned.
      properties:
        accessKey:
          type: string
          maxLength: 512
        secretKey:
          type: string
          maxLength: 512
        privateKey:
          type: string
          maxLength: 16384
        passphrase:
          type: string
          maxLength: 512
        knownHosts:
          type: string
          maxLength: 65536
        password:
          type: string
          maxLength: 512
          description: |
            SFTP account password, an alternative to privateKey. Sending only
            a password replaces a stored private key; sending only a private
            key replaces a stored password.
    StoragePolicyInput:
      type: object
      required: [primary, replicas]
      properties:
        primary:
          type: string
          maxLength: 63
        replicas:
          type: array
          maxItems: 32
          items:
            type: string
            maxLength: 63
        cache:
          type: string
          maxLength: 63
          description: A local target, "none" to disable the cache of this data type, or empty for the automatic hot cache
        cacheTtlSeconds:
          type: integer
          format: int64
          minimum: 0
          description: Idle TTL of this data type in seconds; 0 uses the hot cache setting. Missing keeps the value of config.toml.
    StorageHotCache:
      type: object
      required: [enabled, ttlSeconds, source, defaults, maxBytes, largeRepoBytes, defaultMaxBytes, defaultLargeRepoBytes]
      properties:
        maxBytes:
          type: integer
          format: int64
          description: Size limit of the cache on the local disk (repositories and cached files); 0 uses defaultMaxBytes
        largeRepoBytes:
          type: integer
          format: int64
          description: Repositories larger than this are fetched from the remote storage for each use and never kept; 0 uses defaultLargeRepoBytes
        defaultMaxBytes:
          type: integer
          format: int64
        defaultLargeRepoBytes:
          type: integer
          format: int64
        enabled:
          type: boolean
          description: Data of remote targets is cached on the local disk automatically
        ttlSeconds:
          type: integer
          format: int64
          description: Idle time after which data moves back to the remote storage; 0 uses defaults
        source:
          type: string
          enum: [file, database]
        defaults:
          type: object
          description: Idle TTL in seconds per data type used when ttlSeconds is 0
          additionalProperties:
            type: integer
            format: int64
    StorageHotCacheInput:
      type: object
      required: [enabled, ttlSeconds]
      properties:
        enabled:
          type: boolean
        ttlSeconds:
          type: integer
          format: int64
          minimum: 0
          description: 0 for the per data type defaults, otherwise at least 3600
        maxBytes:
          type: integer
          format: int64
          minimum: 0
          description: Size limit of the cache; 0 (or missing) for the default, otherwise at least 1 GiB
        largeRepoBytes:
          type: integer
          format: int64
          minimum: 0
          description: Size above which repositories are not kept in the cache; 0 (or missing) for the default
    HotRepoPage:
      type: object
      required: [items, total, summary]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/HotRepo"
        total:
          type: integer
          format: int64
        summary:
          $ref: "#/components/schemas/HotRepoSummary"
    HotRepo:
      type: object
      required: [id, owner, name, fullName, state, pinned, sizeBytes, totalSizeBytes, lastAccessAt, ephemeral]
      properties:
        ephemeral:
          type: boolean
          description: Not kept in the cache (larger than the limit, or the cache is disabled); evicted right after use
        id:
          type: string
          format: uuid
        owner:
          type: string
        name:
          type: string
        fullName:
          type: string
        state:
          type: string
          enum: [hot, cold, hydrating, evicting, degraded]
        pinned:
          type: boolean
        sizeBytes:
          type: integer
          format: int64
          description: Recorded Git object bytes, excluding auxiliary storage and replica copies
        totalSizeBytes:
          $ref: "#/components/schemas/RepoTotalSizeBytes"
        lastAccessAt:
          type: string
          format: date-time
          description: Last read or write (fetch, clone, push, browsing), recorded at most once a minute
        evictAt:
          type: string
          format: date-time
          description: When the idle TTL moves the repository to the remote storage
    HotRepoSummary:
      type: object
      required: [repos, pinned, bytes, totalGitBytes, budget, highWatermark, lowWatermark, ttlSeconds, remote, primary, replicas, cacheEnabled, largeRepoBytes]
      properties:
        primary:
          type: string
          description: Target holding the remote journal of the repositories; empty when there is none
        replicas:
          type: array
          items: {type: string}
          description: Targets holding copies of the remote journal
        cacheEnabled:
          type: boolean
        largeRepoBytes:
          type: integer
          format: int64
          description: Repositories above this size are evicted right after use
        repos:
          type: integer
          format: int64
          description: Hot repositories
        pinned:
          type: integer
          format: int64
        bytes:
          type: integer
          format: int64
          description: Recorded Git object bytes of hot repositories, not cache disk occupancy
        totalGitBytes:
          type: integer
          format: int64
          description: Recorded Git object bytes across all repositories, counted once per repository regardless of storage state or replication
        budget:
          type: integer
          format: int64
          description: Space of the hot repositories in bytes, 0 means no limit
        highWatermark:
          type: number
          format: double
        lowWatermark:
          type: number
          format: double
        ttlSeconds:
          type: integer
          format: int64
          description: Idle TTL of the repositories, 0 means none
        remote:
          type: boolean
          description: A remote storage holds the repositories, so idle ones can leave the local disk
    AvatarStorage:
      type: object
      required: [target, publicUrl, localTarget, targets]
      properties:
        target:
          type: string
          description: Chosen target; empty means the local storage
        publicUrl:
          type: string
          description: CDN base URL; empty when avatars are served by this server
        localTarget:
          type: string
          description: Local target used when target is empty; empty when the instance has none
        targets:
          type: array
          description: Running targets that can hold avatars
          items:
            $ref: "#/components/schemas/AvatarStorageTarget"
    AvatarStorageTarget:
      type: object
      required: [name, kind, encrypted]
      properties:
        name: {type: string}
        kind: {type: string}
        encrypted:
          type: boolean
          description: Objects are encrypted at rest, so a CDN cannot serve them from the bucket
    AvatarStorageInput:
      type: object
      required: [target, publicUrl]
      properties:
        target:
          type: string
          maxLength: 63
        publicUrl:
          type: string
          maxLength: 512
    RepoTiering:
      type: object
      required: [state, pinned, sizeBytes, manifestSeq]
      properties:
        state:
          type: string
          enum: [hot, cold, hydrating, evicting, degraded]
        pinned:
          type: boolean
        sizeBytes:
          type: integer
          format: int64
        manifestSeq:
          type: integer
          format: int64
          description: Last pack journal sequence recorded for the repository.
    StorageCheckResult:
      type: object
      required: [target, ok, durationMs, steps]
      properties:
        target:
          type: string
        ok:
          type: boolean
        durationMs:
          type: integer
          format: int64
        steps:
          type: array
          items:
            $ref: "#/components/schemas/StorageCheckStep"
    StorageCheckStep:
      type: object
      required: [name, ok, durationMs]
      properties:
        name:
          type: string
          enum: [put, stat, get, range, list, delete]
        ok:
          type: boolean
        durationMs:
          type: integer
          format: int64
        error:
          type: string
    Meta:
      type: object
      required: [name, version, instanceId, publicUrl, registration]
      properties:
        name:
          type: string
          example: ErvisioRepo
        version:
          type: string
          example: 0.1.0
        commit:
          type: string
          description: VCS revision the binary was built from, if known
        instanceId:
          type: string
          format: uuid
          description: Stable UUID v7 generated on first start and stored in the settings table
        publicUrl:
          type: string
          format: uri
        registration:
          type: string
          enum: [open, invite, closed]
        defaultLayout:
          type: string
          enum: [console, foglio, corsie]
          description: Shell shown to users without a layout preference
        appRegistration:
          type: string
          enum: [everyone, org_owners, admins]
          description: Who may register OAuth apps and Apps (security.app_registration)
    MfaChallenge:
      type: object
      required: [methods, enrollmentRequired, expiresAt]
      description: |
        A login waiting for its second factor. The pending state lives in
        the HttpOnly erepo_mfa cookie (__Host-erepo_mfa on https), never in
        a session cookie.
      properties:
        methods:
          type: array
          items:
            type: string
            enum: [totp, webauthn, recovery]
        enrollmentRequired:
          type: boolean
          description: Policy requires a second factor and the account has none; set up an authenticator app to continue
        expiresAt:
          type: string
          format: date-time
    CodeRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 64
    ReauthRequest:
      type: object
      description: Either the password or a current authenticator app or recovery code
      properties:
        password:
          type: string
          maxLength: 1024
        code:
          type: string
          maxLength: 64
    TotpSetup:
      type: object
      required: [secret, uri]
      properties:
        secret:
          type: string
          description: Base32 secret for manual entry
        uri:
          type: string
          description: otpauth:// URI for a QR code
    RecoveryCodes:
      type: object
      required: [codes]
      properties:
        codes:
          type: array
          description: Shown only once; empty when existing codes were kept
          items:
            type: string
    MfaEnrollResult:
      type: object
      required: [user, recoveryCodes]
      properties:
        user:
          $ref: "#/components/schemas/User"
        recoveryCodes:
          type: array
          items:
            type: string
    WebAuthnOptions:
      type: object
      required: [options]
      properties:
        options:
          type: object
          additionalProperties: true
          description: PublicKeyCredentialRequestOptions wrapper ({publicKey}), binary fields in base64url
    WebAuthnCredentialRequest:
      type: object
      required: [credential]
      properties:
        credential:
          type: object
          additionalProperties: true
          description: PublicKeyCredential JSON (toJSON), binary fields in base64url
    PasskeyChallenge:
      type: object
      required: [challenge, options]
      properties:
        challenge:
          type: string
          description: Ceremony token to send back with the response
        options:
          type: object
          additionalProperties: true
    PasskeyLoginRequest:
      type: object
      required: [challenge, credential]
      properties:
        challenge:
          type: string
          minLength: 1
          maxLength: 128
        credential:
          type: object
          additionalProperties: true
    PasskeyRegisterRequest:
      type: object
      required: [challenge, name, credential]
      properties:
        challenge:
          type: string
          minLength: 1
          maxLength: 128
        name:
          type: string
          minLength: 1
          maxLength: 64
        credential:
          type: object
          additionalProperties: true
    Passkey:
      type: object
      required: [id, name, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
    SecurityStatus:
      type: object
      required: [totp, totpPending, passkeys, recoveryCodesLeft, recoveryCodesTotal, required, webauthnAvailable]
      properties:
        totp:
          type: boolean
          description: An authenticator app is enabled
        totpPending:
          type: boolean
          description: An authenticator app setup waits for its first code
        passkeys:
          type: array
          items:
            $ref: "#/components/schemas/Passkey"
        recoveryCodesLeft:
          type: integer
        recoveryCodesTotal:
          type: integer
        required:
          type: boolean
          description: Policy (instance or organization) requires a second factor
        webauthnAvailable:
          type: boolean
    Visibility:
      type: string
      enum: [public, internal, private]
    RepoTotalSizeBytes:
      type: integer
      format: int64
      minimum: 0
      description: |
        Recorded logical payload bytes for this repository: Git objects, linked LFS objects,
        release assets, issue attachments, and retained Actions artifacts, logs and build caches.
        Excludes in-flight uploads, replicas, storage caches, shared avatars and database overhead.
    Repo:
      type: object
      required: [id, owner, ownerKind, name, fullName, description, visibility, defaultBranch, storageState,
        totalSizeBytes, starsCount, starred, permission, avatarUrl, ownerAvatarUrl, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        owner:
          type: string
        ownerKind:
          type: string
          enum: [user, org]
        name:
          type: string
        fullName:
          type: string
          description: owner/name
        description:
          type: string
        visibility:
          $ref: "#/components/schemas/Visibility"
        defaultBranch:
          type: string
        storageState:
          type: string
          enum: [hot, cold, hydrating, evicting, degraded]
          description: |
            Where the git data is; cold repositories are restored on first
            access. Storage is instance infrastructure: only instance admins
            see the real state, other callers always get "hot".
        sizeBytes:
          type: integer
          format: int64
          description: Recorded Git object bytes, present only for instance administrators
        totalSizeBytes:
          $ref: "#/components/schemas/RepoTotalSizeBytes"
        starsCount:
          type: integer
          description: Number of users who starred the repository
        starred:
          type: boolean
          description: Whether the caller starred the repository; false when anonymous
        avatarUrl:
          type: string
          description: Absolute https URL of the repository image; empty when unset
        ownerAvatarUrl:
          type: string
          description: Absolute https URL of the avatar of the owner (user or organization); empty when unset
        openIssuesCount:
          type: integer
          format: int64
          description: Open issues; only set by getRepo
        openPullsCount:
          type: integer
          format: int64
          description: Open pull requests; only set by getRepo
        permission:
          $ref: "#/components/schemas/Permission"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    StarredRepo:
      type: object
      required: [repo, starredAt]
      properties:
        repo:
          $ref: "#/components/schemas/Repo"
        starredAt:
          type: string
          format: date-time
    Stargazer:
      type: object
      required: [username, displayName, avatarUrl, starredAt]
      properties:
        username: {type: string}
        displayName: {type: string}
        avatarUrl: {type: string, description: Absolute https URL of the avatar; empty when unset}
        starredAt: {type: string, format: date-time}
    RepoCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 100
        description:
          type: string
          maxLength: 1000
        visibility:
          $ref: "#/components/schemas/Visibility"
        defaultBranch:
          type: string
          maxLength: 255
        autoInit:
          type: boolean
          description: Commit a README (and the chosen .gitignore and license) as the first commit
        gitignoreTemplate:
          type: string
          maxLength: 64
          description: Name of a .gitignore template (implies autoInit)
        licenseTemplate:
          type: string
          maxLength: 64
          description: Key of a license template (implies autoInit)
    RepoUpdate:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
        description:
          type: string
          maxLength: 1000
        visibility:
          $ref: "#/components/schemas/Visibility"
        defaultBranch:
          type: string
          maxLength: 255
    RepoTransfer:
      type: object
      required: [newOwner]
      properties:
        newOwner:
          type: string
          maxLength: 39
        newName:
          type: string
          maxLength: 100
          description: Defaults to the current name
    UserSummary:
      type: object
      required: [username, displayName, avatarUrl]
      properties:
        username: {type: string}
        displayName: {type: string}
        avatarUrl: {type: string, description: Absolute https URL of the avatar; empty when unset}
    UserProfile:
      type: object
      required: [username, kind, displayName, avatarUrl, createdAt]
      properties:
        username: {type: string}
        kind:
          type: string
          enum: [user, bot]
          description: A bot is an automation account (login ending in "[bot]") nobody can sign in as
        description: {type: string, description: What the bot does; empty for users}
        displayName: {type: string}
        avatarUrl: {type: string, description: Absolute https URL of the avatar; empty when unset}
        createdAt: {type: string, format: date-time}
        instanceAdmin: {type: boolean, description: The user administers this instance}
        bio: {type: string}
        company: {type: string}
        location: {type: string}
        website: {type: string}
        socialLinks:
          type: array
          items: {type: string}
        timezone: {type: string, description: IANA time zone for the local time; absent when hidden}
        publicEmail: {type: string}
        orgs:
          type: array
          description: Organizations of the user that the caller can see
          items:
            $ref: "#/components/schemas/OrgSummary"
    OrgSummary:
      type: object
      required: [name, displayName, avatarUrl]
      properties:
        name: {type: string}
        displayName: {type: string}
        avatarUrl: {type: string, description: Absolute https URL of the avatar image; empty when unset}
    ProfileDetails:
      type: object
      required: [bio, company, location, website, socialLinks, timezone, publicEmail]
      properties:
        bio: {type: string, maxLength: 640}
        company: {type: string, maxLength: 100}
        location: {type: string, maxLength: 100}
        website:
          type: string
          maxLength: 255
          description: Absolute http(s) URL, or empty
        socialLinks:
          type: array
          maxItems: 4
          items: {type: string, maxLength: 255, description: Absolute http(s) URL}
        timezone:
          type: string
          maxLength: 64
          description: IANA time zone shown as local time, or empty to hide it
        publicEmail:
          type: string
          maxLength: 254
          description: A verified address of the account shown on the profile, or empty
        orgOrder:
          type: array
          maxItems: 100
          description: |
            Names of organizations in the order the profile shows them; the
            others follow alphabetically. Only organizations the user belongs
            to are kept. Omitted in an update, the saved order stays.
          items: {type: string, maxLength: 39}
    ContributionCalendar:
      type: object
      required: [from, to, total, days, years]
      properties:
        from: {type: string, format: date, description: First day (UTC) of the range}
        to: {type: string, format: date, description: Last day (UTC) of the range}
        total: {type: integer, format: int64}
        days:
          type: array
          description: Days with at least one contribution, oldest first
          items:
            $ref: "#/components/schemas/ContributionDay"
        years:
          type: array
          description: Years with contributions, newest first
          items: {type: integer}
    ContributionDay:
      type: object
      required: [date, count]
      properties:
        date: {type: string, format: date}
        count: {type: integer, format: int64}
    RepoWeeklyActivity:
      type: object
      required: [repoId, weeks]
      properties:
        repoId: {type: string, format: uuid}
        weeks:
          type: array
          description: Events per week, oldest first; the last item is the current week
          items: {type: integer, format: int64}
    OrgLanguages:
      type: object
      required: [totalBytes, items, repos]
      properties:
        totalBytes: {type: integer, format: int64}
        items:
          type: array
          description: Most bytes first
          items: {$ref: "#/components/schemas/Language"}
        repos:
          type: array
          description: Main language of each counted repository
          items:
            $ref: "#/components/schemas/RepoLanguage"
    RepoLanguage:
      type: object
      required: [name, language, color]
      properties:
        name: {type: string, description: Repository name}
        language: {type: string}
        color: {type: string, description: "Colour as #rrggbb"}
    RepoCollaborator:
      type: object
      required: [username, displayName, permission, since]
      properties:
        username:
          type: string
        displayName:
          type: string
        permission:
          $ref: "#/components/schemas/Permission"
        since:
          type: string
          format: date-time
    RepoPermissionRequest:
      type: object
      required: [permission]
      properties:
        permission:
          type: string
          enum: [read, triage, write, maintain, admin]
    OrgRole:
      type: string
      enum: [owner, admin, member]
    Permission:
      type: string
      enum: [none, read, triage, write, maintain, admin]
    Org:
      type: object
      required: [id, name, displayName, description, basePermission, require2fa, verified, avatarUrl, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        displayName:
          type: string
        description:
          type: string
        basePermission:
          $ref: "#/components/schemas/Permission"
        require2fa:
          type: boolean
          description: Members must have a second factor; enforced from their next sign-in.
        verified:
          type: boolean
        role:
          $ref: "#/components/schemas/OrgRole"
        avatarUrl:
          type: string
          description: Absolute https URL of the avatar image; empty when unset
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    OrgCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 39
        displayName:
          type: string
          maxLength: 100
        description:
          type: string
          maxLength: 1000
    OrgUpdate:
      type: object
      properties:
        displayName:
          type: string
          maxLength: 100
        description:
          type: string
          maxLength: 1000
        basePermission:
          $ref: "#/components/schemas/Permission"
        require2fa:
          type: boolean
          description: Owners only. Requires a second factor from every member.
    OrgMember:
      type: object
      required: [username, displayName, role, since]
      properties:
        username:
          type: string
        displayName:
          type: string
        role:
          $ref: "#/components/schemas/OrgRole"
        since:
          type: string
          format: date-time
        avatarUrl: {type: string, description: Absolute https URL of the avatar; empty when unset}
    OrgRoleRequest:
      type: object
      required: [role]
      properties:
        role:
          $ref: "#/components/schemas/OrgRole"
    Team:
      type: object
      required: [id, name, description, members, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        members:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    TeamCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 39
        description:
          type: string
          maxLength: 1000
    TeamUpdate:
      type: object
      properties:
        name:
          type: string
          maxLength: 39
        description:
          type: string
          maxLength: 1000
    TeamMember:
      type: object
      required: [username, displayName, role, since]
      properties:
        username:
          type: string
        displayName:
          type: string
        role:
          type: string
          enum: [maintainer, member]
        since:
          type: string
          format: date-time
    TeamRoleRequest:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [maintainer, member]
    OrgInviteRequest:
      type: object
      required: [email, role]
      properties:
        email:
          type: string
          maxLength: 254
        role:
          $ref: "#/components/schemas/OrgRole"
        teams:
          type: array
          maxItems: 20
          items:
            type: string
            maxLength: 39
    OrgInvite:
      type: object
      required: [id, email, role, teams, expiresAt, createdAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        role:
          $ref: "#/components/schemas/OrgRole"
        teams:
          type: array
          items:
            type: string
        invitedBy:
          type: string
        expiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        token:
          type: string
          description: Only at creation and only when mail is disabled; shown once
    OrgInviteAccepted:
      type: object
      required: [org, role]
      properties:
        org:
          type: string
        role:
          $ref: "#/components/schemas/OrgRole"
    Quota:
      type: object
      required: [maxRepos, maxStorageBytes, repos, storageBytes]
      properties:
        maxRepos:
          type: integer
          format: int32
          description: -1 means unlimited
        maxStorageBytes:
          type: integer
          format: int64
          description: -1 means unlimited
        repos:
          type: integer
          format: int32
        storageBytes:
          type: integer
          format: int64
    AuditEntry:
      type: object
      required: [id, at, action, targetType, targetId, ip, data]
      properties:
        id:
          type: string
          format: uuid
        at:
          type: string
          format: date-time
        actorId:
          type: string
          format: uuid
        actor:
          type: string
          description: Username of the actor; absent when anonymous or deleted
        action:
          type: string
        targetType:
          type: string
        targetId:
          type: string
        ip:
          type: string
        orgId:
          type: string
          format: uuid
        data:
          type: object
          additionalProperties: true
    AuditPage:
      type: object
      required: [entries]
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/AuditEntry"
        next:
          type: string
          format: uuid
          description: Cursor of the next page (pass as before); absent on the last page
    ReleaseAsset:
      type: object
      required: [id, name, label, contentType, size, sha256, downloadCount, createdAt]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        label: {type: string}
        contentType: {type: string}
        size: {type: integer, format: int64}
        sha256: {type: string, description: Hex digest}
        downloadCount: {type: integer, format: int64}
        createdAt: {type: string, format: date-time}
    ReleaseAssetUpdate:
      type: object
      properties:
        name: {type: string, maxLength: 255}
        label: {type: string, maxLength: 255}
    Release:
      type: object
      required: [id, tag, name, body, draft, prerelease, latest, target, commit, author, createdAt, assets]
      properties:
        id: {type: string, format: uuid}
        tag: {type: string}
        name: {type: string}
        body: {type: string, description: Markdown release notes}
        draft: {type: boolean}
        prerelease: {type: boolean}
        latest: {type: boolean, description: True for the release returned by getLatestRelease}
        target: {type: string, description: Branch or commit the tag was or will be created from; empty means the default branch}
        commit: {type: string, description: Commit of the tag once published; empty for drafts}
        author: {type: string, description: Username of the author; empty when unknown}
        createdAt: {type: string, format: date-time}
        publishedAt: {type: string, format: date-time, nullable: true}
        assets:
          type: array
          items:
            $ref: "#/components/schemas/ReleaseAsset"
    ReleaseCreate:
      type: object
      required: [tag]
      properties:
        tag: {type: string}
        name: {type: string, maxLength: 255}
        body: {type: string, maxLength: 125000}
        draft: {type: boolean}
        prerelease: {type: boolean}
        target: {type: string}
    ReleaseUpdate:
      type: object
      properties:
        tag: {type: string}
        name: {type: string, maxLength: 255}
        body: {type: string, maxLength: 125000}
        draft: {type: boolean}
        prerelease: {type: boolean}
        target: {type: string}
    # --- code browsing schemas ---
    ResolvedRef:
      type: object
      required: [ref, kind, name, commit]
      properties:
        ref: {type: string, description: The ref as requested (the default branch when empty)}
        kind: {type: string, enum: [branch, tag, commit]}
        name: {type: string, description: Full ref name; empty for a commit id}
        commit: {type: string, description: Full commit id}
    CommitUser:
      type: object
      description: |
        An account linked to a commit address for display, not verification
        of authorship. Only the username and avatar are given.
      required: [username, avatarUrl]
      properties:
        username: {type: string}
        avatarUrl: {type: string, description: Absolute https URL of the avatar; empty when unset}
    GitPerson:
      type: object
      required: [name, email, date]
      properties:
        name: {type: string}
        email: {type: string}
        date: {type: string, format: date-time}
        user: {$ref: "#/components/schemas/CommitUser"}
    GitCommit:
      type: object
      required: [sha, parents, author, committer, summary, message]
      properties:
        sha: {type: string}
        parents:
          type: array
          items: {type: string}
        author: {$ref: "#/components/schemas/GitPerson"}
        committer: {$ref: "#/components/schemas/GitPerson"}
        summary: {type: string}
        message: {type: string}
        claudeCoauthor:
          description: Display-only account for a matching Claude co-author trailer.
          allOf:
            - $ref: "#/components/schemas/CommitUser"
    GitCommitSummary:
      type: object
      required: [sha, summary, author, date]
      properties:
        sha: {type: string}
        summary: {type: string}
        author: {type: string, description: Author name}
        date: {type: string, format: date-time}
        authorUser: {$ref: "#/components/schemas/CommitUser"}
    TreeEntry:
      type: object
      required: [name, path, type, mode, oid, size]
      properties:
        name: {type: string}
        path: {type: string}
        type: {type: string, enum: [blob, tree, symlink, submodule]}
        mode: {type: string}
        oid: {type: string}
        size: {type: integer, format: int64, description: Bytes; -1 for trees and submodules}
        lastCommit: {$ref: "#/components/schemas/GitCommitSummary"}
    Tree:
      type: object
      required: [ref, path, entries, truncated]
      properties:
        ref: {$ref: "#/components/schemas/ResolvedRef"}
        path: {type: string}
        entries:
          type: array
          items: {$ref: "#/components/schemas/TreeEntry"}
        truncated: {type: boolean, description: The directory has more entries than listed}
        readme: {type: string, description: Path of the README of the directory}
    LfsPointer:
      type: object
      required: [oid, size]
      properties:
        oid: {type: string, description: SHA-256 of the content}
        size: {type: integer, format: int64}
    BlobFile:
      type: object
      required: [ref, path, oid, mode, size, binary, truncated, contentType]
      properties:
        ref: {$ref: "#/components/schemas/ResolvedRef"}
        path: {type: string}
        oid: {type: string}
        mode: {type: string}
        size: {type: integer, format: int64}
        binary: {type: boolean}
        lfs: {$ref: "#/components/schemas/LfsPointer"}
        content: {type: string, description: UTF-8 text; absent for binary or too large files}
        truncated: {type: boolean, description: The file is too large to be shown inline}
        contentType: {type: string, description: Type served by the raw endpoint}
    BlameRange:
      type: object
      required: [commit, startLine, lines]
      properties:
        commit: {$ref: "#/components/schemas/GitCommitSummary"}
        startLine: {type: integer, description: 1-based}
        lines: {type: integer}
    Blame:
      type: object
      required: [ref, path, lines, ranges]
      properties:
        ref: {$ref: "#/components/schemas/ResolvedRef"}
        path: {type: string}
        lines:
          type: array
          items: {type: string}
        ranges:
          type: array
          items: {$ref: "#/components/schemas/BlameRange"}
    CommitPage:
      type: object
      required: [ref, commits, hasMore]
      properties:
        ref: {$ref: "#/components/schemas/ResolvedRef"}
        commits:
          type: array
          items: {$ref: "#/components/schemas/GitCommit"}
        hasMore: {type: boolean}
    Contributor:
      type: object
      required: [name, commits]
      properties:
        name: {type: string, description: Most recent author name}
        commits: {type: integer}
        username: {type: string, description: Set when a verified address of a user matches}
        avatarUrl: {type: string, description: Absolute https URL of the avatar of that user}
    ContributorList:
      type: object
      required: [total, items]
      properties:
        total: {type: integer, description: Distinct contributors found, which can exceed the items returned}
        items:
          type: array
          items: {$ref: "#/components/schemas/Contributor"}
    Language:
      type: object
      required: [name, bytes, percent, color]
      properties:
        name: {type: string}
        bytes: {type: integer, format: int64}
        percent: {type: number, format: double, description: Share of the counted bytes, 0 to 100 with one decimal}
        color: {type: string, description: "Colour as #rrggbb"}
    LanguageList:
      type: object
      required: [totalBytes, items]
      properties:
        totalBytes: {type: integer, format: int64, description: Bytes counted across all languages}
        items:
          type: array
          description: Most bytes first; the folded Other item is last
          items: {$ref: "#/components/schemas/Language"}
    DiffLine:
      type: object
      required: [type, oldLine, newLine, text]
      properties:
        type: {type: string, enum: [context, add, delete, no-newline]}
        oldLine: {type: integer, description: 0 when the line is not on the old side}
        newLine: {type: integer, description: 0 when the line is not on the new side}
        text: {type: string}
    DiffHunk:
      type: object
      required: [header, oldStart, oldLines, newStart, newLines, lines]
      properties:
        header: {type: string}
        oldStart: {type: integer}
        oldLines: {type: integer}
        newStart: {type: integer}
        newLines: {type: integer}
        lines:
          type: array
          items: {$ref: "#/components/schemas/DiffLine"}
    FileDiff:
      type: object
      required: [status, oldPath, newPath, oldMode, newMode, oldOid, newOid, similarity, binary, additions, deletions, hunks, truncated]
      properties:
        status: {type: string, enum: [added, modified, deleted, renamed, copied]}
        oldPath: {type: string}
        newPath: {type: string}
        oldMode: {type: string}
        newMode: {type: string}
        oldOid: {type: string}
        newOid: {type: string}
        similarity: {type: integer}
        binary: {type: boolean}
        additions: {type: integer}
        deletions: {type: integer}
        hunks:
          type: array
          items: {$ref: "#/components/schemas/DiffHunk"}
        truncated: {type: boolean}
    Diff:
      type: object
      required: [files, additions, deletions, truncated]
      properties:
        files:
          type: array
          items: {$ref: "#/components/schemas/FileDiff"}
        additions: {type: integer}
        deletions: {type: integer}
        truncated: {type: boolean, description: Lines or files were dropped}
    CommitDetail:
      type: object
      required: [commit, diff]
      properties:
        commit: {$ref: "#/components/schemas/GitCommit"}
        diff: {$ref: "#/components/schemas/Diff"}
    Branch:
      type: object
      required: [name, commit, default]
      properties:
        name: {type: string}
        commit: {$ref: "#/components/schemas/GitCommitSummary"}
        default: {type: boolean}
        ahead: {type: integer, description: Commits not in the default branch}
        behind: {type: integer, description: Commits of the default branch missing here}
    BranchPage:
      type: object
      required: [items, hasMore]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/Branch"}
        hasMore: {type: boolean}
    GitTag:
      type: object
      required: [name, commit, annotated, message]
      properties:
        name: {type: string}
        commit: {$ref: "#/components/schemas/GitCommitSummary"}
        annotated: {type: boolean}
        message: {type: string, description: Subject of an annotated tag}
        tagger: {$ref: "#/components/schemas/GitPerson"}
    TagPage:
      type: object
      required: [items, hasMore]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/GitTag"}
        hasMore: {type: boolean}
    Comparison:
      type: object
      required: [base, head, mergeBase, ahead, behind, commits, commitsTruncated, diff]
      properties:
        base: {$ref: "#/components/schemas/ResolvedRef"}
        head: {$ref: "#/components/schemas/ResolvedRef"}
        mergeBase: {type: string}
        ahead: {type: integer}
        behind: {type: integer}
        commits:
          type: array
          items: {$ref: "#/components/schemas/GitCommit"}
        commitsTruncated: {type: boolean}
        diff: {$ref: "#/components/schemas/Diff"}
    CodeMatch:
      type: object
      required: [path, line, text]
      properties:
        path: {type: string}
        line: {type: integer}
        text: {type: string}
    CodeSearchResult:
      type: object
      required: [ref, matches, truncated]
      properties:
        ref: {$ref: "#/components/schemas/ResolvedRef"}
        matches:
          type: array
          items: {$ref: "#/components/schemas/CodeMatch"}
        truncated: {type: boolean}
    FileEdit:
      type: object
      required: [op, path]
      properties:
        op: {type: string, enum: [create, update, delete]}
        path: {type: string, minLength: 1, maxLength: 4096}
        content: {type: string, description: New content (create, update)}
        encoding: {type: string, enum: [utf-8, base64], default: utf-8}
        branch: {type: string, maxLength: 255, description: Branch to start from; default branch when empty}
        newBranch: {type: string, maxLength: 255, description: Commit on this new branch instead}
        sha: {type: string, description: Blob id the edit started from (update, delete)}
        message: {type: string, maxLength: 65536}
    FileEditResult:
      type: object
      required: [branch, commit]
      properties:
        branch: {type: string}
        commit: {$ref: "#/components/schemas/GitCommit"}
    # --- end code browsing schemas ---
    # --- issues schemas ---
    Issue:
      type: object
      required: [id, number, title, body, state, stateReason, locked, lockReason, author, labels, assignees, commentCount, reactions, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        number: {type: integer, format: int64, description: Shared with the pull requests of the repository}
        title: {type: string}
        body: {type: string, description: Markdown}
        state: {type: string, enum: [open, closed]}
        stateReason: {type: string, description: "completed, not_planned or duplicate when closed; reopened after a reopen; empty otherwise"}
        locked: {type: boolean}
        lockReason: {type: string, description: "off-topic, too heated, resolved, spam or empty"}
        author: {type: string, description: Username; empty when the account is gone}
        labels:
          type: array
          items:
            $ref: "#/components/schemas/Label"
        assignees:
          type: array
          items: {type: string}
        milestone:
          $ref: "#/components/schemas/Milestone"
        commentCount: {type: integer}
        reactions:
          type: array
          items:
            $ref: "#/components/schemas/ReactionGroup"
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        closedAt: {type: string, format: date-time, nullable: true}
        closedBy: {type: string, description: Username of who closed it}
        editedAt: {type: string, format: date-time, nullable: true}
    IssueCreate:
      type: object
      required: [title]
      properties:
        title: {type: string, maxLength: 255}
        body: {type: string, maxLength: 65536}
        labels:
          type: array
          items: {type: string}
        assignees:
          type: array
          items: {type: string}
        milestoneId: {type: string, format: uuid}
    IssueUpdate:
      type: object
      properties:
        title: {type: string, maxLength: 255}
        body: {type: string, maxLength: 65536}
        state: {type: string, enum: [open, closed]}
        stateReason: {type: string, description: "On close: completed (default), not_planned or duplicate"}
        labels:
          type: array
          items: {type: string}
        assignees:
          type: array
          items: {type: string}
        milestoneId: {type: string, description: Milestone id; empty clears it}
    IssueLock:
      type: object
      properties:
        lockReason: {type: string, description: "off-topic, too heated, resolved, spam or empty"}
    Label:
      type: object
      required: [id, name, color, description]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        color: {type: string, description: Six lowercase hex digits, without "#"}
        description: {type: string}
    LabelCreate:
      type: object
      required: [name, color]
      properties:
        name: {type: string, maxLength: 50}
        color: {type: string, pattern: "^#?[0-9a-fA-F]{6}$"}
        description: {type: string, maxLength: 100}
    LabelUpdate:
      type: object
      properties:
        name: {type: string, maxLength: 50}
        color: {type: string, pattern: "^#?[0-9a-fA-F]{6}$"}
        description: {type: string, maxLength: 100}
    Milestone:
      type: object
      required: [id, title, description, state, openIssues, closedIssues, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        title: {type: string}
        description: {type: string}
        state: {type: string, enum: [open, closed]}
        dueOn: {type: string, format: date-time, nullable: true}
        openIssues: {type: integer, format: int64}
        closedIssues: {type: integer, format: int64}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        closedAt: {type: string, format: date-time, nullable: true}
    MilestoneCreate:
      type: object
      required: [title]
      properties:
        title: {type: string, maxLength: 255}
        description: {type: string, maxLength: 65536}
        dueOn: {type: string, format: date-time}
    MilestoneUpdate:
      type: object
      properties:
        title: {type: string, maxLength: 255}
        description: {type: string, maxLength: 65536}
        dueOn: {type: string, description: RFC 3339 date-time; empty clears it}
        state: {type: string, enum: [open, closed]}
    IssueComment:
      type: object
      required: [id, issueNumber, author, body, createdAt, updatedAt, reactions]
      properties:
        id: {type: string, format: uuid}
        issueNumber: {type: integer, format: int64}
        author: {type: string}
        body: {type: string, description: Markdown}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        editedAt: {type: string, format: date-time, nullable: true}
        editedBy: {type: string}
        reactions:
          type: array
          items:
            $ref: "#/components/schemas/ReactionGroup"
    CommentBody:
      type: object
      required: [body]
      properties:
        body: {type: string, minLength: 1, maxLength: 65536}
    BodyEdit:
      type: object
      required: [id, editor, body, createdAt]
      properties:
        id: {type: string, format: uuid}
        editor: {type: string, description: Username of who made the edit}
        body: {type: string, description: The body before the edit}
        createdAt: {type: string, format: date-time}
    Reaction:
      type: object
      required: [id, content, user, createdAt]
      properties:
        id: {type: string, format: uuid}
        content: {type: string}
        user: {type: string}
        createdAt: {type: string, format: date-time}
    ReactionRequest:
      type: object
      required: [content]
      properties:
        content: {type: string, description: "+1, -1, laugh, hooray, confused, heart, rocket or eyes"}
    ReactionGroup:
      type: object
      required: [content, count, viewerReacted]
      properties:
        content: {type: string}
        count: {type: integer, format: int64}
        viewerReacted: {type: boolean}
    TimelineSource:
      type: object
      required: [kind, redacted]
      description: Where an issue was referenced from
      properties:
        kind: {type: string, enum: [issue, pull, commit]}
        redacted: {type: boolean, description: The source is in a repository the caller cannot read; nothing else is set}
        repo: {type: string, description: owner/name}
        number: {type: integer, format: int64}
        title: {type: string}
        commit: {type: string}
    TimelineEvent:
      type: object
      required: [id, event, actor, createdAt]
      properties:
        id: {type: string, format: uuid}
        event:
          type: string
          description: |
            commented, closed, reopened, renamed, labeled, unlabeled, assigned,
            unassigned, milestoned, demilestoned, locked, unlocked, referenced
            or cross-referenced
        actor: {type: string}
        createdAt: {type: string, format: date-time}
        label:
          $ref: "#/components/schemas/Label"
        assignee: {type: string}
        milestone: {type: string, description: Milestone title at the time of the event}
        renameFrom: {type: string}
        renameTo: {type: string}
        stateReason: {type: string}
        lockReason: {type: string}
        comment:
          $ref: "#/components/schemas/IssueComment"
        source:
          $ref: "#/components/schemas/TimelineSource"
    IssueTemplate:
      type: object
      required: [kind, fileName, name, about, title, labels, assignees, body]
      properties:
        kind: {type: string, enum: [markdown, form]}
        fileName: {type: string}
        name: {type: string}
        about: {type: string, description: The about of a markdown template or the description of a form}
        title: {type: string, description: Default issue title}
        labels:
          type: array
          items: {type: string}
        assignees:
          type: array
          items: {type: string}
        body: {type: string, description: Body of a markdown template; empty for forms}
        form:
          type: array
          description: The body elements of an issue form, as written in the YAML file
          items:
            type: object
            additionalProperties: true
    IssueContactLink:
      type: object
      required: [name, url, about]
      properties:
        name: {type: string}
        url: {type: string}
        about: {type: string}
    IssueTemplateConfig:
      type: object
      required: [blankIssuesEnabled, contactLinks]
      properties:
        blankIssuesEnabled: {type: boolean}
        contactLinks:
          type: array
          items:
            $ref: "#/components/schemas/IssueContactLink"
    IssueTemplates:
      type: object
      required: [templates, config]
      properties:
        templates:
          type: array
          items:
            $ref: "#/components/schemas/IssueTemplate"
        config:
          $ref: "#/components/schemas/IssueTemplateConfig"
    IssueAttachment:
      type: object
      required: [id, name, size, contentType, url, createdAt]
      description: Returned by the attachment upload (outside this document)
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        size: {type: integer, format: int64}
        contentType: {type: string}
        url: {type: string, description: Download path, to use in Markdown}
        createdAt: {type: string, format: date-time}
    # --- end issues schemas ---
    # --- pulls schemas ---
    PullRef:
      type: object
      required: [repo, ref, sha]
      properties:
        repo: {type: string, description: owner/name; empty when the head repository is gone}
        ref: {type: string, description: Branch name}
        sha: {type: string}
    PullRequest:
      type: object
      required: [issue, state, draft, head, base, mergeBase, mergeable, conflictFiles, mergedBy, mergeCommit, mergeMethod,
        requestedReviewers]
      properties:
        issue: {$ref: "#/components/schemas/Issue"}
        state: {type: string, enum: [open, closed, merged]}
        draft: {type: boolean}
        head: {$ref: "#/components/schemas/PullRef"}
        base: {$ref: "#/components/schemas/PullRef"}
        mergeBase: {type: string}
        mergeable: {type: string, enum: [unknown, clean, conflict, error]}
        conflictFiles:
          type: array
          items: {type: string}
        mergedAt: {type: string, format: date-time, nullable: true}
        mergedBy: {type: string}
        mergeCommit: {type: string, description: The commit the base branch was moved to}
        mergeMethod: {type: string, description: "merge, squash or rebase; empty when not merged"}
        autoMerge: {$ref: "#/components/schemas/PullAutoMerge"}
        requestedReviewers:
          type: array
          items: {type: string}
    PullRequestCreate:
      type: object
      required: [title, head, base]
      properties:
        title: {type: string, maxLength: 255}
        body: {type: string, maxLength: 65536}
        head: {type: string, description: Branch of headRepo}
        headRepo: {type: string, description: owner/name of the head repository; default this repository}
        base: {type: string, description: Branch of this repository}
        draft: {type: boolean}
    PullRequestUpdate:
      type: object
      properties:
        title: {type: string, maxLength: 255}
        body: {type: string, maxLength: 65536}
        state: {type: string, enum: [open, closed]}
        base: {type: string}
        draft: {type: boolean}
    PullCommitPage:
      type: object
      required: [items, hasMore]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/GitCommit"}
        hasMore: {type: boolean}
    PullFile:
      type: object
      required: [status, oldPath, newPath, additions, deletions, binary]
      properties:
        status: {type: string, enum: [added, modified, deleted, renamed, copied]}
        oldPath: {type: string}
        newPath: {type: string}
        additions: {type: integer}
        deletions: {type: integer}
        binary: {type: boolean}
    PullCodeOwners:
      type: object
      required: [pattern, owners, paths, approved]
      properties:
        pattern: {type: string}
        owners:
          type: array
          items: {type: string}
        paths:
          type: array
          items: {type: string}
        approved: {type: boolean}
    PullMergeability:
      type: object
      required: [state, mergeable, canMerge, conflictFiles, headSha, baseSha, mergeBase, rule, requiredApprovals, approvals,
        missingChecks, behind, codeOwners, codeOwnersErrors, violations]
      properties:
        state: {type: string, enum: [open, closed, merged]}
        mergeable: {type: string, enum: [unknown, clean, conflict, error], description: Whether the branches merge without conflicts}
        canMerge: {type: boolean, description: Open, without conflicts and every requirement met}
        conflictFiles:
          type: array
          items: {type: string}
        headSha: {type: string}
        baseSha: {type: string}
        mergeBase: {type: string}
        rule: {type: string, description: Pattern of the protection rule of the base; empty when none}
        requiredApprovals: {type: integer}
        approvals: {type: integer}
        missingChecks:
          type: array
          items: {type: string}
        behind: {type: boolean}
        codeOwners:
          type: array
          items: {$ref: "#/components/schemas/PullCodeOwners"}
        codeOwnersFile: {type: string}
        codeOwnersErrors:
          type: array
          items: {type: string}
        violations:
          type: array
          items: {$ref: "#/components/schemas/ProtectionViolation"}
    PullMergeRequest:
      type: object
      properties:
        method: {type: string, enum: [merge, squash, rebase], description: Default merge}
        title: {type: string, maxLength: 255, description: Subject of the merge or squash commit}
        message: {type: string, maxLength: 65536}
        sha: {type: string, description: Expected head commit; 409 when the head moved}
        deleteBranch: {type: boolean, description: Delete the head branch after the merge}
    PullMergeResult:
      type: object
      required: [sha]
      properties:
        sha: {type: string, description: The new tip of the branch}
    PullUpdateBranchRequest:
      type: object
      properties:
        method: {type: string, enum: [merge, rebase], description: Default merge}
        expectedHeadSha: {type: string, description: Expected head commit; empty skips the check}
    LinkedPull:
      type: object
      required: [repo, number, title, state, draft, author]
      properties:
        repo: {type: string, description: owner/name of the pull request repository}
        number: {type: integer, format: int64}
        title: {type: string}
        state: {type: string, enum: [open, closed, merged]}
        draft: {type: boolean}
        author: {type: string, description: Username of the author; empty when deleted}
    PullAutoMerge:
      type: object
      required: [method, enabledBy, title, message, deleteBranch]
      properties:
        method: {type: string, enum: [merge, squash, rebase]}
        enabledBy: {type: string}
        title: {type: string}
        message: {type: string}
        deleteBranch: {type: boolean}
    PullAutoMergeRequest:
      type: object
      properties:
        method: {type: string, enum: [merge, squash, rebase], description: Default merge}
        title: {type: string, maxLength: 255}
        message: {type: string, maxLength: 65536}
        deleteBranch: {type: boolean}
    PullReviewers:
      type: object
      required: [reviewers]
      properties:
        reviewers:
          type: array
          maxItems: 50
          items: {type: string}
    PullReview:
      type: object
      required: [id, reviewer, state, body, commitSha, createdAt]
      properties:
        id: {type: string, format: uuid}
        reviewer: {type: string}
        state: {type: string, enum: [pending, commented, approved, changes_requested, dismissed]}
        body: {type: string}
        commitSha: {type: string, description: Head commit the review was given on}
        submittedAt: {type: string, format: date-time, nullable: true}
        dismissedAt: {type: string, format: date-time, nullable: true}
        dismissedBy: {type: string}
        dismissMessage: {type: string}
        createdAt: {type: string, format: date-time}
    PullReviewDraftComment:
      type: object
      required: [path, line, body]
      properties:
        path: {type: string}
        side: {type: string, enum: [LEFT, RIGHT], description: Default RIGHT}
        line: {type: integer, minimum: 1, description: Last line of the commented range}
        startLine: {type: integer, minimum: 1, description: First line of a multi-line range}
        body: {type: string, maxLength: 65536}
    PullReviewCreate:
      type: object
      properties:
        event: {type: string, enum: [approve, request_changes, comment], description: Submit at once; empty leaves the review pending}
        body: {type: string, maxLength: 65536}
        commitSha: {type: string, description: Head commit reviewed; default the current head}
        comments:
          type: array
          maxItems: 100
          items: {$ref: "#/components/schemas/PullReviewDraftComment"}
    PullReviewSubmit:
      type: object
      required: [event]
      properties:
        event: {type: string, enum: [approve, request_changes, comment]}
        body: {type: string, maxLength: 65536}
    PullReviewDismiss:
      type: object
      required: [message]
      properties:
        message: {type: string, maxLength: 1000}
    PullReviewComment:
      type: object
      required: [id, reviewId, author, path, side, originalLine, originalCommitSha, commitSha, diffHunk, body, outdated,
        resolved, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        reviewId: {type: string, description: Empty for a reply published outside a review}
        pending: {type: boolean, description: Part of the caller's pending review}
        inReplyTo: {type: string, description: First comment of the thread; empty for the first one}
        author: {type: string}
        path: {type: string}
        side: {type: string, enum: [LEFT, RIGHT]}
        line: {type: integer, nullable: true, description: Line at the current head; null when outdated}
        startLine: {type: integer, nullable: true}
        originalLine: {type: integer}
        originalStartLine: {type: integer, nullable: true}
        originalCommitSha: {type: string}
        commitSha: {type: string, description: Head commit line refers to}
        diffHunk: {type: string, description: The lines around the comment when it was written}
        body: {type: string}
        outdated: {type: boolean}
        resolved: {type: boolean}
        resolvedBy: {type: string}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    PullReviewCommentCreate:
      type: object
      required: [body]
      properties:
        body: {type: string, maxLength: 65536}
        inReplyTo: {type: string, format: uuid, description: Any comment of the thread to reply to}
        path: {type: string}
        side: {type: string, enum: [LEFT, RIGHT], description: Default RIGHT}
        line: {type: integer, minimum: 1}
        startLine: {type: integer, minimum: 1}
        commitSha: {type: string, description: Head commit the line refers to; default the current head}
    PullSuggestionApply:
      type: object
      properties:
        message: {type: string, maxLength: 65536, description: Commit message; a default one names the comment}
    ForkCreate:
      type: object
      properties:
        owner: {type: string, description: User or organization; default the caller}
        name: {type: string, description: Default the name of the parent}
    MergeUpstreamInput:
      type: object
      properties:
        branch: {type: string, maxLength: 255, description: Default the default branch of the fork}
    MergeUpstreamResult:
      type: object
      required: [mergeType, baseBranch, branch]
      properties:
        mergeType: {type: string, enum: [fast-forward, none]}
        baseBranch: {type: string, description: "<parent owner>:<branch>"}
        branch: {type: string}
    # --- end pulls schemas ---
    # --- branch protection schemas ---
    BranchProtectionInput:
      type: object
      required: [pattern]
      properties:
        pattern: {type: string, minLength: 1, maxLength: 255, description: Glob on the branch name}
        requiredApprovals: {type: integer, minimum: 0, maximum: 10, description: Approving reviews a pull request needs before merging}
        requireCodeOwnerReviews: {type: boolean, description: A code owner of every changed path must approve}
        dismissStaleReviews: {type: boolean, description: A new push dismisses the approvals given before it}
        requiredStatusChecks:
          type: array
          maxItems: 50
          items: {type: string, minLength: 1, maxLength: 255}
          description: Status check contexts that must succeed on the head commit
        requiredCheckApps:
          type: object
          additionalProperties: {type: integer, format: int64, minimum: 1}
          description: >-
            App id (the GitHub-style numeric id) that must report a required context with its check runs;
            contexts not listed accept any reporter
        strictStatusChecks: {type: boolean, description: The branch must be up to date with the base before merging}
        requireLinearHistory: {type: boolean, description: Reject merge commits}
        allowForcePushes: {type: boolean, description: Allow non fast-forward updates (default false)}
        allowDeletions: {type: boolean, description: Allow deleting the branch (default false)}
        requireSignedCommits: {type: boolean, description: Every new commit needs a verified GPG or SSH signature}
        restrictPushes: {type: boolean, description: Only pushUsers and pushTeams may push}
        pushUsers:
          type: array
          maxItems: 100
          items: {type: string}
          description: Usernames allowed to push when restrictPushes is set
        pushTeams:
          type: array
          maxItems: 100
          items: {type: string}
          description: Teams of the owning organization allowed to push when restrictPushes is set
        adminsBypass: {type: boolean, description: Repository admins are exempt from the rule (default false)}
    BranchProtection:
      type: object
      required: [id, pattern, requiredApprovals, requireCodeOwnerReviews, dismissStaleReviews, requiredStatusChecks,
        strictStatusChecks, requireLinearHistory, allowForcePushes, allowDeletions, requireSignedCommits,
        restrictPushes, pushUsers, pushTeams, adminsBypass, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        pattern: {type: string}
        requiredApprovals: {type: integer}
        requireCodeOwnerReviews: {type: boolean}
        dismissStaleReviews: {type: boolean}
        requiredStatusChecks:
          type: array
          items: {type: string}
        requiredCheckApps:
          type: object
          additionalProperties: {type: integer, format: int64}
          description: App id that must report each listed required context
        strictStatusChecks: {type: boolean}
        requireLinearHistory: {type: boolean}
        allowForcePushes: {type: boolean}
        allowDeletions: {type: boolean}
        requireSignedCommits: {type: boolean}
        restrictPushes: {type: boolean}
        pushUsers:
          type: array
          items: {type: string}
        pushTeams:
          type: array
          items: {type: string}
        adminsBypass: {type: boolean}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    TagRuleLevel:
      type: string
      enum: [write, maintain, admin, none]
      description: Minimum repository permission for an action; none allows only the listed users and teams
    TagRuleInput:
      type: object
      required: [pattern]
      properties:
        pattern: {type: string, minLength: 1, maxLength: 255, description: Glob on the tag name}
        create: {$ref: "#/components/schemas/TagRuleLevel"}
        update: {$ref: "#/components/schemas/TagRuleLevel"}
        delete: {$ref: "#/components/schemas/TagRuleLevel"}
        allowedUsers:
          type: array
          maxItems: 100
          items: {type: string}
          description: Usernames allowed every action regardless of the levels
        allowedTeams:
          type: array
          maxItems: 100
          items: {type: string}
          description: Teams of the owning organization allowed every action
        adminsBypass: {type: boolean, description: Repository admins are exempt from the rule (default false)}
    TagRule:
      type: object
      required: [id, pattern, create, update, delete, allowedUsers, allowedTeams, adminsBypass, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        pattern: {type: string}
        create: {$ref: "#/components/schemas/TagRuleLevel"}
        update: {$ref: "#/components/schemas/TagRuleLevel"}
        delete: {$ref: "#/components/schemas/TagRuleLevel"}
        allowedUsers:
          type: array
          items: {type: string}
        allowedTeams:
          type: array
          items: {type: string}
        adminsBypass: {type: boolean}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    RefUpdateCheck:
      type: object
      required: [ref]
      properties:
        ref: {type: string, maxLength: 255, description: "Full ref name (refs/heads/main, refs/tags/v1) or a branch name"}
        old: {type: string, description: Current object id; empty reads it from the repository}
        new: {type: string, description: New object id; empty or all zeros means deletion}
        user: {type: string, description: Username to evaluate as; defaults to the caller}
    RefUpdateEvaluation:
      type: object
      required: [ref, kind, allowed, rule, violations]
      properties:
        ref: {type: string}
        kind: {type: string, enum: [branch, tag, other]}
        allowed: {type: boolean}
        rule: {type: string, description: Pattern of the rule that applies; empty when none}
        violations:
          type: array
          items:
            $ref: "#/components/schemas/ProtectionViolation"
    ProtectionViolation:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: "Machine-readable reason: push_restricted, force_push, deletion, linear_history, unsigned_commit, too_many_commits, pull_request_required, status_checks, tag_create, tag_update, tag_delete"
        message: {type: string}
        commit: {type: string, description: Offending commit, when the violation concerns one}
    # --- end branch protection schemas ---
    # --- webhooks schemas ---
    WebhookContentType:
      type: string
      enum: [json, form]
    WebhookFormat:
      type: string
      description: github sends GitHub-compatible headers and payloads; ervisio sends the native envelope
      enum: [github, ervisio]
    WebhookDeliveryStatus:
      type: string
      enum: [pending, ok, failed]
    Webhook:
      type: object
      required: [id, url, contentType, format, events, active, hasSecret, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        url: {type: string}
        contentType: {$ref: "#/components/schemas/WebhookContentType"}
        format: {$ref: "#/components/schemas/WebhookFormat"}
        events:
          type: array
          description: GitHub event names, or "*" for every event
          items: {type: string}
        active: {type: boolean}
        hasSecret: {type: boolean}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        lastDelivery: {$ref: "#/components/schemas/WebhookLastDelivery"}
    WebhookLastDelivery:
      type: object
      required: [status, statusCode, deliveredAt]
      properties:
        status: {$ref: "#/components/schemas/WebhookDeliveryStatus"}
        statusCode: {type: integer}
        deliveredAt: {type: string, format: date-time}
    WebhookCreate:
      type: object
      required: [url]
      properties:
        url: {type: string, maxLength: 2048}
        contentType: {$ref: "#/components/schemas/WebhookContentType"}
        format: {$ref: "#/components/schemas/WebhookFormat"}
        secret: {type: string, maxLength: 256}
        events:
          type: array
          maxItems: 32
          items: {type: string}
        active: {type: boolean}
    WebhookUpdate:
      type: object
      properties:
        url: {type: string, maxLength: 2048}
        contentType: {$ref: "#/components/schemas/WebhookContentType"}
        format: {$ref: "#/components/schemas/WebhookFormat"}
        secret: {type: string, maxLength: 256}
        events:
          type: array
          maxItems: 32
          items: {type: string}
        active: {type: boolean}
    WebhookDelivery:
      type: object
      required: [id, guid, event, action, redelivery, status, attempts, statusCode, durationMs, error, createdAt]
      properties:
        id: {type: string, format: uuid}
        guid: {type: string, format: uuid, description: Value of the delivery header, shared by redeliveries}
        event: {type: string}
        action: {type: string}
        redelivery: {type: boolean}
        status: {$ref: "#/components/schemas/WebhookDeliveryStatus"}
        attempts: {type: integer}
        statusCode: {type: integer}
        durationMs: {type: integer}
        error: {type: string}
        createdAt: {type: string, format: date-time}
        deliveredAt: {type: string, format: date-time, nullable: true}
    WebhookDeliveryDetail:
      type: object
      required: [delivery, url, requestHeaders, requestBody, responseHeaders, responseBody]
      properties:
        delivery: {$ref: "#/components/schemas/WebhookDelivery"}
        url: {type: string}
        requestHeaders:
          type: object
          additionalProperties: {type: string}
        requestBody: {type: string}
        responseHeaders:
          type: object
          additionalProperties: {type: string}
        responseBody: {type: string, description: Truncated}
    WebhookEventCatalog:
      type: object
      required: [events]
      properties:
        events:
          type: array
          description: GitHub event names; "*" (every event) first
          items: {type: string}
    # --- end webhooks schemas ---
    # --- notifications schemas ---
    NotificationReason:
      type: string
      enum: [author, assigned, mentioned, review_requested, subscribed, comment, state_change]
    NotificationThread:
      type: object
      required: [id, repoId, owner, repo, subjectType, number, title, reason, summary, unread, updatedAt]
      properties:
        id: {type: string, format: uuid}
        repoId: {type: string, format: uuid}
        owner: {type: string}
        repo: {type: string}
        subjectType:
          type: string
          enum: [issue, pull_request, release, commit]
        number: {type: integer, format: int64, description: Issue or pull request number; 0 otherwise}
        title: {type: string}
        reason: {$ref: "#/components/schemas/NotificationReason"}
        summary: {type: string}
        unread: {type: boolean}
        updatedAt: {type: string, format: date-time}
        lastReadAt: {type: string, format: date-time, nullable: true}
    NotificationsMarkRead:
      type: object
      properties:
        lastReadAt:
          type: string
          format: date-time
          description: Threads updated after this time stay unread (default now)
    NotificationCount:
      type: object
      required: [unread]
      properties:
        unread: {type: integer, format: int64}
    NotificationSettings:
      type: object
      required: [email]
      properties:
        email: {type: boolean, description: Also send notifications by mail}
    ThreadSubscription:
      type: object
      required: [subscribed, ignored, explicit]
      properties:
        subscribed: {type: boolean}
        ignored: {type: boolean}
        explicit: {type: boolean, description: False when the default rules apply}
    ThreadSubscriptionUpdate:
      type: object
      properties:
        ignored: {type: boolean, description: True unsubscribes from the subject}
    NotificationRepoCount:
      type: object
      required: [repoId, owner, repo, count, unread]
      properties:
        repoId: {type: string, format: uuid}
        owner: {type: string}
        repo: {type: string}
        count: {type: integer, format: int64, description: Threads matching the filter}
        unread: {type: integer, format: int64, description: Unread threads among them}
    NotificationSubject:
      type: object
      required: [subscription]
      properties:
        thread: {$ref: "#/components/schemas/NotificationThread"}
        subscription: {$ref: "#/components/schemas/ThreadSubscription"}
    RepoWatchLevel:
      type: string
      enum: [watching, participating, ignoring]
    RepoSubscription:
      type: object
      required: [level, explicit]
      properties:
        level: {$ref: "#/components/schemas/RepoWatchLevel"}
        explicit: {type: boolean}
    RepoSubscriptionUpdate:
      type: object
      required: [level]
      properties:
        level: {$ref: "#/components/schemas/RepoWatchLevel"}
    # --- end notifications schemas ---
    PresenceEnabled:
      type: object
      required: [enabled]
      properties:
        enabled: {type: boolean}
    PresenceUser:
      type: object
      required: [login, name, avatarUrl]
      properties:
        login: {type: string}
        name: {type: string, description: Display name, empty when unset}
        avatarUrl: {type: string, description: Empty when unset}
    PresenceFileState:
      type: string
      enum: [modified, added, deleted, renamed, conflicted]
    PresenceDirtyFile:
      type: object
      required: [path, state]
      properties:
        path: {type: string, maxLength: 4096}
        state:
          $ref: "#/components/schemas/PresenceFileState"
    Presence:
      type: object
      required: [user, clientId, branch, head, dirty, truncated, ahead, unpublished, active, updatedAt]
      properties:
        user:
          $ref: "#/components/schemas/PresenceUser"
        clientId: {type: string, format: uuid}
        branch: {type: string}
        head: {type: string}
        dirty:
          type: array
          items:
            $ref: "#/components/schemas/PresenceDirtyFile"
        truncated: {type: boolean}
        ahead: {type: integer}
        unpublished: {type: boolean}
        active: {type: boolean}
        updatedAt: {type: string, format: date-time}
    PresenceLock:
      type: object
      required: [id, path, branch, owner, lockedAt]
      properties:
        id: {type: string, format: uuid}
        path: {type: string}
        branch: {type: string, description: Short branch name}
        owner:
          $ref: "#/components/schemas/PresenceUser"
        lockedAt: {type: string, format: date-time}
    PresenceLockConflict:
      type: object
      required: [lock]
      properties:
        lock:
          $ref: "#/components/schemas/PresenceLock"
    PresenceLockCreate:
      type: object
      required: [path, branch]
      properties:
        path: {type: string, maxLength: 4096}
        branch: {type: string, maxLength: 255, description: Short branch name}
    PresenceState:
      type: object
      required: [enabled, canUse, canManage, canForceUnlock, interval, ttl, others, locks]
      properties:
        enabled: {type: boolean}
        canUse: {type: boolean}
        canManage: {type: boolean}
        canForceUnlock: {type: boolean}
        interval: {type: integer, description: Seconds between two heartbeats}
        ttl: {type: integer, description: Seconds a presence stays live after its last heartbeat}
        others:
          type: array
          description: Live presences of the other users
          items:
            $ref: "#/components/schemas/Presence"
        locks:
          type: array
          description: Every lock of the repository, on every branch
          items:
            $ref: "#/components/schemas/PresenceLock"
    PresenceHeartbeat:
      type: object
      required: [clientId]
      properties:
        clientId: {type: string, format: uuid}
        branch: {type: string, maxLength: 255}
        head: {type: string, maxLength: 64}
        dirty:
          type: array
          maxItems: 500
          items:
            $ref: "#/components/schemas/PresenceDirtyFile"
        truncated: {type: boolean}
        ahead: {type: integer, minimum: 0}
        unpublished: {type: boolean}
        active: {type: boolean}
    PresenceGone:
      type: object
      required: [login, clientId]
      properties:
        login: {type: string}
        clientId: {type: string, format: uuid}
    PresenceUnlock:
      type: object
      required: [id]
      properties:
        id: {type: string, format: uuid}
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          example: about:blank
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
