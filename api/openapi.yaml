  # --- end webhooks ---
  # --- notifications (tag: notifications) ---
  # In-app notifications (PLAN §5.5), GitHub-like. Mail copies follow the
  # user's notification settings.
  /notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      summary: Notification threads of the caller, most recently updated first
      description: Unread threads only unless all is true; done threads are never listed.
      security:
        - session: []
        - token: [user:read]
      parameters:
        - name: all
          in: query
          schema: {type: boolean, default: false}
        - name: participating
          in: query
          description: Only threads where the caller is directly involved (reason other than subscribed)
          schema: {type: boolean, default: false}
        - name: since
          in: query
          description: Only threads updated at or after this time
          schema: {type: string, format: date-time}
        - $ref: "#/components/parameters/NotificationRepo"
        - $ref: "#/components/parameters/PageOffset"
        - $ref: "#/components/parameters/PageLimit"
      responses:
        "200":
          description: Threads
          headers:
            X-Has-More:
              $ref: "#/components/headers/HasMore"
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/NotificationThread"}
        "400":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    put:
      operationId: markNotificationsRead
      tags: [notifications]
      summary: Mark every notification thread as read
      security:
        - session: []
        - token: [user:write]
      requestBody:
        content:
          application/json:
            schema: {$ref: "#/components/schemas/NotificationsMarkRead"}
      responses:
        "204":
          description: Marked as read
        "400":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /notifications/count:
    get:
      operationId: countNotifications
      tags: [notifications]
      summary: Number of unread notification threads (for polling)
      security:
        - session: []
        - token: [user:read]
      responses:
        "200":
          description: Unread count
          content:
            application/json:
              schema: {$ref: "#/components/schemas/NotificationCount"}
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /notifications/repos:
    get:
      operationId: listNotificationRepos
      tags: [notifications]
      summary: Number of notification threads per repository
      description: |
        The repositories with threads in the inbox, with the threads that
        match all and participating (as in GET /notifications) and the
        unread ones among them, the most recently updated first.
      security:
        - session: []
        - token: [user:read]
      parameters:
        - name: all
          in: query
          schema: {type: boolean, default: false}
        - name: participating
          in: query
          schema: {type: boolean, default: false}
