          $ref: "#/components/responses/Moved"
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteRepo
      tags: [repos]
      summary: Delete a repository
      description: Admins of the repository. The data is purged in the background.
      security:
        - session: []
        - token: [repo:write]
      responses:
        "204":
          description: Deleted
        "307":
          $ref: "#/components/responses/Moved"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /repos/{owner}/{name}/avatar:
    parameters:
      - $ref: "#/components/parameters/RepoOwner"
      - $ref: "#/components/parameters/RepoName"
    put:
      operationId: uploadRepoAvatar
      tags: [repos]
      summary: Upload the avatar image of a repository
      description: |
        Same body, limits and processing as PUT /user/avatar (PNG, JPEG or
        GIF, at most 2 MiB and 4096x4096 pixels, stored as a 460x460 PNG
        under a content-addressed name). Admins of the repository.
      security:
        - session: []
        - token: [repo:write]
      requestBody:
        required: true
        content:
          image/*:
            schema: {type: string, format: binary}
      responses:
        "200":
          description: Updated a repository
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Repo"
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteRepoAvatar
      tags: [repos]
      summary: Remove the avatar image of a repository
      description: Clears avatarUrl. Stored images are kept, their URLs are immutable. Admins of the repository.
      security:
        - session: []
        - token: [repo:write]
      responses:
        "200":
          description: Updated a repository
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Repo"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /repos/{owner}/{name}/transfer:
    parameters:
      - $ref: "#/components/parameters/RepoOwner"
      - $ref: "#/components/parameters/RepoName"
