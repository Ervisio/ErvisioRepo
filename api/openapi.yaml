      - $ref: "#/components/parameters/ErvisioCodeShareId"
    get:
      operationId: listErvisioCodeProposals
      tags: [users]
      summary: List proposals while the host is online or offline
      description: Proposal access is paused. This operation currently returns 403.
      security:
        - session: []
        - hubSession: []
      parameters:
