# nfpm package definition for .deb and .rpm. Driven by scripts/release/build.sh,
# which exports VERSION (no leading v), ARCH (amd64|arm64) and BIN_DIR.
name: ervisio-repo
arch: ${ARCH}
platform: linux
version: ${VERSION}
section: devel
priority: optional
maintainer: Ervisio <info@ervisio.dev>
description: |
  Ervisio Repo, a self-hosted Git forge with tiered storage, CI runners and
  a GitHub-compatible API.
vendor: Ervisio
homepage: https://github.com/Ervisio/ErvisioRepo
license: MIT

depends:
  - git
recommends:
  - postgresql
  - git-lfs

contents:
  # Versioned binaries; the "current" symlink is switched by postinstall.
  - src: ${BIN_DIR}/ervisio-repo
    dst: /usr/lib/ervisio-repo/versions/${VERSION}/ervisio-repo
    file_info: { mode: 0755 }
  - src: ${BIN_DIR}/ervisio-runner
    dst: /usr/lib/ervisio-repo/versions/${VERSION}/ervisio-runner
    file_info: { mode: 0755 }
  - src: ${BIN_DIR}/erepo
    dst: /usr/lib/ervisio-repo/versions/${VERSION}/erepo
    file_info: { mode: 0755 }

  - src: /usr/lib/ervisio-repo/current/ervisio-repo
    dst: /usr/bin/ervisio-repo
    type: symlink
  - src: /usr/lib/ervisio-repo/current/ervisio-runner
    dst: /usr/bin/ervisio-runner
    type: symlink
  - src: /usr/lib/ervisio-repo/current/erepo
    dst: /usr/bin/erepo
    type: symlink

  - src: packaging/config.toml
    dst: /etc/ervisio-repo/config.toml
    type: config|noreplace
    file_info: { mode: 0640, owner: root, group: ervisio-repo }

  - src: packaging/systemd/ervisio-repo.service
    dst: /usr/lib/systemd/system/ervisio-repo.service
  - src: packaging/systemd/ervisio-runner.service
    dst: /usr/lib/systemd/system/ervisio-runner.service
  - src: packaging/systemd/ervisio-repo.slice
    dst: /usr/lib/systemd/system/ervisio-repo.slice
  - src: packaging/systemd/ervisio-runner.slice
    dst: /usr/lib/systemd/system/ervisio-runner.slice

  - dst: /var/lib/ervisio-repo
    type: dir
    file_info: { mode: 0750, owner: ervisio-repo, group: ervisio-repo }

scripts:
  postinstall: packaging/scripts/postinstall.sh
  preremove: packaging/scripts/preremove.sh
